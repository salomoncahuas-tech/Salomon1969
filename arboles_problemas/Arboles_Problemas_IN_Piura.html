  --bg: #f4f7f4;
  --surface: #ffffff;
  --ink: #1d2a22;
  --muted: #56675c;
  --line: #ccd8cf;
  --anin: #1b4d2e;
  --anin-ink: #ffffff;
  --anin-soft: #e6efe8;
  --ci: #f3f7f4;
  --ci-line: #7fa48c;
  --ed: #f6e7c8;
  --ed-line: #b8862b;
  --ei: #fbf3e2;
  --ei-line: #c9a24f;
  --ef: #7f5212;
  --ex-line: #6b7a70;
  --wire: #4a5a50;
  --focus: #d08a12;
  --m: #1f6f78;
  --h: #6b5b95;
  --a: #9c4a2f;

    --ed: #3a2f17; --ed-line: #c99a3b; --ei: #2c2614; --ei-line: #a88638; --ef: #a8701f;

  }
}

  --bg: #0f1a14; --surface: #16251c; --ink: #e3ece5; --muted: #9fb3a6; --line: #2c4235;
  --anin: #2f7a4c; --anin-ink: #ffffff; --anin-soft: #1d3326; --ci: #18291f; --ci-line: #4f7c61;

* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--anin); }
.gut { padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.wrap { max-width: 1480px; margin: 0 auto; }

/* Banda institucional */
.banda { background: var(--anin); color: var(--anin-ink); padding-block: 18px 16px; }
.inst { display: grid; gap: 1px; font-size: 11px; letter-spacing: .04em; text-transform: uppercase; opacity: .92; }
.inst b { font-size: 12px; }
.banda h1 { font-size: clamp(22px, 2.6vw, 30px); line-height: 1.15; margin: 12px 0 4px; text-wrap: balance; }
.banda .sub { font-size: 13px; opacity: .9; }
.banda .ver { font-size: 12px; opacity: .8; margin-top: 6px; }

/* Pestañas */
.tabs { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line); }
.tabs .wrap { display: flex; gap: 4px; overflow-x: auto; scrollbar-width: thin; }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: inherit; font-weight: 700; padding: 13px 14px 11px; border-bottom: 3px solid transparent; cursor: pointer; white-space: nowrap; }
.tab:hover { color: var(--ink); }
.tab[aria-selected="true"] { color: var(--anin); border-bottom-color: var(--anin); }
:root[data-theme="dark"] .tab[aria-selected="true"] { color: var(--ink); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .tab[aria-selected="true"] { color: var(--ink); } }
.tab .k { font-family: var(--mono); font-weight: 500; font-size: 11px; margin-left: 6px; opacity: .75; }
.tab:focus-visible, button:focus-visible, .nodo:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

main { padding-block: 22px 40px; }
.vista[hidden] { display: none !important; }

/* Cabecera de cada árbol */
.cab { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: end; margin-bottom: 14px; }
.cab h2 { margin: 0; font-size: 21px; text-wrap: balance; }
.cab p { margin: 6px 0 0; color: var(--muted); max-width: 95ch; }
.ficha { display: flex; flex-wrap: wrap; gap: 6px 18px; margin: 12px 0 0; padding: 0; list-style: none; font-size: 12.5px; color: var(--muted); }
.ficha b { color: var(--ink); font-variant-numeric: tabular-nums; }
.ctrl { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
@media (max-width: 760px) { .cab { grid-template-columns: minmax(0, 1fr); } .ctrl { justify-content: flex-start; } }
.btn { appearance: none; font: inherit; font-size: 12.5px; font-weight: 700; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 7px 11px; cursor: pointer; }
.btn:hover { border-color: var(--anin); }
.btn[aria-pressed="true"] { background: var(--anin); color: var(--anin-ink); border-color: var(--anin); }

/* Zona de trabajo: lienzo + panel */
.zona { display: grid; grid-template-columns: minmax(0, 1fr) 340px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .zona { grid-template-columns: minmax(0, 1fr); } }
.lienzo-scroll { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); }
.lienzo { position: relative; min-width: 980px; padding: 24px 20px 18px; }
.lienzo svg.cables { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.nivel { position: relative; display: grid; gap: 14px; }
.nivel + .nivel { margin-top: 30px; }
.rotulo { position: absolute; left: -4px; top: -21px; z-index: 2; background: var(--surface); padding: 0 4px; font-size: 10.5px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.n-ef { grid-template-columns: minmax(0, 1fr); justify-items: center; }
.n-ef .nodo { width: min(64%, 860px); }
.n-pc { grid-template-columns: minmax(0, 1fr) minmax(0, 1.55fr) minmax(0, 1fr); align-items: center; gap: 34px; }
.col { display: grid; gap: 9px; align-content: start; }
.col .nodo.ci { margin-left: 22px; }
.col .cis { display: grid; gap: 9px; margin-top: 12px; }

.nodo { position: relative; z-index: 1; border-radius: 4px; padding: 9px 11px; font-size: 13px; line-height: 1.35; cursor: pointer; border: 1.5px solid; background: var(--surface); color: var(--ink); text-align: left; transition: opacity .15s, box-shadow .15s; }
.nodo .cod { font-family: var(--mono); font-size: 10.5px; color: var(--muted); display: block; margin-bottom: 2px; }
.nodo.ef { background: var(--ef); border-color: var(--ef); color: #fff; font-weight: 700; text-align: center; font-size: 14px; border-radius: 10px; }
.nodo.ef .cod, .nodo.pc .cod { color: rgba(255,255,255,.78); }
.nodo.ei { background: var(--ei); border-color: var(--ei-line); }
.nodo.ed { background: var(--ed); border-color: var(--ed-line); border-width: 2px; font-weight: 700; text-align: center; }
.nodo.pc { background: var(--anin); border-color: var(--anin); color: var(--anin-ink); font-weight: 700; font-size: 15.5px; text-align: center; border-radius: 12px; padding: 14px 18px; }
.nodo.pc .ind { display: block; font-weight: 400; font-size: 12px; margin-top: 8px; opacity: .9; }
.nodo.cd { background: var(--anin-soft); border-color: var(--anin); border-width: 2px; font-weight: 700; text-align: center; }
.nodo.ci { background: var(--ci); border-color: var(--ci-line); font-size: 12.5px; }
.nodo.ex { background: var(--surface); border: 1.5px dashed var(--ex-line); color: var(--muted); font-size: 12px; }
.nodo.ex b { color: var(--ink); display: block; margin-bottom: 3px; }
.nodo.sel { box-shadow: 0 0 0 3px var(--focus); }
.lienzo.foco .nodo:not(.ruta) { opacity: .28; }
.lienzo.foco .cables path:not(.ruta) { opacity: .15; }
.cables path { fill: none; stroke: var(--wire); stroke-width: 1.4; }
.cables path.ex { stroke: var(--ex-line); stroke-dasharray: 5 4; }
.cables path.ruta { stroke: var(--focus); stroke-width: 2.2; }
.provs { display: flex; gap: 4px; margin-top: 6px; flex-wrap: wrap; }
.nodo.cd .provs, .nodo.ed .provs, .nodo.ef .provs { justify-content: center; }
.pv { font-family: var(--mono); font-size: 10px; font-weight: 500; padding: 1px 5px; border-radius: 3px; color: #fff; letter-spacing: .02em; }

.pv.d1 { opacity: .55; } .pv.d2 { opacity: .8; }

.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px 16px 18px; position: sticky; top: calc(env(safe-area-inset-top, 0px) + 58px); max-height: calc(100vh - 80px); overflow: auto; }

.panel .tipo { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.panel dl { margin: 12px 0 0; display: grid; gap: 12px; }
.panel dt { font-size: 11px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 700; margin-bottom: 3px; }
.panel dd { margin: 0; }
.panel ul { margin: 0; padding-left: 18px; display: grid; gap: 5px; }
.panel .fuente { font-size: 12px; color: var(--muted); }
.panel .vacio { color: var(--muted); font-size: 13px; }
.chip { display: inline-block; font-size: 11.5px; font-weight: 700; padding: 2px 8px; border-radius: 99px; border: 1px solid var(--line); margin: 0 4px 4px 0; }

/* Esquema (vista de lista) */
.esquema { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 18px 20px; }
.esquema h4 { margin: 16px 0 6px; font-size: 12px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); }
.esquema h4:first-child { margin-top: 0; }
.esquema ol { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
.esquema ol ol { margin-top: 6px; }
.esquema .pcx { font-weight: 700; color: var(--anin); font-size: 15px; }
:root[data-theme="dark"] .esquema .pcx { color: var(--ink); }

/* Sustento y método */
.doc { display: grid; gap: 22px; }
.doc section { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 20px 22px; min-width: 0; }
.doc h2 { margin: 0 0 10px; font-size: 19px; }
.doc h3 { margin: 18px 0 6px; font-size: 15px; }
.doc p, .doc li { max-width: 100ch; }
.pasos { counter-reset: p; list-style: none; padding: 0; display: grid; gap: 10px; }
.pasos li { counter-increment: p; display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; }
.pasos li::before { content: counter(p); font-family: var(--mono); font-weight: 600; width: 26px; height: 26px; border-radius: 50%; background: var(--anin-soft); color: var(--ink); display: grid; place-items: center; font-size: 12.5px; }
.tabla-scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; min-width: 760px; }
th, td { border: 1px solid var(--line); padding: 7px 8px; vertical-align: top; text-align: left; }
thead th { background: var(--anin); color: var(--anin-ink); font-weight: 700; position: sticky; top: 0; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--anin-soft) 55%, var(--surface)); }
td.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

.nota { font-size: 12.5px; color: var(--muted); }
.pend { font-family: var(--mono); font-size: 12px; background: var(--ei); border: 1px solid var(--ei-line); padding: 0 4px; border-radius: 3px; color: var(--ink); }
.toast { position: fixed; left: 50%; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 8px 14px; border-radius: var(--r); font-size: 13px; z-index: 20; }

nes que debilitan al ecosistema y a la población)", "linea": "Línea 3 · Gobernanza: acuerdos de uso y actas de libre disponibilidad, tamizaje predial y mesa de diálogo previa a fijar metas en áreas en disputa.", "prov": {"M": 3, "H": 3, "A": 2}, "padre": "CD3"}], "notas": "Árbol unificado. Una causa o efecto entra al árbol unificado cuando tiene evidencia en al menos dos provincias, o cuando es generalizado en una de ellas. Las marcas M, H y A indican presencia (· puntual, ·· frecuente, ··· generalizada). Las causas propias de una sola provincia (especies exóticas y derechos mineros en Huancabamba; corredor vial en Ayabaca; ocupación urbana en Morropón) se detallan en los árboles provinciales."}, "morropon": {"pestana": "Morropón", "sigla": "59 bloques", "titulo": "Árbol de problemas – Provincia de Morropón", "subtitulo": "Buenos Aires, Chalaco, Chulucanas, Morropón, Salitral, San Juan de Bigote, Santa Catalina de Mossa, Santo Domingo y Yamango · 59 bloques · 7,327.37 ha (7,313.55 ha netas V8) · 79 centros poblados (9,537 hab.)", "fuente": "Fuentes: Informe E2 Vol. I Morropón (28-oct-2026); Diagnóstico Morropón V5; Informe EVAR (19-oct-2026); Avance del Perfil (28-oct-2026)", "ficha": [{"k": "Bloques", "v": "59 en 9 distritos"}, {"k": "Superficie", "v": "7,327.37 ha (V8 neta 7,313.55 ha)"}, {"k": "Centros poblados", "v": "79 (9,537 hab.)"}, {"k": "PI alto + muy alto", "v": "5,335.20 ha (72.8 %)"}, {"k": "PMM alto + muy alto (EVAR)", "v": "90.7 % de los bloques"}, {"k": "Bajo umbral MSAVI", "v": "6,216.63 ha (84.8 %)"}], "lectura": "Morropón es bosque seco de baja altitud (Bes-cm en el 88 % del ámbito; 38 bloques bajo 1,000 msnm) con aridez extrema en el valle (índice 0.26). Su peligro dominante es la escorrentía torrencial que activa quebradas y genera huaicos, más la erosión laminar y en cárcavas; los movimientos en masa son sobre todo latentes, salvo en taludes viales y frentes rocosos con bolones sobre viviendas. El peligro lo explica la cobertura (r = −0.839 con el MSAVI), no la litología (r = −0.075). Los motores son el pastoreo caprino y la tala comercial de palo santo.", "efecto_final": {"id": "EF", "texto": "Incremento de los costos de reconstrucción y disminución de la resiliencia de la población de Morropón y sus medios de vida frente a huaicos, movimientos en masa e inundaciones desencadenados por lluvias extremas, intensificadas por el cambio climático", "sustento": ["9,537 hab. (8,832 censados en 76 CP más 705 en 3 CP sin código INEI); 1,640 personas vulnerables (18.6 %; 30.2 % en Santo Domingo).", "49 CP (5,730 hab., 64.9 %) dentro del área de influencia aprobada; la población aguas abajo está por delimitar en 47 bloques.", "Riesgo por movimientos en masa alto en 3,730.65 ha (28.9 %) de las áreas de influencia; vulnerabilidad alta en Guabo, Buenos Aires (0.594) y Serrán (EVAR, cálculo por provincia).", "Pérdidas económicas no valoradas: [POR DEFINIR]."], "fuentes": ["Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)", "Informe EVAR Piura – evaluación del riesgo por movimientos en masa, CENEPRED (19-oct-2026)", "ANIN ZZ-000005-R00, contenidos mínimos E7, Fig. 2 (modelo de referencia del árbol de problemas IN)"], "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin."}, "efectos_indirectos": [{"id": "EI1", "texto": "Daños a viviendas, colegios, vías, badenes y captaciones de agua en los centros poblados de cabecera", "sustento": ["Huaicos y deslizamientos en 9 y 8 localidades: carreteras tapadas, daños en viviendas y chacras.", "El flujo del bloque 85 descarga sobre el casco urbano de Dótor y su colegio; quebradas del bloque 2 hacia el colegio N.° 14891; muros derruidos en Serrán (M7B6).", "Badenes y parcelas de La Peña (M9B1); captación de agua a 50 m de M32B3; bolones sueltos sobre viviendas en M6B10, M19B2, M32B3 y 58."], "fuentes": ["Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)", "Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Exposición · elementos y medios de vida expuestos", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin.", "padres": ["ED1", "ED3"]}, {"id": "EI2", "texto": "Pérdida de suelo agrícola y de ingresos agropecuarios", "sustento": ["Erosión y cárcavas en 14 localidades con pérdida de suelo agrícola.", "«La quebrada Limonal destruye los ingresos de la agricultura» (F-DS-06, San Juan de Bigote)."], "fuentes": ["Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)"], "adr": "Exposición · elementos y medios de vida expuestos", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin.", "padres": ["ED2"]}, {"id": "EI3", "texto": "Inundación de parcelas, arrastre de ganado y aislamiento estacional de caseríos por la activación de quebradas", "sustento": ["Activación de quebradas en 24 localidades (53.3 % de las fichas F-DS-03): parcelas inundadas, ganado arrastrado, caseríos aislados.", "Huaro Quispampa, Mangomanguía, Río Seco y La Alberca quedan aislados de enero a abril.", "Viviendas reforzadas con sacos de arena aguas abajo de M7B1 (Víctor Raúl, Nuevo Progreso, Salitral)."], "fuentes": ["Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)", "Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Exposición · elementos y medios de vida expuestos", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin.", "padres": ["ED3"]}, {"id": "EI4", "texto": "Mayor aporte de sedimentos al río Piura y pérdida de otros servicios del bosque seco (fuentes de agua, hábitat, carbono)", "sustento": ["Sedimentos al río Piura: hipótesis a verificar con el E4 (hidrología): [POR DEFINIR].", "Deforestación asociada por la población a la pérdida de manantiales (30 localidades); agua turbia en Palo Blanco durante los huaicos.", "Efecto colateral: la regulación hídrica es otra tipología y no es el fin de este proyecto."], "fuentes": ["Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)", "Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "ANIN ZZ-000005-R00, contenidos mínimos E7, Fig. 2 (modelo de referencia del árbol de problemas IN)"], "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin.", "padres": ["ED2", "ED3"]}], "efectos_directos": [{"id": "ED1", "texto": "Mayor ocurrencia de huaicos y movimientos en masa (caídas de bloques, derrumbes, deslizamientos) en quebradas, taludes y frentes rocosos", "sustento": ["Peligro por movimientos en masa alto o muy alto en el 90.7 % de los bloques (EVAR); peligro integrado muy alto en los 21 bloques de San Juan de Bigote y Salitral.", "Huaicos o flujos de detritos en M6B2-2 (bloques de 1.5–2 m), M2B1 («zona generadora de huaicos confirmada» en el río Huarmaca), M6B10 y M28B4.", "Remoción activa en M32B3, 59, M3B6, 17 y M8B2; reptación en 6 bloques; deslizamientos antiguos en 7."], "fuentes": ["Informe EVAR Piura – evaluación del riesgo por movimientos en masa, CENEPRED (19-oct-2026)", "Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)"], "adr": "Peligro · manifestación del evento (movimientos en masa, erosión, flujos)", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin."}, {"id": "ED2", "texto": "Erosión hídrica laminar y en cárcavas, con pérdida acelerada de suelo", "sustento": ["39 cárcavas con 18,022.5 m en 18 bloques (34 en el bosque seco del valle); 15 cárcavas activas en M3B7 (10 por ha).", "Erosión laminar en el 85 % de los bloques 84 y 85 y en el 80 % del 87; suelo desnudo 68 % (87) y 90 % (77).", "Erosión severa en las calicatas de M3B8, M7B1 y 14; 38 de 39 calicatas con horizonte superficial pobre (ócrico)."], "fuentes": ["Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Peligro · manifestación del evento (movimientos en masa, erosión, flujos)", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin."}, {"id": "ED3", "texto": "Mayor escorrentía torrencial y transporte de sedimentos que activan las quebradas desde las zonas de origen", "sustento": ["93 % de la lluvia entre enero y abril; marzo de 2017: 1,165 mm en un solo mes (M6B10, M6B2-3).", "Infiltración básica lenta a moderadamente lenta (0.33–1.37 cm/h).", "Inundación o activación de quebradas es el peligro más percibido en la zona baja (53.3 % de localidades)."], "fuentes": ["Diagnóstico Morropón Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. I Morropón, B2 Rev. hscm (28-oct-2026)"], "adr": "Peligro · manifestación del evento (movimientos en masa, erosión, flujos)", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin."}], "problema": {"id": "PC", "texto": "La población de la provincia de Morropón no accede adecuadamente al servicio ecosistémico de regulación de riesgos naturales por la degradación del bosque estacionalmente seco de colina y montaña y del mosaico andino en las zonas de origen de huaicos, movimientos en masa e inundaciones", "sustento": ["Peligro integrado alto o muy alto en 5,335.20 ha (72.8 %); 26 bloques en muy alto y 19 en alto; índice provincial 4.020 (Alto).", "Bajo el umbral MSAVI 0.4976: 6,216.63 ha (84.8 %) con el criterio areal E6; 6,258.29 ha (40 bloques) si se toma la media de bloque.", "Estado del ecosistema (E6): 8 bloques moderados y 6 severos (77, 83, 84, 85, 86, 87); índice de condición 0.706.", "P nóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "ANIN ZZ-000005-R00, contenidos mínimos E7, Fig. 2 (modelo de referencia del árbol de problemas IN)"], "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin.", "padres": ["ED2", "ED3"]}], "efectos_directos": [{"id": "ED1", "texto": "Mayor ocurrencia de movimientos en masa (deslizamientos, derrumbes, reptación y flujos de detritos) en laderas y quebradas de cabecera", "sustento": ["Peligro por movimientos en masa alto o muy alto en el 98.2 % de los bloques (muy alto 69.7 %) y en el 83.3 % de las áreas de influencia (EVAR).", "Remociones activas en 16 bloques, escarpes activos en 34, deslizamientos antiguos en 15 y reptación en 18; flujo de detritos en el bloque 21 (pendiente 63.9 %).", "Coyona: movimientos en masa desde 1983; deslizamiento en la quebrada Potreros; derrumbes en Maray Grande."], "fuentes": ["Informe EVAR Piura – evaluación del riesgo por movimientos en masa, CENEPRED (19-oct-2026)", "Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Peligro · manifestación del evento (movimientos en masa, erosión, flujos)", "linea": "Se reduce al recuperar el servicio de regulación de riesgos (objetivo central); se mide con los indicadores de fin."}, {"id": "ED2", "texto": "Erosión hídrica acelerada y pérdida de suelo en laderas (surcos y cárcavas)", "sustento": ["Cárcavas activas severas en el bloque 40; incipientes en 31, 80, 76, 72, 63, 30, 61 y M30B5.", "Capa de cárcavas: 9 cárcavas y 3,903.15 m en 8 bloques (bloque 4: 949 m; M20B1: 758 m; M4B4: 749 m).", "Calicatas someras frente a su referencia: bloque 44, 18 cm frente a 150 cm; bloque 19, 30 cm frente a 80 cm."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hid as E6, hidroclima", "Informe EVAR Piura – evaluación del riesgo por movimientos en masa, CENEPRED (19-oct-2026)", "Avance del Perfil IN Piura · SESDI, 28-oct-2026 (línea base preliminar, criterio areal E6)", "MINAM, Formato N° 04-A, indicador de brecha (RM N° 00213-2024-MINAM)"], "indicador": "Magnitud: peligro integrado alto + muy alto en 2,353.73 ha (66.3 %) · línea base preliminar de brecha: 1,599.99 ha bajo el umbral MSAVI (45.1 %, criterio areal E6)"}, "factores_exogenos": [{"id": "EX1", "texto": "Pendiente media 49 % (424.62 ha sobre 75 %; Canchaque 59.4 %); susceptibilidad litológica a movimientos en masa muy alta en 18 bloques y alta en 18 (Complejo de Olmos).", "sustento": ["Litología con correlación débil con el PI (r = −0.24): orienta el tipo de obra, no la prioridad."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe EVAR Piura – evaluación del riesgo por movimientos en masa, CENEPRED (19-oct-2026)"], "adr": "Peligro · factores condicionantes no modificables", "linea": "No es modificable por el proyecto. Se considera en el AdR-CCC (E8) y en el diseño de las MRR-CCC.", "titulo": "Factores condicionantes del peligro"}, {"id": "EX2", "texto": "Lluvias de El Niño 1983, 1998, 2017 y 2023 entre 2.0 y 2.7 veces la media provincial (3.2–3.3 veces en el bosque seco); tendencia +32.6 mm y +0.15 °C por década.", "sustento": ["541 mm/año, índice de aridez 0.38; 82 % de la lluvia entre enero y abril; un año seco de cada tres en el régimen de bosque seco.", "Déficit hídrico futuro en el escenario SSP5-8.5."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Peligro · factor desencadenante y cambio climático", "linea": "No es modificable por el proyecto. Se considera en el AdR-CCC (E8) y en el diseño de las MRR-CCC.", "titulo": "Factor desencadenante y cambio climático"}], "causas_directas": [{"id": "CD1", "texto": encia (capacidad de organización, gestión y respuesta)", "linea": "Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE."}], "causas_indirectas": [{"id": "CI1.1", "texto": "Sobrepastoreo caprino y vacuno sin manejo, que elimina la regeneración del bosque seco y del matorral", "sustento": ["Pastoreo o sobrepastoreo en 45 de 48 informes DT; intensidad fuerte en M4B4 y M30B5 (80 %), 31 y 70 (70 %), 63 (40 %).", "Ganadería vacuna en 90.9 % de las localidades y caprina u ovina en 27.3 %."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.", "padre": "CD1"}, {"id": "CI1.2", "texto": "Cambio de uso hacia agricultura de ladera (café, maíz, pastos)", "sustento": ["Agricultura en ladera en 38 de 48 informes DT; bloque 43 100 % agrícola, M30B5 82 %, 43 50 %, 51 40 %.", "Zona agrícola: 1,265.97 ha (35.6 %) según el mapa MINAM."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 1 · Infraestructura natural (verde): revegetación y reforestación con especies nativas; viveros permanentes y temporales.", "padre": "CD1"}, {"id": "CI1.3", "texto": "Extracción de leña y madera y quemas para renovar pastos", "sustento": ["Tala para leña o madera en 25 de 48 bloques; deforestación y venta de madera en 12 localidades.", "Venta de roble y laurel; tala ilegal de nogal y quinahuiro; el 70 % usa leña en Huamala Alto.", "Quemas para renovar pastos en 6 bloques (31, 51, 70, M22B1, 44, 21)."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 1 · Infraestructura natural (verde): revegetación y reforestación con especies nativas; viveros permanentes y temporales.", "padre": "CD1"}, {"id": "CI1.4", "texto": "Baja regeneración de especies nativas por aridez y avance de especies exóticas", "sustento": ["Especies exóticas (pino, eucalipto, grevilea, higuerilla) en 16 bloques; sequía o cambio climático señalados en 12.", "Régimen de bosque seco: 414 mm/año, índice de aridez 0.24."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 1 · Infraestructura natural (verde): revegetación y reforestación con especies nativas; viveros permanentes y temporales.", "padre": "CD1"}, {"id": "CI2.1", "texto": "Trochas, vías y cortes de talud sin drenaje ni estabilización", "sustento": ["Vías y taludes de corte en 40 de 48 informes DT; intensidad fuerte en 10, 8, 18 (trocha departamental 108), 20, 80, 71, 76 y 43.", "Desprendimientos en la trocha que afectan viviendas de Nuevo Progreso (bloque 19)."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Peligro · factor condicionante modificable (cobertura, suelo, drenaje)", "linea": "Línea 2.1 · Obras complementarias: estabilización de taludes, muros y gaviones, diques en quebradas, drenaje y control de escorrentía (coordinadas con el titular de la vía cuando corresponda).", "padre": "CD2"}, {"id": "CI2.2", "texto": "Laderas cultivadas sin prácticas de conservación y cárcavas sin control", "sustento": ["Cárcavas activas severas en 40 e incipientes en 8 bloques; la ficha F-DT-02 solo cubre 26 bloques.", "Agroquímicos y aguas mieles del café en las quebradas de Huabal."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima", "Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.", "padre": "CD2"}, {"id": "CI2.3", "texto": "Pisoteo y compactación de suelos someros por el ganado, con baja infiltración", "sustento": ["Infiltración básica de 0.41 a 2.2 cm/h en 3 de 4 ensayos; calicatas de 18 a 45 cm en bloques degradados."], "fuentes": ["Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Peligro · factor condicionante modificable (cobertura, suelo, drenaje)", "linea": "Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.", "padre": "CD2"}, {"id": "CI3.1", "texto": "Limitado conocimiento y organización comunal para el manejo del ecosistema y la gestión del riesgo", "sustento": ["Comité de recursos naturales en 13 % de 23 localidades; ninguna con alerta temprana ni comité de gestión del riesgo.", "Rondas desarticuladas en Shuturumbe y Sapce–Chamelico; prohibición de tala en Ullma sin control efectivo; faenas comunales solo reactivas.", "La población prioriza el agua (11 de 13 entrevistas); Cruz de Piedra sin señal celular para avisos."], "fuentes": ["Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)", "Diagnóstico Huancabamba Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)", "linea": "Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.", "padre": "CD3"}, {"id": "CI3.2", "texto": "Limitada gobernanza y articulación de las entidades públicas y privadas, con desconfianza por obras inconclusas", "sustento": ["Sin espacios de concertación en los 24 CP con ficha; presencia estatal percibida baja en 11 localidades.", "Obra de agua y alcantarillado de Sapce y Chacchacal paralizada al 80 %; obras inconclusas en Huamala Alto y Flor de Café.", "Superposición con el proyecto del GORE en Pusmalca (CUI 2335868) sobre los bloques 81 y 79."], "fuentes": ["Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)", "linea": "Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.", "padre": "CD3"}, {"id": "CI3.3", "texto": "Alta informalidad en la tenencia de la tierra y presión de derechos mineros", "sustento": ["71.0 % sin registro (2,451.17 ha); posesión sin título en 17 de 20 bloques; 5 bloques superan los 19 predios.", "Petitorio minero LM30 (bloques 8 y 71) y oposición activa a la minería (Río Blanco); San José de Hualcas no firmó."], "fuentes": ["Informe E2 Vol. II Huancabamba, B2 Rev. hscm (28-oct-2026)"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 3 · Gobernanza: acuerdos de uso y actas de libre disponibilidad, tamizaje predial y mesa de diálogo previa a fijar metas en áreas en disputa.", "padre": "CD3"}], "notas": "Árbol provincial de Huancabamba. Superficie V8 neta 3,452.21 ha (se excluyeron 98.95 ha del petitorio minero LM30); el PI se calculó sobre el polígono V7 (3,551.16 ha). Pendientes: criterio único de brecha MSAVI, modelo PMM/EPH/PGI por bloque, inventario de daños, delimitación de exposición aguas abajo, laboratorio de suelos y fichas sociales en Huarmaca."}, "ayabaca": {"pestana": "Ayabaca", "sigla": "10 bloques", "titulo": "Árbol de problemas – Provincia de Ayabaca (distrito de Frías)", "subtitulo": "Cuenca alta del río Piura · 10 bloques · 1,391.70 ha · 4 microcuencas · 17 centros poblados (2,541 hab., Censo 2017)", "fuente": "Fuentes: Informe E2 Vol. III Ayabaca (30-oct-2026); Diagnóstico Ayabaca V5; Informe EVAR (19-oct-2026)", "ficha": [{"k": "Bloques", "v": "10 (todos en Frías)"}, {"k": "Superficie", "v": "1,391.70 ha"}, {"k": "Centros poblados", "v": "17 (2,541 hab.)"}, {"k": "PI alto + muy alto", "v": "782.64 ha (56.2 %)"}, {"k": "PMM alto + muy alto (EVAR)", "v": "99.4 % de los bloques"}, {"k": "Bajo umbral MSAVI", "v": "525.21 ha (37.7 %)"}], "lectura": "En Frías el peligro se concentra en el piedemonte de bosque seco (régimen A, índice PI 3.968), donde el corredor Chulucanas–Frías y las trochas sin drenaje activan taludes, y en el mosaico agrícola de ladera (68 % del ámbito es zona agrícola). El PI no sigue a la pendiente (r = +0.126) sino a la pérdida de cobertura (r = −0.968 con el MSAVI): por eso la cobertura y el suelo son las causas que el proyecto puede revertir.", "efecto_final": {"id": "EF", "texto": "Incremento de los costos de reconstrucción y disminución de la resiliencia de la población de Frías y sus medios de vida frente a movimientos en masa e inundaciones desencadenados por lluvias extremas, intensificadas por el cambio climático", "sustento": ["2,541 hab. en 17 CP rurales (Censo 2017); 400 personas vulnerables (15.7 %); proyección 2026: 2,376 hab.", "Riesgo por movimientos en masa en las áreas de influencia: alto en 745.65 ha (90.9 %); GdR, alerta temprana comunitaria y MERESE.", "padre": "CD3"}, {"id": "CI3.2", "texto": "Limitada presencia y articulación institucional, sin espacios de concertación, y desconfianza hacia agentes externos", "sustento": ["Ninguna localidad tiene espacio de concertación; AGRO RURAL presente en 0 localidades; presencia estatal baja en 3 y media en 4.", "Percepción de «abandono» en Guabal y Pampa de Ramada; desconfianza por una estafa previa en Huayabal."], "fuentes": ["Informe E2 Vol. III Ayabaca, B2 Rev. hscm (30-oct-2026)"], "adr": "Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)", "linea": "Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.", "padre": "CD3"}, {"id": "CI3.3", "texto": "Tenencia comunal con posesión informal y linderos en disputa", "sustento": ["1,167.02 ha (83.9 %) en comunidades campesinas; 224.69 ha sin registro; 0 predios COFOPRI; polígono comunal 1508 sin nombre.", "150 predios en posesión sin título en Guanábano Alto; conflicto latente La Cría–San Andrés de Culcas.", "Las fichas declaran 36, 93 y 38 predios en los bloques 3, 6 y M17B7 (más que el máximo de 19)."], "fuentes": ["Informe E2 Vol. III Ayabaca, B2 Rev. hscm (30-oct-2026)", "Diagnóstico Ayabaca Versión 5 (artefacto, oct-2026): DT, PI, suelos E5, ecosistemas E6, hidroclima"], "adr": "Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)", "linea": "Línea 3 · Gobernanza: acuerdos de uso y actas de libre disponibilidad, tamizaje predial y mesa de diálogo previa a fijar metas en áreas en disputa.", "padre": "CD3"}], "notas": "Árbol provincial de Ayabaca (Frías). Problema central redactado según el modelo de referencia ANIN (ZZ-000005, Fig. 2), sin incluir la regulación hídrica en el enunciado. Las cifras provienen del Informe E2 Vol. III (30-oct-2026), del Diagnóstico Ayabaca V5 y del Informe EVAR. Pendientes: criterio único de brecha MSAVI, modelo PMM/EPH/PGI por bloque, registro de daños históricos, laboratorio de suelos y fichas F-DS-03 a F-DS-07."}}, "metodo_html": "\n<section>\n  <h2>Cómo se construyeron los árboles<\/h2>\n  <ol class=\"pasos\">\n    <li><div><b>Evidencia.<\/b> Se revisaron los informes del Entregable 2 por provincia (Vol. I y II del 28-oct, Vol. III del 30-oct-2026), las Matrices E2 B2 (24-oct), los diagnósticos V5 por provincia (117 informes territoriales, peligro integrado MCA-AHP, suelos E5, ecosistemas E6, hidroclima PISCOp 1981–2025), el Diagnóstico Social (374 fichas en 154 centros poblados; 82 de 117 bloques con ficha), el Informe EVAR del 19-oct y el Avance del Perfil del 28-oct.<\/div><\/li>\n    <li><div><b>Lectura con la cadena del peligro (CENEPRED).<\/b> Lo que el proyecto puede modificar y aumenta el peligro (cobertura, suelo, drenaje) o la vulnerabilidad (organización, tenencia) es <i>causa<\/i>. La manifestación del peligro en la zona de origen (movimientos en masa, erosión, escorrentía torrencial) es <i>efecto directo<\/i>. Los daños a elementos expuestos son <i>efectos indirectos<\/i> y la consecuencia agregada es el <i>efecto final<\/i>. Pendiente, litología y lluvias extremas no son modificables: se muestran como factores exógenos a los lados del problema, como pide la Nota Técnica de meso y microlocalización.<\/div><\/li>\n    <li><div><b>Filtro de tipología.<\/b> El servicio es la regulación de riesgos naturales (Formato 04-A, RM N° 00213-2024-MINAM). La regulación hídrica y la sequía, que la población menciona primero (82–89 % de localidades), corresponden a otra tipología con su propia brecha. Por eso salen del problema central y de los efectos directos y quedan solo como efecto colateral (EI), igual que en el modelo ANIN.<\/div><\/li>\n    <li><div><b>Alineación con el modelo de referencia ANIN<\/b> (ZZ-000005, Fig. 2). Se mantiene su problema central y su efecto final. La causa «Alteración de los factores condicionantes en zonas de origen» se desagrega en CD1 (cobertura) y CD2 (suelos y laderas), y «Inadecuada gobernanza y gestión del ecosistema» es CD3. Así cada causa directa lleva a un componente del proyecto: infraestructura verde, infraestructura marrón y gobernanza (ZZ-000006, num. 10.1.7).<\/div><\/li>\n    <li><div><b>Árbol unificado por convergencia.<\/b> Entra una causa o un efecto que tiene evidencia en al menos dos provincias o que es generalizado en una. Las marcas M, H y A muestran dónde aparece: · puntual, ·· frecuente, ··· generalizada. Lo propio de una sola provincia queda en su árbol provincial.<\/div><\/li>\n    <li><div><b>Control de calidad.<\/b> Se verificó que el problema esté redactado como situación negativa y no como falta de una solución, que cada causa tenga evidencia y fuente, que no haya causas repetidas entre ramas, que la lógica «si ocurre la causa, entonces aparece el efecto» se cumpla en cada flecha y que toda cifra provenga de un documento del proyecto.<\/div><\/li>\n  <\/ol>\n<\/section>\n\n<section>\n  <h2>Comparación de las tres provincias<\/h2>\n  <p class=\"nota\">Cifras del Avance del Perfil (28-oct) y de las Matrices E2 B2; el peligro y riesgo por movimientos en masa se calcularon por provincia con los anexos del Informe EVAR. El peligro integrado (MCA-AHP: movimientos en masa, erosión y potencial generador de inundaciones) y el EVAR (solo movimientos en masa, método CENEPRED) no son comparables entre sí.<\/p>\n  <div class=\"tabla-scroll\"><table><thead><tr><th>Variable<\/th><th>Morropón<\/th><th>Huancabamba<\/th><th>Ayabaca<\/th><th>Total<\/th><\/tr><\/thead><tbody><tr><td>Bloques · distritos · microcuencas<\/td><td class=\"num\">59 · 9 · 17<\/td><td class=\"num\">48 · 5 · 11<\/td><td class=\"num\">10 · 1 · 4<\/td><td class=\"num\">117 · 15 · 32<\/td><\/tr><tr><td>Superficie de bloques (ha)<\/td><td class=\"num\">7,327.37<\/td><td class=\"num\">3,551.16<\/td><td class=\"num\">1,391.70<\/td><td class=\"num\">12,270.24<\/td><\/tr><tr><td>Superficie neta V8 (ha)<\/td><td class=\"num\">7,313.55<\/td><td class=\"num\">3,452.21<\/td><td class=\"num\">1,391.70<\/td><td class=\"num\">12,157.47<\/td><\/tr><tr><td>Centros poblados · población 2017<\/td><td class=\"num\">79 · 9,537<\/td><td class=\"num\">58 · 6,573<\/td><td class=\"num\">17 · 2,541<\/td><td class=\"num\">154 · 18,651<\/td><\/tr><tr><td>Altitud media (msnm) · pendiente media (%, DEM GLO-30)<\/td><td class=\"num\">498 · 34.7<\/td><td class=\"num\">1,317 · 49.0<\/td><td class=\"num\">1,420 · 57.5<\/td><td class=\"num\">840 · 41.4<\/td><\/tr><tr><td>Peligro integrado alto + muy alto (ha · %)<\/td><td class=\"num\">5,335.20 · 72.8<\/td><td class=\"num\">2,353.73 · 66.3<\/td><td class=\"num\">782.64 · 56.2<\/td><td class=\"num\">8,471.57 · 69.0<\/td><\/tr><tr><td>Índice de peligro integrado<\/td><td class=\"num\">4.020<\/td><td class=\"num\">3.898<\/td><td class=\"num\">3.580<\/td><td class=\"num\">3.935<\/td><\/tr><tr><td>Peligro por movimientos en masa alto + muy alto en bloques (EVAR, %)<\/td><td class=\"num\">90.7<\/td><td class=\"num\">98.2<\/td><td class=\"num\">99.4<\/td><td class=\"num\">93.9<\/td><\/tr><tr><td>Riesgo alto + muy alto en áreas de influencia (EVAR, %)<\/td><td class=\"num\">28.9<\/td><td class=\"num\">80.0<\/td><td class=\"num\">90.9<\/td><td class=\"num\">42.0<\/td><\/tr><tr><td>Bajo el umbral MSAVI, criterio areal E6 (ha · %)<\/td><td class=\"num\">6,216.63 · 84.8<\/td><td class=\"num\">1,599.99 · 45.1<\/td><td class=\"num\">525.21 · 37.7<\/td><td class=\"num\">8,341.83 · 68.0<\/td><\/tr><tr><td>MSAVI medio ponderado<\/td><td class=\"num\">0.379<\/td><td class=\"num\">0.508<\/td><td class=\"num\">0.548<\/td><td class=\"num\">0.435<\/td><\/tr><tr><td>Bloques en estado moderado o severo (E6)<\/td><td class=\"num\">14<\/td><td class=\"num\">6<\/td><td class=\"num\">0<\/td><td class=\"num\">20<\/td><\/tr><tr><td>Cárcavas registradas (n · km)<\/td><td class=\"num\">39 · 18.02<\/td><td class=\"num\">9 · 3.90<\/td><td class=\"num\">7 · 1.15<\/td><td class=\"num\">55 · 23.08<\/td><\/tr><tr><td>Lluvia (mm/año) · índice de aridez<\/td><td class=\"num\">543 · 0.31<\/td><td class=\"num\">541 · 0.38<\/td><td class=\"num\">557 · 0.39<\/td><td class=\"num\">544 · 0.34<\/td><\/tr><tr><td>Lluvia en años El Niño frente a la media<\/td><td class=\"num\">×3.0–3.8 (hasta ×6.1)<\/td><td class=\"num\">×2.0–2.7 (×3.3 en bosque seco)<\/td><td class=\"num\">×2.7–4.9<\/td><td class=\"num\">×2 a ×6<\/td><\/tr><tr><td>Superficie sin registro predial (%)<\/td><td class=\"num\">71.8<\/td><td class=\"num\">71.0<\/td><td class=\"num\">16.1 (83.9 % comunal)<\/td><td class=\"num\">—<\/td><\/tr><tr><td>Localidades con comité de recursos naturales<\/td><td class=\"num\">2 de 56<\/td><td class=\"num\">3 de 22<\/td><td class=\"num\">0 de 7<\/td><td class=\"num\">5 de 85<\/td><\/tr><tr><td>Localidades con alerta temprana formal<\/td><td class=\"num\">0<\/td><td class=\"num\">0<\/td><td class=\"num\">0<\/td><td class=\"num\">0<\/td><\/tr><\/tbody><\/table><\/div>\n<\/section>\n\n<section>\n  <h2>Matriz de consistencia del árbol unificado<\/h2>\n  <p class=\"nota\">Cada causa directa e indirecta, dónde se presenta, cómo se lee en el análisis de riesgo y qué componente del proyecto la atiende. Es la base para el árbol de medios y fines del capítulo de Identificación.<\/p>\n  <div class=\"tabla-scroll\"><table><thead><tr><th>Código<\/th><th>Causa<\/th><th>Provincias<\/th><th>Lectura AdR-CCC<\/th><th>Componente que la atiende<\/th><\/tr><\/thead><tbody><tr><td style=\"font-family:var(--mono)\"><b>CD1<\/b><\/td><td><b>Degradación de la cobertura vegetal protectora en las zonas de origen<\/b><\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d2\" title=\"Huancabamba\">H··<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Peligro · factor condicionante modificable (cobertura, suelo, drenaje)<\/td><td>Línea 1 · Infraestructura natural (verde): revegetación y reforestación con especies na cas<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d2\" title=\"Huancabamba\">H··<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)<\/td><td>Línea 1 · Infraestructura natural (verde): revegetación y reforestación con especies nativas; viveros permanentes y temporales.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\"><b>CD2<\/b><\/td><td><b>Reducida capacidad de los suelos y laderas para controlar la erosión y la escorrentía<\/b><\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Peligro · factor condicionante modificable (cobertura, suelo, drenaje)<\/td><td>Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI2.1<\/td><td>Trochas, vías y canteras con cortes de talud sin drenaje ni estabilización<\/td><td><span class=\"pv M d2\" title=\"Morropón\">M··<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d3\" title=\"Ayabaca\">A···<\/span><\/td><td>Peligro · factor condicionante modificable (cobertura, suelo, drenaje)<\/td><td>Línea 2.1 · Obras complementarias: estabilización de taludes, muros y gaviones, diques en quebradas, drenaje y control de escorrentía (coordinadas con el titular de la vía cuando corresponda).<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI2.2<\/td><td>Laderas cultivadas sin prácticas de conservación de suelos y cárcavas activas sin control<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d2\" title=\"Huancabamba\">H··<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Peligro · factor condicionante modificable (cobertura, suelo, drenaje)<\/td><td>Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI2.3<\/td><td>Pisoteo del ganado y senderos que compactan suelos someros y concentran la escorrentía<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d2\" title=\"Huancabamba\">H··<\/span><span class=\"pv A d1\" title=\"Ayabaca\">A·<\/span><\/td><td>Peligro · factor condicionante modificable (cobertura, suelo, drenaje)<\/td><td>Línea 2 · Infraestructura marrón: zanjas de infiltración, terrazas de formación lenta, diques para control de cárcavas, clausura temporal y manejo de pastizales, barreras y cercos vivos.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\"><b>CD3<\/b><\/td><td><b>Inadecuada gobernanza y gestión local del ecosistema y del riesgo<\/b><\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d3\" title=\"Ayabaca\">A···<\/span><\/td><td>Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)<\/td><td>Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI3.1<\/td><td>Limitado conocimiento y organización de las comunidades locales para el manejo del ecosistema, la adaptación al cambio climático y la gestión del riesgo<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d3\" title=\"Ayabaca\">A···<\/span><\/td><td>Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)<\/td><td>Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI3.2<\/td><td>Limitada gobernanza de las entidades públicas y privadas: sin concertación, con escasa presencia institucional y desconfianza por intervenciones incumplidas<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Vulnerabilidad · baja resiliencia (capacidad de organización, gestión y respuesta)<\/td><td>Línea 3 · Gobernanza y gestión comunitaria: planes de manejo comunitario, fortalecimiento de capacidades en GdR, alerta temprana comunitaria y MERESE.<\/td><\/tr><tr><td style=\"font-family:var(--mono)\">CI3.3<\/td><td>Tenencia de la tierra sin sanear: tierras sin registro, posesión informal y conflictos de linderos<\/td><td><span class=\"pv M d3\" title=\"Morropón\">M···<\/span><span class=\"pv H d3\" title=\"Huancabamba\">H···<\/span><span class=\"pv A d2\" title=\"Ayabaca\">A··<\/span><\/td><td>Vulnerabilidad · fragilidad (prácticas y condiciones que debilitan al ecosistema y a la población)<\/td><td>Línea 3 · Gobernanza: acuerdos de uso y actas de libre disponibilidad, tamizaje predial y mesa de diálogo previa a fijar metas en áreas en disputa.<\/td><\/tr><\/tbody><\/table><\/div>\n<\/section>\n\n<section>\n  <h2>Ajustes frente a la propuesta preliminar del E7 (corte 03-oct-2026)<\/h2>\n  <ul>\n    <li><b>Problema central.<\/b> Decía «servicios ecosistémicos de regulación de riesgos naturales y de regulación hídrica». Ahora se limita a la regulación de riesgos naturales y adopta la forma del modelo ANIN: la población no accede adecuadamente al servicio por la degradación de los ecosistemas en las zonas de origen.<\/li>\n    <li><b>Efecto directo 3.<\/b> «Menor infiltración y regulación hídrica» pasa a «Mayor escorrentía torrencial y transporte de sedimentos», que es la dimensión de zona generadora de inundaciones del peligro integrado.<\/li>\n    <li><b>Causa directa 2.<\/b> «Uso del suelo y de las vías que acelera la erosión» era en realidad un conjunto de causas. Ahora describe el estado del suelo y de las laderas, y las vías, el pisoteo y la falta de conservación pasan a ser sus causas indirectas.<\/li>\n    <li><b>Pastoreo.<\/b> Su efecto principal es impedir la regeneración (CD1). El pisoteo y los senderos que concentran escorrentía quedan en CD2, porque son otro mecanismo con su propia medida.<\/li>\n    <li><b>Gobernanza.<\/b> Se alinea con las dos causas del modelo ANIN (conocimiento y organización comunal; gobernanza de entidades públicas y privadas) y se agrega la tenencia sin sanear, que condiciona la libre disponibilidad.<\/li>\n    <li><b>Efecto final.<\/b> Se adopta el del modelo ANIN (costos de reconstrucción y resiliencia), que conecta con la valoración de beneficios por costos evitados.<\/li>\n    <li><b>Factores exógenos.<\/b> Pendiente, litología, El Niño y cambio climático se muestran a los lados del problema y fuera de la cadena causal, porque el proyecto no puede modificarlos.<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Pendientes para cerrar los árboles<\/h2>\n  <ul>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Criterio oficial de la línea base de brecha. El Avance del 28-oct propone el criterio areal E6 (8,341.83 ha; 68.0 %), que es el que usan estos árboles. Las Matrices E2 B2 usan la media de bloque (7,805.23 ha; 64.2 %).<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Peligro por componente (movimientos en masa, erosión y potencial generador de inundaciones) modelado por bloque. Hoy solo existe el peligro integrado y la calificación cualitativa de campo.<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Inventario de daños por evento (El Niño 1983, 1998, 2017 y Yaku 2023) con SIGRID e INDECI, y valoración de pérdidas para el efecto final.<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Delimitación de la población y los elementos expuestos aguas abajo (80 bloques «por delimitar») y cuantificación de sedimentos con el E4.<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Laboratorio de suelos (materia orgánica, textura, pH, factor K), carga ganadera y frecuencia de quemas.<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Pobreza, NBI y PEA; fichas F-DS-04, 05 y 07; F-DS-03 y 06 en Ayabaca; fichas sociales en Huarmaca (21 bloques con 3 fichas).<\/li>\n    <li><span class=\"pend\">[POR DEFINIR]<\/span> Escenarios de cambio climático en el EVAR (hoy usa un desencadenante fijo).<\/li>\n  <\/ul>\n<\/section>\n\n<section>\n  <h2>Marco normativo y metodológico<\/h2>\n  <ul>\n    <li>Sistema Nacional de Programación Multianual y Gestión de Inversiones (Invierte.pe): Directiva N° 001-2019-EF/63.01 y Guía General para la identificación, formulación y evaluación de proyectos (DGPMI-MEF), con su anexo de gestión del riesgo de desastres en contexto de cambio climático.<\/li>\n    <li>RM N° 178-2019-MINAM, lineamientos para proyectos en ecosistemas; RM N° 00213-2024-MINAM, indicador de brecha y Formato 04-A (definición del servicio ecosistémico de regulación de riesgos naturales).<\/li>\n    <li>ANIN: contenidos mínimos del E7 (ZZ-000005, Figuras 2 y 3), del capítulo de Identificación (ZZ-000006) y de Formulación (ZZ-000007); Nota Técnica de meso y microlocalización de infraestructura natural.<\/li>\n    <li>CENEPRED, Manual para la evaluación de riesgos originados por fenómenos naturales (versión 2): peligro como combinación de factores condicionantes y desencadenantes; vulnerabilidad como exposición, fragilidad y resiliencia.<\/li>\n    <li>Metodología complementaria: árbol de problemas del Marco Lógico (CEPAL-ILPES), enfoque de servicios ecosistémicos y triangulación de evidencia territorial, social y de modelamiento.<\/li>\n  <\/ul>\n  <p class=\"nota\">Las citas de normas y guías se tomaron de los documentos del proyecto en Drive. La Guía General DGPMI no está en la carpeta del proyecto: conviene confirmar sus numerales antes de citarlos en el informe.<\/p>\n<\/section>\n\n<section>\n  <h2>Archivos editables<\/h2>\n  <p>Los cuatro árboles están en versión editable en el repositorio del proyecto, carpeta <code>arboles_problemas/<\/code>:<\/p>\n  <ul>\n    <li><b>Arboles_Problemas_IN_Piura.pptx<\/b>: PowerPoint en lámina A3 horizontal, un árbol por lámina. Cajas y conectores nativos: al mover una caja, sus flechas la siguen. El sustento de cada árbol está en las notas de la lámina.<\/li>\n    <li><b>Arboles_Problemas_IN_Piura.drawio<\/b>: diagrama para diagrams.net (gratuito, en línea o de escritorio), una página por árbol. También se importa en Visio y Lucidchart.<\/li>\n    <li><b>arboles_IN_Piura.json<\/b> y <b>contenido_arboles.py<\/b>: el contenido con su evidencia; <b>construir.py<\/b> regenera todos los formatos si se cambia un texto.<\/li>\n  <\/ul>\n<\/section>\n"};

const $ = (s, el = document) => el.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const NIV = { EF: "Efecto final", EI: "Efecto indirecto", ED: "Efecto directo", PC: "Problema central", CD: "Causa directa", CI: "Causa indirecta", EX: "Factor exógeno de peligro" };
const PROV = { M: "Morropón", H: "Huancabamba", A: "Ayabaca" };

function toast(msg) {
  const t = document.createElement("div");
  t.className = "toast"; t.textContent = msg; t.setAttribute("role", "status");
  document.body.appendChild(t); setTimeout(() => t.remove(), 2200);
}

function chips(prov) {
  if (!prov) return "";
  return '<span class="provs">' + Object.entries(prov).filter(([, v]) => v > 0)
    .map(([k, v]) => `<span class="pv ${k} d${v}" title="${PROV[k]}: evidencia ${["", "puntual", "frecuente", "generalizada"][v]}">${k}${"·".repeat(v)}</span>`).join("") + "</span>";
}

function nodoHTML(n, nivel) {
  const cls = nivel.toLowerCase();
  let cuerpo = esc(n.texto);
  if (nivel === "EX") cuerpo = `<b>${esc(n.titulo)}</b>${esc(n.texto)}`;
  if (nivel === "PC" && n.indicador) cuerpo += `<span class="ind">${esc(n.indicador)}</span>`;
  return `<button type="button" class="nodo ${cls}" data-id="${esc(n.id)}" data-nivel="${nivel}"><span class="cod">${esc(n.id)}</span>${cuerpo}${chips(n.prov)}</button>`;
}

function construirArbol(clave, t) {
  const cdCols = t.causas_directas.length;
  const ei = t.efectos_indirectos, ed = t.efectos_directos, ex = t.factores_exogenos || [];
  const cols = t.causas_directas.map((c) => {
    const hijos = t.causas_indirectas.filter((x) => x.padre === c.id);
    return `<div class="col">${nodoHTML(c, "CD")}<div class="cis">${hijos.map((h) => nodoHTML(h, "CI")).join("")}</div></div>`;
  }).join("");
  return `
  <div class="lienzo" id="lz-${clave}">
    <svg class="cables" aria-hidden="true"></svg>
    <div class="nivel n-ef"><span class="rotulo">Efecto final</span>${nodoHTML(t.efecto_final, "EF")}</div>
    <div class="nivel" style="grid-template-columns:repeat(${ei.length},minmax(0,1fr))"><span class="rotulo">Efectos indirectos</span>${ei.map((e) => nodoHTML(e, "EI")).join("")}</div>
    <div class="nivel" style="grid-template-columns:repeat(${ed.length},minmax(0,1fr))"><span class="rotulo">Efectos directos</span>${ed.map((e) => nodoHTML(e, "ED")).join("")}</div>
    <div class="nivel n-pc"><span class="rotulo">Problema central</span>${ex[0] ? nodoHTML(ex[0], "EX") : "<span></span>"}${nodoHTML(t.problema, "PC")}${ex[1] ? nodoHTML(ex[1], "EX") : "<span></span>"}</div>
    <div class="nivel" style="grid-template-columns:repeat(${cdCols},minmax(0,1fr))"><span class="rotulo">Causas directas e indirectas</span>${cols}</div>
    <div class="leyenda">
      <span><i style="background:var(--ef);border-color:var(--ef)"></i>Efecto final</span>
      <span><i style="background:var(--ei);border-color:var(--ei-line)"></i>Efecto indirecto</span>
      <span><i style="background:var(--ed);border-color:var(--ed-line)"></i>Efecto directo</span>
      <span><i style="background:var(--anin);border-color:var(--anin)"></i>Problema central</span>
      <span><i style="background:var(--anin-soft);border-color:var(--anin)"></i>Causa directa</span>
      <span><i style="background:var(--ci);border-color:var(--ci-line)"></i>Causa indirecta</span>
      <span><i style="border-style:dashed;border-color:var(--ex-line)"></i>Factor exógeno de peligro (no controlable por el PI)</span>
      ${t.prov_leyenda ? '<span><span class="pv M">M</span><span class="pv H">H</span><span class="pv A">A</span> provincias con evidencia (· puntual, ·· frecuente, ··· generalizada)</span>' : ""}
    </div>
  </div>`;
}

function enlaces(t) {
  const L = [];
  t.causas_indirectas.forEach((c) => L.push([c.id, c.padre, "ci"]));
  t.causas_directas.forEach((c) => L.push([c.id, t.problema.id, "v"]));
  (t.factores_exogenos || []).forEach((f) => L.push([f.id, t.problema.id, "ex"]));
  t.efectos_directos.forEach((e) => L.push([t.problema.id, e.id, "v"]));
  t.efectos_indirectos.forEach((e) => { e.padres.forEach((p) => L.push([p, e.id, "v"])); L.push([e.id, t.efecto_final.id, "v"]); });
  return L;
}

function dibujar(clave) {
  const t = DATA.arboles[clave];
  const lz = document.getElementById("lz-" + clave);
  if (!lz || lz.offsetParent === null) return;
  const svg = lz.querySelector("svg");
  const R = lz.getBoundingClientRect();
  const box = (id) => { const el = lz.querySelector(`[data-id="${CSS.escape(id)}"]`); const r = el.getBoundingClientRect(); return { x: r.left - R.left, y: r.top - R.top, w: r.width, h: r.height }; };
  let d = '<defs><marker id="fl-' + clave + '" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor" style="stroke:none"/></marker></defs>';
  for (const [a, b, tipo] of enlaces(t)) {
    const A = box(a), B = box(b);
    let p;
    if (tipo === "ci") {
      const sx = B.x + 11;
      p = `M${B.x + 11},${B.y + B.h} L${sx},${A.y + A.h / 2} L${A.x},${A.y + A.h / 2}`;
      d += `<path data-a="${esc(a)}" data-b="${esc(b)}" d="${p}"/>`;
    } else if (tipo === "ex") {
      const izq = A.x < B.x;
      const y = A.y + A.h / 2;
      p = izq ? `M${A.x + A.w},${y} L${B.x - 2},${y}` : `M${A.x},${y} L${B.x + B.w + 2},${y}`;
      d += `<path class="ex" data-a="${esc(a)}" data-b="${esc(b)}" d="${p}" marker-end="url(#fl-${clave})" style="color:var(--ex-line)"/>`;
    } else {
      const x1 = A.x + A.w / 2, y1 = A.y, x2 = B.x + B.w / 2, y2 = B.y + B.h + 1;
      const ym = (y1 + y2) / 2;
      p = `M${x1},${y1} L${x1},${ym} L${x2},${ym} L${x2},${y2}`;
      d += `<path data-a="${esc(a)}" data-b="${esc(b)}" d="${p}" marker-end="url(#fl-${clave})" style="color:var(--wire)"/>`;
    }
  }
  svg.innerHTML = d;
  marcarRuta(clave);
}

const seleccion = {};
function ruta(t, id) {
  const L = enlaces(t), set = new Set([id]);
  let cambio = true;
  const arriba = new Set([id]), abajo = new Set([id]);
  while (cambio) { cambio = false; for (const [a, b] of L) { if (arriba.has(a) && !arriba.has(b)) { arriba.add(b); cambio = true; } if (abajo.has(b) && !abajo.has(a)) { abajo.add(a); cambio = true; } } }
  arriba.forEach((x) => set.add(x)); abajo.forEach((x) => set.add(x));
  return set;
}
function marcarRuta(clave) {
  const lz = document.getElementById("lz-" + clave); if (!lz) return;
  const id = seleccion[clave];
  lz.classList.toggle("foco", !!id && foco[clave]);
  lz.querySelectorAll(".nodo").forEach((n) => { n.classList.toggle("sel", n.dataset.id === id); n.classList.remove("ruta"); });
  lz.querySelectorAll(".cables path").forEach((p) => p.classList.remove("ruta"));
  if (!id || !foco[clave]) return;
  const S = ruta(DATA.arboles[clave], id);
  lz.querySelectorAll(".nodo").forEach((n) => n.classList.toggle("ruta", S.has(n.dataset.id)));
  lz.querySelectorAll(".cables path").forEach((p) => p.classList.toggle("ruta", S.has(p.dataset.a) && S.has(p.dataset.b)));
}
const foco = {};

function buscar(t, id) {
  const todos = [t.efecto_final, ...t.efectos_indirectos, ...t.efectos_directos, t.problema, ...(t.factores_exogenos || []), ...t.causas_directas, ...t.causas_indirectas];
  return todos.find((n) => n.id === id);
}
function nivelDe(t, id) {
  if (t.efecto_final.id === id) return "EF";
  if (t.problema.id === id) return "PC";
  if (t.efectos_indirectos.some((n) => n.id === id)) return "EI";
  if (t.efectos_directos.some((n) => n.id === id)) return "ED";
  if (t.causas_directas.some((n) => n.id === id)) return "CD";
  if ((t.factores_exogenos || []).some((n) => n.id === id)) return "EX";
  return "CI";
}

function panel(clave) {
  const t = DATA.arboles[clave];
  const el = document.getElementById("pn-" + clave);
  const id = seleccion[clave];
  if (!id) {
    el.innerHTML = `<div class="tipo">Sustento</div><h3>Selecciona una caja del árbol</h3><p class="vacio">Verás la evidencia del diagnóstico que la respalda, su fuente, su lectura en el análisis de riesgo (peligro, exposición, fragilidad, resiliencia) y la línea de intervención del proyecto que la atiende.</p>${t.lectura ? `<dl><div><dt>Lectura del árbol</dt><dd>${esc(t.lectura)}</dd></div></dl>` : ""}`;
    return;
  }
  const n = buscar(t, id), nv = nivelDe(t, id);
  const lista = (arr) => arr && arr.length ? "<ul>" + arr.map((x) => `<li>${esc(x)}</li>`).join("") + "</ul>" : '<span class="vacio">Sin dato específico.</span>';
  const prov = n.prov ? Object.entries(n.prov).filter(([, v]) => v > 0).map(([k, v]) => `<span class="chip">${PROV[k]} · ${["", "puntual", "frecuente", "generalizada"][v]}</span>`).join("") : "";
  el.innerHTML = `<div class="tipo">${NIV[nv]} · <span style="font-family:var(--mono)">${esc(n.id)}</span></div>
    <h3>${esc(nv === "EX" ? n.titulo : n.texto)}</h3>
    <dl>
      ${nv === "EX" ? `<div><dt>Factores</dt><dd>${esc(n.texto)}</dd></div>` : ""}
      ${n.indicador ? `<div><dt>Indicador</dt><dd>${esc(n.indicador)}</dd></div>` : ""}
      <div><dt>Evidencia del diagnóstico</dt><dd>${lista(n.sustento)}</dd></div>
      ${prov ? `<div><dt>Presencia por provincia</dt><dd>${prov}</dd></div>` : ""}
      ${n.adr ? `<div><dt>Lectura AdR-CCC</dt><dd>${esc(n.adr)}</dd></div>` : ""}
      ${n.linea ? `<div><dt>Lo atiende en el proyecto</dt><dd>${esc(n.linea)}</dd></div>` : ""}
      ${n.fuentes && n.fuentes.length ? `<div><dt>Fuente</dt><dd class="fuente">${n.fuentes.map(esc).join("<br>")}</dd></div>` : ""}
    </dl>`;
}

function esquemaHTML(t) {
  const li = (n) => `<li>${esc(n.texto)} <span class="nota" style="font-family:var(--mono)">${esc(n.id)}</span></li>`;
  return `<div class="esquema">
    <h4>Efecto final</h4><ol><li>${esc(t.efecto_final.texto)}</li></ol>
    <h4>Efectos indirectos</h4><ol>${t.efectos_indirectos.map(li).join("")}</ol>
    <h4>Efectos directos</h4><ol>${t.efectos_directos.map(li).join("")}</ol>
    <h4>Problema central</h4><p class="pcx">${esc(t.problema.texto)}</p>${t.problema.indicador ? `<p class="nota">${esc(t.problema.indicador)}</p>` : ""}
    <h4>Causas directas e indirectas</h4><ol>${t.causas_directas.map((c) => `<li><b>${esc(c.texto)}</b> <span class="nota" style="font-family:var(--mono)">${esc(c.id)}</span><ol>${t.causas_indirectas.filter((x) => x.padre === c.id).map(li).join("")}</ol></li>`).join("")}</ol>
    ${(t.factores_exogenos || []).length ? `<h4>Factores exógenos de peligro (contexto, no controlables por el proyecto)</h4><ol>${t.factores_exogenos.map((f) => `<li><b>${esc(f.titulo)}:</b> ${esc(f.texto)}</li>`).join("")}</ol>` : ""}
  </div>`;
}

function textoPlano(t) {
  const L = [];
  L.push(t.titulo.toUpperCase(), t.subtitulo, "");
  L.push("EFECTO FINAL", "  " + t.efecto_final.texto, "");
  L.push("EFECTOS INDIRECTOS"); t.efectos_indirectos.forEach((e) => L.push(`  ${e.id}. ${e.texto}`)); L.push("");
  L.push("EFECTOS DIRECTOS"); t.efectos_directos.forEach((e) => L.push(`  ${e.id}. ${e.texto}`)); L.push("");
  L.push("PROBLEMA CENTRAL", "  " + t.problema.texto); if (t.problema.indicador) L.push("  " + t.problema.indicador); L.push("");
  L.push("CAUSAS");
  t.causas_directas.forEach((c) => { L.push(`  ${c.id}. ${c.texto}`); t.causas_indirectas.filter((x) => x.padre === c.id).forEach((x) => L.push(`      ${x.id}. ${x.texto}`)); });
  if ((t.factores_exogenos || []).length) { L.push("", "FACTORES EXÓGENOS DE PELIGRO"); t.factores_exogenos.forEach((f) => L.push(`  ${f.titulo}: ${f.texto}`)); }
  return L.join("\n");
}

function copiar(clave, btn) {
  const txt = textoPlano(DATA.arboles[clave]);
  const ok = () => toast("Texto del árbol copiado");
  try {
    navigator.clipboard.writeText(txt).then(ok, () => fallback());
  } catch (e) { fallback(); }
  function fallback() {
    const ta = document.createElement("textarea"); ta.value = txt; ta.style.position = "fixed"; ta.style.opacity = "0";
    document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); ok(); } catch (e) { toast("Selecciona el texto en la vista Esquema y cópialo"); }
    ta.remove();
  }
}

function vistaArbol(clave) {
  const t = DATA.arboles[clave];
  const ficha = (t.ficha || []).map((f) => `<li>${esc(f.k)}: <b>${esc(f.v)}</b></li>`).join("");
  return `<section class="vista" id="v-${clave}" role="tabpanel" aria-labelledby="t-${clave}" hidden>
    <div class="cab">
      <div><h2>${esc(t.titulo)}</h2><p>${esc(t.subtitulo)}</p>${ficha ? `<ul class="ficha">${ficha}</ul>` : ""}</div>
      <div class="ctrl">
        <button class="btn" type="button" id="bd-${clave}" aria-pressed="true" data-modo="diagrama">Diagrama</button>
        <button class="btn" type="button" id="be-${clave}" aria-pressed="false" data-modo="esquema">Esquema</button>
        <button class="btn" type="button" id="bf-${clave}" aria-pressed="true" data-foco="1" title="Al seleccionar una caja, resalta su cadena de causas y efectos">Resaltar cadena</button>
        <button class="btn" type="button" id="bc-${clave}" data-copiar="1">Copiar texto</button>
      </div>
    </div>
    <div class="zona">
      <div style="min-width:0">
        <div class="lienzo-scroll" id="ls-${clave}">${construirArbol(clave, t)}</div>
        <div id="es-${clave}" hidden>${esquemaHTML(t)}</div>
      </div>
      <aside class="panel" id="pn-${clave}" aria-live="polite"></aside>
    </div>
  </section>`;
}

function iniciar() {
  document.getElementById("h1").textContent = DATA.meta.titulo_pagina;
  document.getElementById("sub").textContent = DATA.meta.subtitulo;
  document.getElementById("ver").textContent = DATA.meta.version;
  const tabs = document.getElementById("tabs"), vistas = document.getElementById("vistas");
  const claves = [...DATA.orden, "metodo"];
  tabs.innerHTML = claves.map((k) => {
    const nom = k === "metodo" ? "Sustento y método" : DATA.arboles[k].pestana;
    const sig = k === "metodo" ? "" : `<span class="k">${esc(DATA.arboles[k].sigla || "")}</span>`;
    return `<button class="tab" role="tab" id="t-${k}" aria-controls="v-${k}" aria-selected="false" data-k="${k}">${esc(nom)}${sig}</button>`;
  }).join("");
  vistas.innerHTML = DATA.orden.map(vistaArbol).join("") + `<section class="vista doc" id="v-metodo" role="tabpanel" aria-labelledby="t-metodo" hidden>${DATA.metodo_html}</section>`;
  DATA.orden.forEach((k) => {
    foco[k] = true; panel(k);
    const v = document.getElementById("v-" + k);
    v.addEventListener("click", (ev) => {
      const n = ev.target.closest(".nodo");
      if (n) { seleccion[k] = seleccion[k] === n.dataset.id ? null : n.dataset.id; marcarRuta(k); panel(k); return; }
      const b = ev.target.closest(".btn"); if (!b) return;
      if (b.dataset.modo) {
        const esq = b.dataset.modo === "esquema";
        document.getElementById("ls-" + k).hidden = esq; document.getElementById("es-" + k).hidden = !esq;
        document.getElementById("bd-" + k).setAttribute("aria-pressed", String(!esq)); document.getElementById("be-" + k).setAttribute("aria-pressed", String(esq));
        if (!esq) dibujar(k);
      } else if (b.dataset.foco) {
        foco[k] = !foco[k]; b.setAttribute("aria-pressed", String(foco[k])); marcarRuta(k);
      } else if (b.dataset.copiar) copiar(k, b);
    });
  });
  tabs.addEventListener("click", (ev) => { const b = ev.target.closest(".tab"); if (b) { location.hash = b.dataset.k; mostrar(b.dataset.k); } });
  tabs.addEventListener("keydown", (ev) => {
    if (!["ArrowLeft", "ArrowRight"].includes(ev.key)) return;
    const i = claves.indexOf(actual) + (ev.key === "ArrowRight" ? 1 : -1);
    const k = claves[(i + claves.length) % claves.length]; location.hash = k; mostrar(k); document.getElementById("t-" + k).focus();
  });
  window.addEventListener("hashchange", () => mostrar(location.hash.slice(1)));
  const ro = new ResizeObserver(() => DATA.orden.forEach(dibujar));
  DATA.orden.forEach((k) => ro.observe(document.getElementById("lz-" + k)));
  if (window.matchMedia && window.matchMedia("(max-width: 760px)").matches) {
    DATA.orden.forEach((k) => document.getElementById("be-" + k).click());
  }
  mostrar(location.hash.slice(1));
}
let actual = null;
function mostrar(k) {
  const claves = [...DATA.orden, "metodo"];
  if (!claves.includes(k)) k = DATA.orden[0];
  actual = k;
  claves.forEach((c) => {
    document.getElementById("v-" + c).hidden = c !== k;
    const t = document.getElementById("t-" + c); t.setAttribute("aria-selected", String(c === k)); t.tabIndex = c === k ? 0 : -1;
  });
  try { document.getElementById("t-" + k).scrollIntoView({ block: "nearest", inline: "nearest" }); } catch (e) {}
  if (k !== "metodo") requestAnimationFrame(() => dibujar(k));
}
if (document.fonts && document.fonts.ready) document.fonts.ready.then(() => DATA.orden.forEach(dibujar));
iniciar();
</script>

{% extends 'base.html' %}
{% block title %}Edit Assessment - {{ assessment.title }}{% endblock %}

{% block content %}
<section class="section">
    <div class="container container-md">
        <div class="breadcrumb">
            <a href="{{ url_for('admin_dashboard') }}">Dashboard</a> &raquo;
            <span>Edit: {{ assessment.title }}</span>
        </div>

        <h2 class="section-title">Edit Assessment Settings</h2>

        <div class="card">
            <form action="{{ url_for('admin_edit_assessment', assessment_id=assessment.id) }}" method="POST" class="form-vertical">
                <div class="form-group">
                    <label for="title">Assessment Title *</label>
                    <input type="text" id="title" name="title"
                           value="{{ assessment.title }}" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3">{{ assessment.description or '' }}</textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="assessment_type">Type *</label>
                        <select id="assessment_type" name="assessment_type" required>
                            {% for t in ['exam', 'quiz', 'homework', 'practice'] %}
                            <option value="{{ t }}" {% if assessment.assessment_type == t %}selected{% endif %}>{{ t|capitalize }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="time_limit">Time Limit (minutes)</label>
                        <input type="number" id="time_limit" name="time_limit"
                               value="{{ assessment.time_limit_minutes }}" min="0"
                               placeholder="0 = No limit">
                        <small style="color:#666;">0 = unlimited time</small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="grade_id">Grade *</label>
                        <select id="grade_id" name="grade_id" required>
                            <optgroup label="Primary School">
                                {% for g in grades if g.level_type == 'primaria' %}
                                    <option value="{{ g.id }}" {% if assessment.grade_id == g.id %}selected{% endif %}>{{ g.name }}</option>
                                {% endfor %}
                            </optgroup>
                            <optgroup label="Secondary School">
                                {% for g in grades if g.level_type == 'secundaria' %}
                                    <option value="{{ g.id }}" {% if assessment.grade_id == g.id %}selected{% endif %}>{{ g.name }}</option>
                                {% endfor %}
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="english_level_id">English Level *</label>
                        <select id="english_level_id" name="english_level_id" required>
                            {% for l in levels %}
                                <option value="{{ l.id }}" {% if assessment.english_level_id == l.id %}selected{% endif %}>{{ l.name }} ({{ l.code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date (optional)</label>
                    <input type="date" id="due_date" name="due_date"
                           value="{{ assessment.due_date.strftime('%Y-%m-%d') if assessment.due_date else '' }}">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="shuffle" {% if assessment.shuffle_questions %}checked{% endif %}> Shuffle questions
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="show_results" {% if assessment.show_results %}checked{% endif %}> Show results to students
                        </label>
                    </div>
                </div>

                <div class="form-group" style="margin-top:1rem;">
                    <p><strong>Access Code:</strong> <code>{{ assessment.access_code }}</code></p>
                </div>

                <div style="display:flex; gap:1rem; margin-top:1rem;">
                    <button type="submit" class="btn btn-primary">Save Changes</button>
                    <a href="{{ url_for('admin_dashboard') }}" class="btn btn-secondary">Cancel</a>
                    <a href="{{ url_for('admin_edit_questions', assessment_id=assessment.id) }}" class="btn btn-secondary">Edit Questions</a>
                </div>
            </form>
        </div>
    </div>
</section>
{% endblock %}

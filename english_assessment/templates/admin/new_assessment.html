{% extends 'base.html' %}
{% block title %}Create New Assessment{% endblock %}

{% block content %}
<section class="section">
    <div class="container container-md">
        <div class="breadcrumb">
            <a href="{{ url_for('admin_dashboard') }}">Dashboard</a> &raquo;
            <span>New Assessment</span>
        </div>

        <h2 class="section-title">Create New Assessment</h2>

        <div class="card">
            <form action="{{ url_for('admin_new_assessment') }}" method="POST" class="form-vertical">
                <div class="form-group">
                    <label for="title">Assessment Title *</label>
                    <input type="text" id="title" name="title"
                           placeholder="e.g. Unit 3 Vocabulary Quiz" required>
                </div>

                <div class="form-group">
                    <label for="description">Description</label>
                    <textarea id="description" name="description" rows="3"
                              placeholder="Brief description of the assessment..."></textarea>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="assessment_type">Type *</label>
                        <select id="assessment_type" name="assessment_type" required>
                            <option value="exam">Exam</option>
                            <option value="quiz">Quiz</option>
                            <option value="homework">Homework</option>
                            <option value="practice">Practice</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="time_limit">Time Limit (minutes)</label>
                        <input type="number" id="time_limit" name="time_limit" value="0" min="0"
                               placeholder="0 = No limit">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="grade_id">Grade *</label>
                        <select id="grade_id" name="grade_id" required>
                            <optgroup label="Primary School">
                                {% for g in grades if g.level_type == 'primaria' %}
                                    <option value="{{ g.id }}">{{ g.name }}</option>
                                {% endfor %}
                            </optgroup>
                            <optgroup label="Secondary School">
                                {% for g in grades if g.level_type == 'secundaria' %}
                                    <option value="{{ g.id }}">{{ g.name }}</option>
                                {% endfor %}
                            </optgroup>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="english_level_id">English Level *</label>
                        <select id="english_level_id" name="english_level_id" required>
                            {% for l in levels %}
                                <option value="{{ l.id }}">{{ l.name }} ({{ l.code }})</option>
                            {% endfor %}
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="due_date">Due Date (optional)</label>
                    <input type="date" id="due_date" name="due_date">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="shuffle"> Shuffle questions
                        </label>
                    </div>
                    <div class="form-group">
                        <label class="checkbox-label">
                            <input type="checkbox" name="show_results" checked> Show results to students
                        </label>
                    </div>
                </div>

                <button type="submit" class="btn btn-primary btn-block">
                    Create Assessment &amp; Add Questions
                </button>
            </form>
        </div>
    </div>
</section>
{% endblock %}

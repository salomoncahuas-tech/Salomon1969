databases:
  - name: english-assessment-db
    plan: free

services:
  - type: web
    name: english-assessment
    runtime: python
    rootDir: english_assessment
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: english-assessment-db
          property: connectionString
    plan: free

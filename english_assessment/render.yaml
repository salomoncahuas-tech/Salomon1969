databases:
  - name: english-assessment-db
    plan: free
    databaseName: english_assessments
    user: english_assessment_user

services:
  - type: web
    name: english-assessment-app
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: english-assessment-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.6"

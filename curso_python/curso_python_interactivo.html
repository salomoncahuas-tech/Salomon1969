<title>Python desde cero</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Curso autodidacta de Python para principiantes: lecciones, ejemplos ejecutables, ejercicios con comprobación automática y autoevaluaciones.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: barra superior fija + índice lateral de módulos + columna de lectura (~72ch) con tarjetas de código tipo terminal */
:root {
  --bg: #F4F7FA;
  --surface: #FFFFFF;
  --surface-2: #EAF1F7;
  --line: #D2DDE7;
  --fg: #13212D;
  --fg-muted: #4B5F6E;
  --primary: #1B4F72;
  --secondary: #2E86AB;
  --btn: #1B4F72;
  --btn-fg: #FFFFFF;
  --link: #1B5E8C;
  --ok: #1D7044; --ok-bg: #E3F3E9;
  --warn: #7A5000; --warn-bg: #FFF3D6;
  --err: #A8261B; --err-bg: #FCEBE9;
  --code-bg: #F2F6FA; --code-fg: #13212D;
  --term-bg: #0F1F2C; --term-fg: #DCE7EF; --term-muted: #8BA3B5;
  --tk-kw: #1B4F72; --tk-str: #8A4B08; --tk-num: #7B3FA0; --tk-com: #5E7383; --tk-fn: #0E6E8C; --tk-bi: #2B7A3E;
  --font-text: Arial, "Helvetica Neue", Helvetica, sans-serif;
  --font-code: "JetBrains Mono", Consolas, "Cascadia Mono", "Courier New", monospace;
  --radius: 8px;
  --shadow: 0 1px 2px rgba(19, 33, 45, .06), 0 2px 8px rgba(19, 33, 45, .05);
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1620; --surface: #122130; --surface-2: #182B3C; --line: #284055;
    --fg: #E3EBF1; --fg-muted: #9CB0BF;
    --primary: #7DBCE0; --secondary: #4FA9CF; --btn: #2E86AB; --btn-fg: #FFFFFF; --link: #8CC6E8;
    --ok: #6FD39A; --ok-bg: #12301F; --warn: #F2C46B; --warn-bg: #33270C; --err: #F4978E; --err-bg: #3A1714;
    --code-bg: #0F1D2A; --code-fg: #E3EBF1;
    --term-bg: #08121B; --term-fg: #DCE7EF; --term-muted: #7F98AA;
    --tk-kw: #7DBCE0; --tk-str: #F0B67F; --tk-num: #D2A8F0; --tk-com: #7F98AA; --tk-fn: #6FD0E8; --tk-bi: #8FD8A0;
    --shadow: 0 1px 2px rgba(0, 0, 0, .3);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1620; --surface: #122130; --surface-2: #182B3C; --line: #284055;
  --fg: #E3EBF1; --fg-muted: #9CB0BF;
  --primary: #7DBCE0; --secondary: #4FA9CF; --btn: #2E86AB; --btn-fg: #FFFFFF; --link: #8CC6E8;
  --ok: #6FD39A; --ok-bg: #12301F; --warn: #F2C46B; --warn-bg: #33270C; --err: #F4978E; --err-bg: #3A1714;
  --code-bg: #0F1D2A; --code-fg: #E3EBF1;
  --term-bg: #08121B; --term-fg: #DCE7EF; --term-muted: #7F98AA;
  --tk-kw: #7DBCE0; --tk-str: #F0B67F; --tk-num: #D2A8F0; --tk-com: #7F98AA; --tk-fn: #6FD0E8; --tk-bi: #8FD8A0;
  --shadow: 0 1px 2px rgba(0, 0, 0, .3);
  color-scheme: dark;
}

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { scroll-padding-top: 72px; }
body { background: var(--bg); color: var(--fg); font-family: var(--font-text); font-size: 16px; line-height: 1.6; margin: 0; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--primary); }
a { color: var(--link); }
:focus-visible { outline: 3px solid var(--secondary); outline-offset: 2px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }

/* Barra superior */
.barra { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: #1B4F72; color: #FFFFFF; }
.barra-in { max-width: 1280px; margin: 0 auto; display: flex; align-items: center; gap: 16px; flex-wrap: wrap;
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.marca { display: flex; align-items: baseline; gap: 10px; color: inherit; text-decoration: none; min-width: 0; }
.marca b { font-size: 19px; letter-spacing: .2px; }
.marca span { font-size: 13px; opacity: .8; }
.marca code { font-family: var(--font-code); font-size: 15px; background: rgba(255,255,255,.14); padding: 1px 6px; border-radius: 4px; }
.barra-der { margin-left: auto; display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.avance-global { display: flex; align-items: center; gap: 8px; font-size: 13px; font-variant-numeric: tabular-nums; }
.avance-global .pista-barra { width: 120px; height: 6px; background: rgba(255,255,255,.22); border-radius: 3px; overflow: hidden; }
.avance-global .pista-barra i { display: block; height: 100%; background: #9FD3EA; width: 0; transition: width .3s; }
.estado-py { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 10px; border-radius: 999px; background: rgba(255,255,255,.14); white-space: nowrap; }
.estado-py::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: #F2C46B; }
.estado-py[data-s="ready"]::before { background: #6FD39A; }
.estado-py[data-s="error"]::before { background: #F4978E; }
.btn-menu { display: none; background: rgba(255,255,255,.14); color: #FFFFFF; border: 0; border-radius: 6px; padding: 6px 12px; font: inherit; font-size: 14px; cursor: pointer; }

/* Marco */
.marco { max-width: 1280px; margin: 0 auto; display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 32px;
  padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.indice { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 72px); align-self: start; max-height: calc(100vh - 96px); overflow-y: auto; font-size: 14px; }
.indice h2 { font-size: 11px; text-transform: uppercase; letter-spacing: 1.2px; color: var(--fg-muted); margin: 18px 8px 6px; }
.indice h2:first-child { margin-top: 0; }
.indice a { display: grid; grid-template-columns: 38px 1fr auto; gap: 6px; align-items: center; padding: 7px 8px; border-radius: 6px; color: var(--fg); text-decoration: none; line-height: 1.3; }
.indice a:hover { background: var(--surface-2); }
.indice a[aria-current="page"] { background: var(--surface); box-shadow: inset 3px 0 0 var(--secondary), var(--shadow); font-weight: bold; }
.indice .cod { font-family: var(--font-code); font-size: 12px; color: var(--fg-muted); }
.indice .cnt { font-size: 11px; color: var(--fg-muted); font-variant-numeric: tabular-nums; white-space: nowrap; }
.indice .cnt.ok { color: var(--ok); font-weight: bold; }
.indice a.simple { grid-template-columns: 38px 1fr; }

main { min-width: 0; }
.vista { max-width: 820px; }

/* Tipografía */
h1 { font-size: 30px; line-height: 1.2; margin: 4px 0 10px; color: var(--primary); text-wrap: balance; }
h2 { font-size: 22px; line-height: 1.25; margin: 36px 0 12px; color: var(--primary); text-wrap: balance; }
h3 { font-size: 18px; line-height: 1.3; margin: 0 0 8px; text-wrap: balance; }
.antetitulo { font-size: 12px; text-transform: uppercase; letter-spacing: 1.3px; color: var(--secondary); font-weight: bold; }
.lead { font-size: 18px; color: var(--fg-muted); max-width: 66ch; }
.prosa { max-width: 72ch; }
.prosa p { margin: 0 0 12px; }
.prosa ul, .prosa ol { margin: 0 0 12px; padding-left: 22px; }
.prosa li { margin-bottom: 4px; }
.prosa code, .enunciado code, .meta code, .glosa code { font-family: var(--font-code); font-size: .88em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.prosa pre { background: var(--code-bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px 14px; overflow-x: auto; }
.prosa pre code { background: none; padding: 0; font-size: 14px; }
.tabla-env { overflow-x: auto; margin: 0 0 14px; }
.prosa table, .tabla { border-collapse: collapse; font-size: 14px; min-width: 100%; }
.prosa th, .prosa td, .tabla th, .tabla td { border: 1px solid var(--line); padding: 6px 10px; text-align: left; vertical-align: top; }
.prosa th, .tabla th { background: var(--primary); color: var(--surface); font-weight: bold; }
:root[data-theme="dark"] .prosa th, :root[data-theme="dark"] .tabla th { color: #0C1620; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .prosa th, :root:not([data-theme="light"]) .tabla th { color: #0C1620; } }
.prosa tr:nth-child(even) td, .tabla tr:nth-child(even) td { background: var(--surface-2); }
.prosa blockquote { margin: 0 0 12px; padding: 8px 14px; border-left: 3px solid var(--secondary); background: var(--surface-2); border-radius: 0 6px 6px 0; }

/* Cabecera de módulo */
.cab-mod { display: grid; gap: 6px; }
.meta { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 14px; color: var(--fg-muted); }
.objetivos { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-top: 14px; }
.objetivos b { display: block; margin-bottom: 4px; font-size: 14px; }
.objetivos ul { margin: 0; padding-left: 20px; }
.aviso { background: var(--warn-bg); color: var(--warn); border-radius: var(--radius); padding: 10px 14px; font-size: 14px; margin-top: 12px; }

/* Pestañas */
.pestanas { display: flex; gap: 4px; border-bottom: 2px solid var(--line); margin: 26px 0 20px; overflow-x: auto; }
.pestanas button { background: none; border: 0; border-bottom: 3px solid transparent; margin-bottom: -2px; padding: 10px 14px; font: inherit; font-size: 15px; color: var(--fg-muted); cursor: pointer; white-space: nowrap; }
.pestanas button[aria-selected="true"] { color: var(--primary); border-bottom-color: var(--secondary); font-weight: bold; }
.pestanas .n { font-size: 12px; font-variant-numeric: tabular-nums; margin-left: 4px; opacity: .8; }

/* Lecciones */
.leccion { padding-bottom: 26px; margin-bottom: 26px; border-bottom: 1px solid var(--line); }
.leccion:last-child { border-bottom: 0; }
.leccion h3 .num { font-family: var(--font-code); font-size: 14px; color: var(--secondary); margin-right: 8px; }

/* Bloque de código */
.codigo { border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; background: var(--code-bg); margin-top: 6px; }
.codigo-barra { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; padding: 6px 8px 6px 12px; background: var(--surface-2); border-bottom: 1px solid var(--line); font-size: 12px; color: var(--fg-muted); }
.codigo-barra .etq { text-transform: uppercase; letter-spacing: 1px; font-weight: bold; }
.codigo-barra .acciones { margin-left: auto; display: flex; gap: 6px; flex-wrap: wrap; }
pre.resaltado { margin: 0; padding: 12px 14px; overflow-x: auto; font-family: var(--font-code); font-size: 14px; line-height: 1.55; color: var(--code-fg); }
.editor { display: block; width: 100%; min-height: 120px; resize: vertical; border: 0; margin: 0; padding: 12px 14px; font-family: var(--font-code); font-size: 14px; line-height: 1.55; background: var(--code-bg); color: var(--code-fg); tab-size: 4; white-space: pre; overflow-x: auto; }
.editor:focus { outline: 2px solid var(--secondary); outline-offset: -2px; }
.entrada-box { border-top: 1px dashed var(--line); padding: 8px 12px; background: var(--surface-2); }
.entrada-box label { display: block; font-size: 12px; color: var(--fg-muted); margin-bottom: 4px; }
.entrada-box textarea { width: 100%; min-height: 48px; font-family: var(--font-code); font-size: 13px; border: 1px solid var(--line); border-radius: 6px; background: var(--surface); color: var(--fg); padding: 6px 8px; resize: vertical; }
.salida { background: var(--term-bg); color: var(--term-fg); font-family: var(--font-code); font-size: 13.5px; }
.salida-titulo { display: flex; justify-content: space-between; gap: 8px; padding: 6px 14px 0; font-family: var(--font-text); font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--term-muted); }
.salida pre { margin: 0; padding: 6px 14px 12px; white-space: pre-wrap; word-break: break-word; font-family: inherit; }
.salida pre.err { color: #FF9E94; }
.salida pre.vacio { color: var(--term-muted); font-style: italic; }
.salida img { display: block; max-width: 100%; background: #FFFFFF; margin: 4px 14px 14px; border-radius: 4px; }
.solo-jupyter { display: inline-block; font-size: 11px; font-weight: bold; padding: 2px 8px; border-radius: 999px; background: var(--warn-bg); color: var(--warn); text-transform: none; letter-spacing: 0; }

/* Botones */
.btn { text-decoration: none; display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); color: var(--fg); font: inherit; font-size: 13px; padding: 5px 11px; border-radius: 6px; cursor: pointer; line-height: 1.3; }
.btn:hover { border-color: var(--secondary); }
.btn.prim { background: var(--btn); color: var(--btn-fg); border-color: var(--btn); font-weight: bold; }
.btn.prim:hover { filter: brightness(1.1); }
.btn:disabled { opacity: .55; cursor: wait; }
.btn.grande { font-size: 15px; padding: 9px 18px; }

/* Ejercicios */
.ejercicio { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); padding: 16px 18px 18px; margin-bottom: 22px; }
.ej-cab { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; }
.ej-cab h3 { margin: 0; flex: 1 1 260px; }
.chip { display: inline-block; font-size: 12px; padding: 2px 9px; border-radius: 999px; border: 1px solid var(--line); color: var(--fg-muted); white-space: nowrap; }
.chip.nivel { font-family: var(--font-code); letter-spacing: 1px; }
.chip.hecho { background: var(--ok-bg); color: var(--ok); border-color: transparent; font-weight: bold; }
.enunciado { margin: 10px 0 12px; max-width: 72ch; }
.enunciado p { margin: 0 0 8px; }
.ej-acciones { display: flex; gap: 8px; flex-wrap: wrap; padding: 10px 12px; background: var(--surface-2); border-top: 1px solid var(--line); }
.resultado { margin-top: 12px; border-radius: var(--radius); padding: 10px 14px; font-size: 14px; }
.resultado.ok { background: var(--ok-bg); color: var(--ok); }
.resultado.no { background: var(--warn-bg); color: var(--warn); }
.resultado b { display: block; }
.caja { margin-top: 12px; border-radius: var(--radius); padding: 10px 14px; background: var(--surface-2); font-size: 14px; }
.caja > b { display: block; margin-bottom: 4px; color: var(--primary); }
.caja p { margin: 0; }
.caja .codigo { margin-top: 8px; }

/* Autoevaluación */
.pregunta { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 18px; margin-bottom: 14px; }
.pregunta > p { margin: 0 0 10px; font-weight: bold; }
.opciones { display: grid; gap: 8px; }
.opcion { text-align: left; border: 1px solid var(--line); background: var(--bg); color: var(--fg); border-radius: 6px; padding: 8px 12px; font: inherit; font-size: 15px; cursor: pointer; display: grid; grid-template-columns: 26px 1fr; gap: 6px; }
.opcion:hover:not(:disabled) { border-color: var(--secondary); }
.opcion .l { font-family: var(--font-code); color: var(--fg-muted); }
.opcion:disabled { cursor: default; }
.opcion.bien { background: var(--ok-bg); border-color: var(--ok); color: var(--ok); font-weight: bold; }
.opcion.mal { background: var(--err-bg); border-color: var(--err); color: var(--err); }
.pregunta code, .opcion code, .explica code { font-family: var(--font-code); font-size: .9em; background: var(--surface-2); padding: 1px 5px; border-radius: 4px; }
.explica { margin-top: 10px; font-size: 14px; color: var(--fg-muted); }
.puntaje { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; font-size: 15px; margin-bottom: 14px; font-variant-numeric: tabular-nums; }

/* Glosario */
.glosa { display: grid; grid-template-columns: minmax(140px, 220px) 1fr; border-top: 1px solid var(--line); }
.glosa > div { padding: 9px 10px; border-bottom: 1px solid var(--line); }
.glosa .t { font-weight: bold; color: var(--primary); }
.glosa .mref { font-family: var(--font-code); font-size: 12px; color: var(--fg-muted); margin-left: 6px; font-weight: normal; }
.buscador { width: 100%; max-width: 420px; padding: 9px 12px; border: 1px solid var(--line); border-radius: 6px; font: inherit; background: var(--surface); color: var(--fg); margin-bottom: 14px; }

/* Inicio */
.pasos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; margin: 0; padding: 0; list-style: none; counter-reset: paso; }
.pasos li { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; counter-increment: paso; font-size: 15px; }
.pasos li::before { content: counter(paso); display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--btn); color: var(--btn-fg); font-weight: bold; font-size: 14px; margin-bottom: 8px; }
.pasos b { display: block; margin-bottom: 2px; }
.cifras { display: flex; flex-wrap: wrap; gap: 10px 28px; margin: 16px 0 6px; font-size: 14px; color: var(--fg-muted); }
.cifras b { display: block; font-size: 24px; color: var(--primary); font-variant-numeric: tabular-nums; }
.acciones-inicio { display: flex; gap: 10px; flex-wrap: wrap; margin: 18px 0 8px; }
.barra-mini { width: 90px; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; display: inline-block; vertical-align: middle; margin-right: 6px; }
.barra-mini i { display: block; height: 100%; background: var(--secondary); }
.nav-mod { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 36px; padding-top: 18px; border-top: 1px solid var(--line); }
.nota { font-size: 13px; color: var(--fg-muted); }

@media (max-width: 900px) {
  .marco { grid-template-columns: minmax(0, 1fr); gap: 0; }
  .btn-menu { display: inline-block; }
  .indice { position: static; max-height: none; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 12px; margin-bottom: 18px; }
  .indice:not(.abierto) { display: none; }
  .avance-global .pista-barra { width: 70px; }
  .pasos { grid-template-columns: minmax(0, 1fr); }
  h1 { font-size: 25px; }
}
@media (max-width: 520px) {
  .marca span { display: none; }
  .glosa { grid-template-columns: minmax(0, 1fr); }
  .glosa .d { border-bottom: 1px solid var(--line); padding-top: 0; }
  .glosa .t { border-bottom: 0; }
}

/* Resaltado de sintaxis (clases de Pygments) */
.k, .kn, .kc, .kd, .kr, .ow { color: var(--tk-kw); font-weight: 600; }
.s, .s1, .s2, .sa, .sd, .sb, .sc, .sh, .si, .sx, .dl { color: var(--tk-str); }
.se { color: var(--tk-num); }
.mi, .mf, .mh, .mo, .il { color: var(--tk-num); }
.c, .c1, .cm, .ch, .cs { color: var(--tk-com); font-style: italic; }
.nf, .fm, .nc { color: var(--tk-fn); font-weight: 600; }
.nb, .bp { color: var(--tk-bi); }
</style>

<header class="barra">
  <div class="barra-in">
    <a class="marca" href="#inicio"><code>&gt;&gt;&gt;</code><b>Python desde cero</b><span>Curso autodidacta</span></a>
    <button class="btn-menu" id="btnMenu" aria-expanded="false" aria-controls="indice">Módulos</button>
    <div class="barra-der">
      <div class="avance-global" title="Ejercicios resueltos"><span id="avTxt">0 / 60</span><span class="pista-barra"><i id="avBar"></i></span></div>
      <span class="estado-py" id="estadoPy" data-s="loading">Python: cargando…</span>
    </div>
  </div>
</header>

<div class="marco">
  <nav class="indice" id="indice" aria-label="Índice del curso"></nav>
  <main id="principal"><div class="vista" id="vista"></div></main>

<script>
const DATOS = {"mods":[{"id":"M00","n":0,"t":"Antes de empezar: ¿qué es programar?","dur":"1 h","obj":["Entender qué es un programa y qué es un lenguaje de programación.","Conocer qué es Python y para qué sirve en el trabajo técnico.","Saber dónde escribir y ejecutar código (sin instalar nada y con Jupyter).","Perderle el miedo a los mensajes de error."],"web":true,"lec":[{"t":"¿Qué es programar?","h":"<p>Programar es <strong>escribir instrucciones para que una computadora las ejecute<\/strong>.<\/p>\n<p>Piense en un <strong>protocolo de campo<\/strong> para medir una parcela: \"1) ubicar el vértice A, 2) medir 20 m al norte, 3) colocar la estaca…\". Si el protocolo es claro y está en orden, cualquier brigada obtiene el mismo resultado.<\/p>\n<p>Un programa es lo mismo, con una diferencia importante: <strong>la computadora no interpreta ni adivina<\/strong>. Hace exactamente lo que se le dice, al pie de la letra. Por eso los lenguajes de programación tienen reglas estrictas de escritura, llamadas <strong>sintaxis<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Concepto<\/th>\n<th>En la vida diaria<\/th>\n<th>En programación<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Instrucción<\/td>\n<td>\"Mida el DAP\"<\/td>\n<td><code>print(\"Hola\")<\/code><\/td>\n<\/tr>\n<tr>\n<td>Secuencia<\/td>\n<td>Pasos del protocolo en orden<\/td>\n<td>Líneas de código de arriba hacia abajo<\/td>\n<\/tr>\n<tr>\n<td>Programa<\/td>\n<td>Protocolo completo<\/td>\n<td>Archivo <code>.py<\/code> o cuaderno <code>.ipynb<\/code><\/td>\n<\/tr>\n<tr>\n<td>Error<\/td>\n<td>Paso ambiguo o mal escrito<\/td>\n<td>Mensaje de error de Python<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","web":true},{"t":"¿Qué es Python y por qué aprenderlo?","h":"<p><strong>Python<\/strong> es un lenguaje de programación gratuito, de código abierto y fácil de leer. Fue diseñado para parecerse al inglés sencillo.<\/p>\n<p>Se usa ampliamente en ciencia, ingeniería y sistemas de información geográfica:<\/p>\n<table>\n<thead>\n<tr>\n<th>Herramienta<\/th>\n<th>Uso típico<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>pandas<\/strong><\/td>\n<td>Tablas de datos (como Excel, pero automatizado)<\/td>\n<\/tr>\n<tr>\n<td><strong>openpyxl<\/strong><\/td>\n<td>Crear y editar archivos Excel<\/td>\n<\/tr>\n<tr>\n<td><strong>matplotlib<\/strong><\/td>\n<td>Gráficos<\/td>\n<\/tr>\n<tr>\n<td><strong>pyproj / geopandas<\/strong><\/td>\n<td>Coordenadas y capas geográficas<\/td>\n<\/tr>\n<tr>\n<td><strong>PyQGIS / arcpy<\/strong><\/td>\n<td>Automatizar QGIS y ArcGIS<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Python es un lenguaje <strong>interpretado<\/strong>: un programa llamado <em>intérprete<\/em> lee el código línea por línea y lo ejecuta de inmediato. Esto permite probar ideas rápidamente.<\/p>","web":true},{"t":"¿Dónde escribo el código?","h":"<p>Tiene tres opciones. <strong>Recomendación:<\/strong> empiece con la opción A y pase a la C cuando llegue al Módulo 13.<\/p>\n<p><strong>A. Curso interactivo (HTML) — sin instalar nada.<\/strong> Cada ejemplo tiene un botón <strong>Ejecutar<\/strong> y cada ejercicio un botón <strong>Comprobar<\/strong>. Funciona para los módulos 0 a 12 y parte del 14.<\/p>\n<p><strong>B. Google Colab<\/strong> (colab.research.google.com). Funciona en el navegador con una cuenta de Google. Permite abrir los cuadernos <code>.ipynb<\/code> de este curso (<em>Archivo → Subir cuaderno<\/em>).<\/p>\n<p><strong>C. Anaconda + Jupyter (instalación local, recomendada para trabajo real).<\/strong><\/p>\n<ol>\n<li>Ingrese a <code>anaconda.com/download<\/code> y descargue el instalador para su sistema (Windows 64 bits).<\/li>\n<li>Ejecute el instalador y acepte las opciones por defecto.<\/li>\n<li>Abra <strong>Anaconda Navigator<\/strong> desde el menú Inicio y pulse <strong>Launch<\/strong> en <em>Jupyter Notebook<\/em> (o <em>JupyterLab<\/em>).<\/li>\n<li>Se abrirá el navegador con sus carpetas: ubique la carpeta del curso y abra <code>M00_....ipynb<\/code>.<\/li>\n<\/ol>\n<p><strong>Cómo se usa un cuaderno Jupyter:<\/strong><\/p>\n<ul>\n<li>El cuaderno está formado por <strong>celdas<\/strong>. Hay celdas de <strong>texto<\/strong> (como esta) y celdas de <strong>código<\/strong>.<\/li>\n<li>Para ejecutar una celda de código: haga clic en ella y pulse <strong>Shift + Enter<\/strong>.<\/li>\n<li>El resultado aparece debajo de la celda.<\/li>\n<li>Ejecute las celdas <strong>en orden<\/strong>, de arriba hacia abajo.<\/li>\n<li>Si algo se comporta raro: menú <em>Kernel → Restart &amp; Run All<\/em> (reinicia y ejecuta todo).<\/li>\n<\/ul>","web":true},{"t":"Su primera línea de código","h":"<p>La instrucción más básica es <code>print()<\/code>, que <strong>muestra en pantalla<\/strong> lo que se coloca entre paréntesis.<\/p>\n<ul>\n<li><code>print<\/code> es el nombre de la instrucción (en Python se llama <strong>función<\/strong>).<\/li>\n<li>Los paréntesis <code>( )<\/code> encierran lo que se le entrega a la función.<\/li>\n<li>Las comillas <code>\" \"<\/code> indican que se trata de un <strong>texto<\/strong>.<\/li>\n<\/ul>\n<p>Ejecute la celda y observe el resultado.<\/p>","web":true,"c":"print(\"Hola, mundo\")\nprint(\"Estoy aprendiendo Python\")","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Hola, mundo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Estoy aprendiendo Python\"<\/span><span class=\"p\">)<\/span>\n","o":"Hola, mundo\nEstoy aprendiendo Python\n","e":null,"img":[],"in":"","err":false},{"t":"Los errores son normales (y útiles)","h":"<p>Todos los programadores cometen errores todos los días. Python avisa con un <strong>mensaje de error<\/strong>. Lea siempre <strong>la última línea<\/strong>: dice el <em>tipo<\/em> de error y una pista.<\/p>\n<p>En el siguiente ejemplo falta cerrar las comillas. Ejecútelo a propósito y lea el mensaje.<\/p>\n<p><strong>Lista de verificación ante un error:<\/strong><\/p>\n<ol>\n<li>¿Cerré todas las comillas <code>\" \"<\/code> y paréntesis <code>( )<\/code>?<\/li>\n<li>¿Escribí bien los nombres? Python distingue <strong>mayúsculas y minúsculas<\/strong> (<code>print<\/code> ≠ <code>Print<\/code>).<\/li>\n<li>¿Usé punto decimal (<code>3.5<\/code>) y no coma (<code>3,5<\/code>)?<\/li>\n<li>¿Respeté la sangría (espacios al inicio de la línea)? Lo verá en el Módulo 5.<\/li>\n<\/ol>","web":true,"c":"print(\"Hola, mundo)","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Hola, mundo)<\/span>\n","o":"","e":"  File \"<celda>\", line 1\n    print(\"Hola, mundo)\n          ^\nSyntaxError: unterminated string literal (detected at line 1)","img":[],"in":"","err":true}],"ej":[{"id":"M00-E1","t":"Su primer mensaje","n":1,"h":"<p>Guarde el texto <code>Hola, soy aprendiz de Python<\/code> en <code>mensaje<\/code> (ya está escrito el inicio) y muéstrelo con <code>print<\/code>.<\/p>","p":"mensaje = \"Escriba aquí el texto\"\nprint(mensaje)","pista":"<p>Reemplace solo lo que está entre comillas. Respete mayúsculas, la coma y los espacios.<\/p>","s":"mensaje = \"Hola, soy aprendiz de Python\"\nprint(mensaje)","sh":"<span class=\"n\">mensaje<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Hola, soy aprendiz de Python\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">mensaje<\/span><span class=\"p\">)<\/span>\n","so":"Hola, soy aprendiz de Python\n","test":"assert mensaje == \"Hola, soy aprendiz de Python\", \"El texto no coincide exactamente: revise mayúsculas, coma y espacios.\"","web":true},{"id":"M00-E2","t":"Corrija el error","n":1,"h":"<p>El siguiente código tiene un error de sintaxis. Ejecútelo, lea el mensaje y corríjalo.<\/p>","p":"frase = \"Python es fácil de aprender\nprint(frase)","pista":"<p>Mire dónde empieza el texto y dónde debería terminar. ¿Falta algún símbolo?<\/p>","s":"frase = \"Python es fácil de aprender\"\nprint(frase)","sh":"<span class=\"n\">frase<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Python es fácil de aprender\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">frase<\/span><span class=\"p\">)<\/span>\n","so":"Python es fácil de aprender\n","test":"assert frase == \"Python es fácil de aprender\", \"Revise el texto de la frase.\"","web":true},{"id":"M00-E3","t":"Python como calculadora","n":1,"h":"<p>En un vivero se produjeron 125 plantones en enero y 375 en febrero. Calcule el total y guárdelo en <code>total<\/code>.<\/p>","p":"total = 0   # reemplace el 0 por la operación\nprint(total)","pista":"<p>La suma se escribe con el signo +, igual que en una calculadora: <code>125 + 375<\/code>.<\/p>","s":"total = 125 + 375\nprint(total)","sh":"<span class=\"n\">total<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">125<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">375<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">total<\/span><span class=\"p\">)<\/span>\n","so":"500\n","test":"assert total == 500, f\"Se esperaba 500 y se obtuvo {total}.\"","web":true},{"id":"M00-E4","t":"Horas de estudio","n":1,"h":"<p>Si estudia 5 horas por semana durante 6 semanas, ¿cuántas horas estudiará? Guarde el resultado en <code>horas_totales<\/code>.<\/p>","p":"horas_totales = 0   # use el signo * para multiplicar\nprint(horas_totales)","pista":"<p>La multiplicación se escribe con asterisco: <code>5 * 6<\/code>.<\/p>","s":"horas_totales = 5 * 6\nprint(horas_totales)","sh":"<span class=\"n\">horas_totales<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">5<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">6<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">horas_totales<\/span><span class=\"p\">)<\/span>\n","so":"30\n","test":"assert horas_totales == 30, f\"Se esperaba 30 y se obtuvo {horas_totales}.\"","web":true}],"quiz":[{"q":"¿Qué es un programa?","o":["Un conjunto de instrucciones que la computadora ejecuta","Un archivo de Excel","Un tipo de computadora","Una página web"],"c":0,"x":"Un programa es una secuencia de instrucciones escritas en un lenguaje que la computadora puede ejecutar."},{"q":"En Jupyter, ¿cómo se ejecuta una celda de código?","o":["Enter","Ctrl + S","Shift + Enter","Doble clic"],"c":2,"x":"Shift + Enter ejecuta la celda y pasa a la siguiente."},{"q":"Ante un mensaje de error, ¿qué parte conviene leer primero?","o":["La primera línea","La última línea","Ninguna, se reinicia la computadora","Solo el número de línea"],"c":1,"x":"La última línea indica el tipo de error y una descripción breve del problema."},{"q":"¿Cuál de estas instrucciones es correcta?","o":["Print(\"Hola\")","print(\"Hola\")","print(Hola\")","PRINT(\"Hola\")"],"c":1,"x":"Python distingue mayúsculas: la función se llama print, en minúsculas, y el texto va entre comillas."}],"glos":[{"t":"Programa","d":"Conjunto de instrucciones que la computadora ejecuta en orden."},{"t":"Sintaxis","d":"Reglas de escritura de un lenguaje de programación."},{"t":"Intérprete","d":"Programa que lee y ejecuta código Python línea por línea."},{"t":"Celda","d":"Bloque de un cuaderno Jupyter; puede contener texto o código."},{"t":"Función","d":"Instrucción con nombre que realiza una tarea, como print()."}],"nb":"M00_antes_de_empezar.ipynb"},{"id":"M01","n":1,"t":"Primeros pasos: mostrar resultados y hacer cálculos","dur":"2 h","obj":["Usar print() para mostrar textos y números.","Escribir comentarios para documentar el código.","Realizar operaciones aritméticas y conocer el orden de las operaciones."],"web":true,"lec":[{"t":"La función print() en detalle","h":"<p><code>print()<\/code> puede mostrar <strong>textos<\/strong> (entre comillas) y <strong>números<\/strong> (sin comillas). Si se le entregan varios valores separados por <strong>comas<\/strong>, los muestra en la misma línea con un espacio entre ellos.<\/p>\n<ul>\n<li><code>sep=<\/code> cambia el separador entre valores.<\/li>\n<li><code>print()<\/code> vacío imprime una línea en blanco.<\/li>\n<\/ul>","web":true,"c":"print(\"Parcela\", 5)\nprint(\"Área:\", 2.5, \"ha\")\nprint(\"Norte\", \"Sur\", \"Este\", sep=\" | \")\nprint()\nprint(\"Fin del reporte\")","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Parcela\"<\/span><span class=\"p\">,<\/span> <span class=\"mi\">5<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Área:\"<\/span><span class=\"p\">,<\/span> <span class=\"mf\">2.5<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"ha\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Norte\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Sur\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Este\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">sep<\/span><span class=\"o\">=<\/span><span class=\"s2\">\" | \"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Fin del reporte\"<\/span><span class=\"p\">)<\/span>\n","o":"Parcela 5\nÁrea: 2.5 ha\nNorte | Sur | Este\n\nFin del reporte\n","e":null,"img":[],"in":"","err":false},{"t":"Comentarios: notas para personas","h":"<p>Todo lo que va después del símbolo <code>#<\/code> es un <strong>comentario<\/strong>: Python lo ignora. Sirve para explicar qué hace el código, a usted mismo en el futuro o a sus colegas.<\/p>\n<p>Buena práctica: comente el <strong>porqué<\/strong>, no lo obvio.<\/p>","web":true,"c":"# Cálculo de la superficie de una parcela rectangular de 20 m x 50 m\nprint(20 * 50)   # resultado en metros cuadrados","ch":"<span class=\"c1\"># Cálculo de la superficie de una parcela rectangular de 20 m x 50 m<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">20<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">50<\/span><span class=\"p\">)<\/span>   <span class=\"c1\"># resultado en metros cuadrados<\/span>\n","o":"1000\n","e":null,"img":[],"in":"","err":false},{"t":"Python como calculadora","h":"<table>\n<thead>\n<tr>\n<th>Operación<\/th>\n<th>Símbolo<\/th>\n<th>Ejemplo<\/th>\n<th>Resultado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Suma<\/td>\n<td><code>+<\/code><\/td>\n<td><code>7 + 2<\/code><\/td>\n<td><code>9<\/code><\/td>\n<\/tr>\n<tr>\n<td>Resta<\/td>\n<td><code>-<\/code><\/td>\n<td><code>7 - 2<\/code><\/td>\n<td><code>5<\/code><\/td>\n<\/tr>\n<tr>\n<td>Multiplicación<\/td>\n<td><code>*<\/code><\/td>\n<td><code>7 * 2<\/code><\/td>\n<td><code>14<\/code><\/td>\n<\/tr>\n<tr>\n<td>División<\/td>\n<td><code>/<\/code><\/td>\n<td><code>7 / 2<\/code><\/td>\n<td><code>3.5<\/code><\/td>\n<\/tr>\n<tr>\n<td>División entera<\/td>\n<td><code>//<\/code><\/td>\n<td><code>7 // 2<\/code><\/td>\n<td><code>3<\/code><\/td>\n<\/tr>\n<tr>\n<td>Resto (módulo)<\/td>\n<td><code>%<\/code><\/td>\n<td><code>7 % 2<\/code><\/td>\n<td><code>1<\/code><\/td>\n<\/tr>\n<tr>\n<td>Potencia<\/td>\n<td><code>**<\/code><\/td>\n<td><code>7 ** 2<\/code><\/td>\n<td><code>49<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Orden de las operaciones<\/strong> (igual que en matemáticas): primero paréntesis, luego potencias, luego multiplicación y división, y al final suma y resta. Ante la duda, <strong>use paréntesis<\/strong>.<\/p>","web":true,"c":"print(7 + 2, 7 - 2, 7 * 2, 7 / 2)\nprint(7 // 2, 7 % 2, 7 ** 2)\nprint(2 + 3 * 4)      # primero la multiplicación\nprint((2 + 3) * 4)    # primero el paréntesis","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">7<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span> <span class=\"o\">-<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">2<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">7<\/span> <span class=\"o\">//<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span> <span class=\"o\">%<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">2<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">3<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">4<\/span><span class=\"p\">)<\/span>      <span class=\"c1\"># primero la multiplicación<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">((<\/span><span class=\"mi\">2<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">3<\/span><span class=\"p\">)<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">4<\/span><span class=\"p\">)<\/span>    <span class=\"c1\"># primero el paréntesis<\/span>\n","o":"9 5 14 3.5\n3 1 49\n14\n20\n","e":null,"img":[],"in":"","err":false},{"t":"Números con decimales","h":"<p>En Python el separador decimal es el <strong>punto<\/strong>, nunca la coma: <code>3.75<\/code>.<\/p>\n<ul>\n<li><code>round(valor, n)<\/code> redondea a <em>n<\/em> decimales.<\/li>\n<li>Las computadoras guardan los decimales en binario, por eso a veces aparecen resultados como <code>0.30000000000000004<\/code>. Es normal; se resuelve redondeando al mostrar.<\/li>\n<\/ul>","web":true,"c":"print(0.1 + 0.2)\nprint(round(0.1 + 0.2, 2))\nprint(round(3.14159, 3))\nprint(10 / 4)","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mf\">0.1<\/span> <span class=\"o\">+<\/span> <span class=\"mf\">0.2<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"mf\">0.1<\/span> <span class=\"o\">+<\/span> <span class=\"mf\">0.2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"mf\">3.14159<\/span><span class=\"p\">,<\/span> <span class=\"mi\">3<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">10<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span><span class=\"p\">)<\/span>\n","o":"0.30000000000000004\n0.3\n3.142\n2.5\n","e":null,"img":[],"in":"","err":false}],"ej":[{"id":"M01-E1","t":"Superficie de una parcela","n":1,"h":"<p>Una parcela mide 20 m por 50 m. Calcule su superficie en m² (<code>area_m2<\/code>) y en hectáreas (<code>area_ha<\/code>). Recuerde: 1 ha = 10 000 m².<\/p>","p":"area_m2 = 0\narea_ha = 0\nprint(area_m2, \"m2\")\nprint(area_ha, \"ha\")","pista":"<p><code>area_ha<\/code> se obtiene dividiendo <code>area_m2<\/code> entre 10000. Puede usar la variable ya calculada.<\/p>","s":"area_m2 = 20 * 50\narea_ha = area_m2 / 10000\nprint(area_m2, \"m2\")\nprint(area_ha, \"ha\")","sh":"<span class=\"n\">area_m2<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">20<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">50<\/span>\n<span class=\"n\">area_ha<\/span> <span class=\"o\">=<\/span> <span class=\"n\">area_m2<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">10000<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">area_m2<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"m2\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">area_ha<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"ha\"<\/span><span class=\"p\">)<\/span>\n","so":"1000 m2\n0.1 ha\n","test":"assert area_m2 == 1000, \"La superficie en m2 debe ser 1000.\"\nassert abs(area_ha - 0.1) < 1e-9, \"La superficie en ha debe ser 0.1.\"","web":true},{"id":"M01-E2","t":"Altura promedio","n":1,"h":"<p>Se midieron tres árboles: 12.5 m, 14.0 m y 13.6 m. Calcule la altura promedio en <code>promedio<\/code>.<\/p>","p":"promedio = 0\nprint(round(promedio, 2))","pista":"<p>Sume las tres alturas <strong>dentro de paréntesis<\/strong> y luego divida entre 3.<\/p>","s":"promedio = (12.5 + 14.0 + 13.6) / 3\nprint(round(promedio, 2))","sh":"<span class=\"n\">promedio<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span><span class=\"mf\">12.5<\/span> <span class=\"o\">+<\/span> <span class=\"mf\">14.0<\/span> <span class=\"o\">+<\/span> <span class=\"mf\">13.6<\/span><span class=\"p\">)<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">3<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">promedio<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n","so":"13.37\n","test":"assert abs(promedio - 13.3667) < 0.001, \"Revise los paréntesis: primero se suma y luego se divide.\"","web":true},{"id":"M01-E3","t":"Cajas de plantones","n":2,"h":"<p>Hay 1100 plantones y cada caja lleva 40. Calcule cuántas cajas se llenan completas (<code>cajas_llenas<\/code>) y cuántos plantones sobran (<code>sobrantes<\/code>).<\/p>","p":"cajas_llenas = 0\nsobrantes = 0\nprint(cajas_llenas, sobrantes)","pista":"<p>Use la división entera <code>//<\/code> para las cajas y el resto <code>%<\/code> para los sobrantes.<\/p>","s":"cajas_llenas = 1100 // 40\nsobrantes = 1100 % 40\nprint(cajas_llenas, sobrantes)","sh":"<span class=\"n\">cajas_llenas<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1100<\/span> <span class=\"o\">//<\/span> <span class=\"mi\">40<\/span>\n<span class=\"n\">sobrantes<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">1100<\/span> <span class=\"o\">%<\/span> <span class=\"mi\">40<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">cajas_llenas<\/span><span class=\"p\">,<\/span> <span class=\"n\">sobrantes<\/span><span class=\"p\">)<\/span>\n","so":"27 20\n","test":"assert cajas_llenas == 27, \"Las cajas llenas deben ser 27.\"\nassert sobrantes == 20, \"Deben sobrar 20 plantones.\"","web":true},{"id":"M01-E4","t":"De Celsius a Fahrenheit","n":2,"h":"<p>Convierta 15 °C a grados Fahrenheit con la fórmula F = C × 9/5 + 32. Guarde el resultado en <code>fahrenheit<\/code>.<\/p>","p":"celsius = 15\nfahrenheit = 0\nprint(fahrenheit)","pista":"<p>Escriba la fórmula usando la variable: <code>celsius * 9 / 5 + 32<\/code>.<\/p>","s":"celsius = 15\nfahrenheit = celsius * 9 / 5 + 32\nprint(fahrenheit)","sh":"<span class=\"n\">celsius<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">15<\/span>\n<span class=\"n\">fahrenheit<\/span> <span class=\"o\">=<\/span> <span class=\"n\">celsius<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">9<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">5<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">32<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">fahrenheit<\/span><span class=\"p\">)<\/span>\n","so":"59.0\n","test":"assert abs(fahrenheit - 59) < 1e-9, \"15 °C equivalen a 59 °F.\"","web":true}],"quiz":[{"q":"¿Cuál es el resultado de `7 / 2`?","o":["3","3.5","1","4"],"c":1,"x":"La división / siempre devuelve un número decimal: 3.5."},{"q":"¿Cuál es el resultado de `7 // 2`?","o":["3.5","1","3","4"],"c":2,"x":"// es la división entera: descarta la parte decimal."},{"q":"¿Cuál es el resultado de `2 + 3 * 4`?","o":["20","14","24","9"],"c":1,"x":"Primero se multiplica (3 × 4 = 12) y luego se suma 2."},{"q":"¿Qué hace el símbolo # en Python?","o":["Multiplica","Inicia un comentario","Define un número","Muestra un resultado"],"c":1,"x":"Todo lo que sigue a # en la línea es un comentario y Python lo ignora."}],"glos":[{"t":"Comentario","d":"Texto después de # que Python ignora; sirve para documentar."},{"t":"Operador","d":"Símbolo que realiza una operación, como +, -, * o /."},{"t":"Módulo (operador %)","d":"Resto de una división entera."}],"nb":"M01_primeros_pasos.ipynb"},{"id":"M02","n":2,"t":"Variables y tipos de datos","dur":"2 h","obj":["Crear variables y asignarles valores.","Nombrar variables correctamente.","Reconocer los tipos de datos básicos: int, float, str, bool y None.","Convertir valores de un tipo a otro."],"web":true,"lec":[{"t":"¿Qué es una variable?","h":"<p>Una <strong>variable<\/strong> es un <strong>nombre que guarda un valor<\/strong>, como una etiqueta pegada a una caja. Se crea con el signo <code>=<\/code>, que en Python significa <strong>\"guardar\"<\/strong> (asignar), no \"es igual a\".<\/p>\n<pre><code>nombre_de_la_variable = valor\n<\/code><\/pre>\n<p>Una variable puede cambiar de valor: el nuevo valor reemplaza al anterior.<\/p>","web":true,"c":"altura = 12.5          # guardo 12.5 en \"altura\"\nprint(altura)\naltura = 13.0          # reemplazo el valor\nprint(altura)\naltura_en_cm = altura * 100\nprint(altura_en_cm)","ch":"<span class=\"n\">altura<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">12.5<\/span>          <span class=\"c1\"># guardo 12.5 en \"altura\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">altura<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">altura<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">13.0<\/span>          <span class=\"c1\"># reemplazo el valor<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">altura<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">altura_en_cm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">altura<\/span> <span class=\"o\">*<\/span> <span class=\"mi\">100<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">altura_en_cm<\/span><span class=\"p\">)<\/span>\n","o":"12.5\n13.0\n1300.0\n","e":null,"img":[],"in":"","err":false},{"t":"Reglas para nombrar variables","h":"<table>\n<thead>\n<tr>\n<th>Regla<\/th>\n<th>Correcto<\/th>\n<th>Incorrecto<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td>Solo letras, números y guion bajo <code>_<\/code><\/td>\n<td><code>dap_cm<\/code><\/td>\n<td><code>dap-cm<\/code><\/td>\n<\/tr>\n<tr>\n<td>No puede empezar con número<\/td>\n<td><code>parcela1<\/code><\/td>\n<td><code>1parcela<\/code><\/td>\n<\/tr>\n<tr>\n<td>Sin espacios<\/td>\n<td><code>area_total<\/code><\/td>\n<td><code>area total<\/code><\/td>\n<\/tr>\n<tr>\n<td>Distingue mayúsculas<\/td>\n<td><code>Area<\/code> y <code>area<\/code> son distintas<\/td>\n<td>—<\/td>\n<\/tr>\n<tr>\n<td>No usar palabras reservadas<\/td>\n<td><code>clase_suelo<\/code><\/td>\n<td><code>class<\/code>, <code>if<\/code>, <code>for<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Convención en Python (snake_case):<\/strong> minúsculas y palabras separadas por guion bajo, con nombres que describan el contenido: <code>precipitacion_mm<\/code> es mejor que <code>p<\/code>. Evite tildes y la ñ en los nombres (son válidas, pero generan problemas al compartir código).<\/p>","web":true},{"t":"Tipos de datos básicos","h":"<p>Cada valor tiene un <strong>tipo<\/strong>. La función <code>type()<\/code> dice cuál es.<\/p>\n<table>\n<thead>\n<tr>\n<th>Tipo<\/th>\n<th>Nombre<\/th>\n<th>Ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>int<\/code><\/td>\n<td>Entero<\/td>\n<td><code>25<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>float<\/code><\/td>\n<td>Decimal<\/td>\n<td><code>12.5<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>str<\/code><\/td>\n<td>Texto (cadena)<\/td>\n<td><code>\"Algarrobo\"<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>bool<\/code><\/td>\n<td>Lógico (verdadero/falso)<\/td>\n<td><code>True<\/code>, <code>False<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>NoneType<\/code><\/td>\n<td>Ausencia de valor<\/td>\n<td><code>None<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><code>None<\/code> es útil para representar un dato <strong>por determinar<\/strong> (por ejemplo, una medición que aún no se hizo).<\/p>","web":true,"c":"especie = \"Prosopis pallida\"\nn_arboles = 25\ndap_cm = 32.5\nes_nativa = True\naltura_comercial = None   # dato por determinar\n\nprint(type(especie))\nprint(type(n_arboles))\nprint(type(dap_cm))\nprint(type(es_nativa))\nprint(type(altura_comercial))","ch":"<span class=\"n\">especie<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Prosopis pallida\"<\/span>\n<span class=\"n\">n_arboles<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">25<\/span>\n<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">32.5<\/span>\n<span class=\"n\">es_nativa<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">True<\/span>\n<span class=\"n\">altura_comercial<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">None<\/span>   <span class=\"c1\"># dato por determinar<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">n_arboles<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">es_nativa<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">altura_comercial<\/span><span class=\"p\">))<\/span>\n","o":"<class 'str'>\n<class 'int'>\n<class 'float'>\n<class 'bool'>\n<class 'NoneType'>\n","e":null,"img":[],"in":"","err":false},{"t":"Convertir entre tipos","h":"<p>Es frecuente recibir números <strong>como texto<\/strong> (por ejemplo, desde un formulario o archivo). Para operar con ellos hay que convertirlos:<\/p>\n<ul>\n<li><code>int(\"45\")<\/code> → <code>45<\/code> (entero)<\/li>\n<li><code>float(\"45.8\")<\/code> → <code>45.8<\/code> (decimal)<\/li>\n<li><code>str(45)<\/code> → <code>\"45\"<\/code> (texto)<\/li>\n<\/ul>\n<p>Observe la diferencia: <code>\"5\" + \"3\"<\/code> <strong>une textos<\/strong> (<code>\"53\"<\/code>), mientras que <code>5 + 3<\/code> <strong>suma<\/strong> (<code>8<\/code>). Sumar un texto con un número produce un <code>TypeError<\/code>.<\/p>","web":true,"c":"texto = \"45.8\"\nnumero = float(texto)\nprint(numero + 10)\n\nprint(\"5\" + \"3\")          # une textos\nprint(int(\"5\") + int(\"3\")) # suma números\nprint(\"Parcela \" + str(7)) # convierto el número a texto para unir","ch":"<span class=\"n\">texto<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"45.8\"<\/span>\n<span class=\"n\">numero<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">texto<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">numero<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">10<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"5\"<\/span> <span class=\"o\">+<\/span> <span class=\"s2\">\"3\"<\/span><span class=\"p\">)<\/span>          <span class=\"c1\"># une textos<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"5\"<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span> <span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"3\"<\/span><span class=\"p\">))<\/span> <span class=\"c1\"># suma números<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Parcela \"<\/span> <span class=\"o\">+<\/span> <span class=\"nb\">str<\/span><span class=\"p\">(<\/span><span class=\"mi\">7<\/span><span class=\"p\">))<\/span> <span class=\"c1\"># convierto el número a texto para unir<\/span>\n","o":"55.8\n53\n8\nParcela 7\n","e":null,"img":[],"in":"","err":false},{"t":"Atajos de asignación","h":"<ul>\n<li><code>x += 5<\/code> equivale a <code>x = x + 5<\/code> (también existen <code>-=<\/code>, <code>*=<\/code>, <code>/=<\/code>).<\/li>\n<li>Se pueden asignar varias variables en una línea: <code>a, b = 1, 2<\/code>.<\/li>\n<li>Intercambiar valores: <code>a, b = b, a<\/code>.<\/li>\n<\/ul>","web":true,"c":"contador = 0\ncontador += 10    # contador = contador + 10\ncontador -= 3\nprint(contador)\n\neste, norte = 545120, 9425300   # coordenadas de ejemplo\nprint(este, norte)","ch":"<span class=\"n\">contador<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>\n<span class=\"n\">contador<\/span> <span class=\"o\">+=<\/span> <span class=\"mi\">10<\/span>    <span class=\"c1\"># contador = contador + 10<\/span>\n<span class=\"n\">contador<\/span> <span class=\"o\">-=<\/span> <span class=\"mi\">3<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">contador<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">545120<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425300<\/span>   <span class=\"c1\"># coordenadas de ejemplo<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span><span class=\"p\">)<\/span>\n","o":"7\n545120 9425300\n","e":null,"img":[],"in":"","err":false}],"ej":[{"id":"M02-E1","t":"Ficha de un árbol","n":1,"h":"<p>Cree cuatro variables: <code>especie<\/code> con el texto <code>Algarrobo<\/code>, <code>dap_cm<\/code> con 32.5, <code>altura_m<\/code> con el entero 8 y <code>es_nativa<\/code> con True.<\/p>","p":"# Escriba sus variables aquí\n\nprint(especie, dap_cm, altura_m, es_nativa)","pista":"<p>Los textos van entre comillas; True se escribe con T mayúscula y sin comillas.<\/p>","s":"especie = \"Algarrobo\"\ndap_cm = 32.5\naltura_m = 8\nes_nativa = True\nprint(especie, dap_cm, altura_m, es_nativa)","sh":"<span class=\"n\">especie<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Algarrobo\"<\/span>\n<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">32.5<\/span>\n<span class=\"n\">altura_m<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">8<\/span>\n<span class=\"n\">es_nativa<\/span> <span class=\"o\">=<\/span> <span class=\"kc\">True<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">,<\/span> <span class=\"n\">altura_m<\/span><span class=\"p\">,<\/span> <span class=\"n\">es_nativa<\/span><span class=\"p\">)<\/span>\n","so":"Algarrobo 32.5 8 True\n","test":"assert especie == \"Algarrobo\", \"especie debe ser el texto 'Algarrobo'.\"\nassert dap_cm == 32.5 and isinstance(dap_cm, float), \"dap_cm debe ser el decimal 32.5.\"\nassert altura_m == 8 and isinstance(altura_m, int), \"altura_m debe ser el entero 8.\"\nassert es_nativa is True, \"es_nativa debe ser True (sin comillas).\"","web":true},{"id":"M02-E2","t":"Texto a número","n":1,"h":"<p>Un formulario entregó la precipitación como texto: <code>\"125.4\"<\/code>. Conviértala a decimal en <code>lluvia_mm<\/code> y súmele 10.6 en <code>lluvia_total<\/code>.<\/p>","p":"dato = \"125.4\"\nlluvia_mm = dato          # convierta aquí\nlluvia_total = 0\nprint(lluvia_total)","pista":"<p>Use <code>float(dato)<\/code>.<\/p>","s":"dato = \"125.4\"\nlluvia_mm = float(dato)\nlluvia_total = lluvia_mm + 10.6\nprint(lluvia_total)","sh":"<span class=\"n\">dato<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"125.4\"<\/span>\n<span class=\"n\">lluvia_mm<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">dato<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">lluvia_total<\/span> <span class=\"o\">=<\/span> <span class=\"n\">lluvia_mm<\/span> <span class=\"o\">+<\/span> <span class=\"mf\">10.6<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">lluvia_total<\/span><span class=\"p\">)<\/span>\n","so":"136.0\n","test":"assert isinstance(lluvia_mm, float), \"lluvia_mm debe ser un float.\"\nassert abs(lluvia_total - 136.0) < 1e-9, \"lluvia_total debe ser 136.0.\"","web":true},{"id":"M02-E3","t":"Contador de árboles","n":1,"h":"<p>Empiece con <code>arboles = 0<\/code>. Sume 15 (día 1), sume 23 (día 2) y reste 4 (árboles mal registrados) usando <code>+=<\/code> y <code>-=<\/code>.<\/p>","p":"arboles = 0\n# día 1\n\n# día 2\n\n# corrección\n\nprint(arboles)","pista":"<p><code>arboles += 15<\/code> suma 15 al valor actual.<\/p>","s":"arboles = 0\narboles += 15\narboles += 23\narboles -= 4\nprint(arboles)","sh":"<span class=\"n\">arboles<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>\n<span class=\"n\">arboles<\/span> <span class=\"o\">+=<\/span> <span class=\"mi\">15<\/span>\n<span class=\"n\">arboles<\/span> <span class=\"o\">+=<\/span> <span class=\"mi\">23<\/span>\n<span class=\"n\">arboles<\/span> <span class=\"o\">-=<\/span> <span class=\"mi\">4<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arboles<\/span><span class=\"p\">)<\/span>\n","so":"34\n","test":"assert arboles == 34, f\"Se esperaba 34 y se obtuvo {arboles}.\"","web":true},{"id":"M02-E4","t":"Intercambio de valores","n":2,"h":"<p>Por error se registró <code>este = 9425300<\/code> y <code>norte = 545120<\/code>. Intercambie los valores en una sola línea.<\/p>","p":"este = 9425300\nnorte = 545120\n# intercambie aquí\n\nprint(este, norte)","pista":"<p><code>a, b = b, a<\/code> intercambia dos variables.<\/p>","s":"este = 9425300\nnorte = 545120\neste, norte = norte, este\nprint(este, norte)","sh":"<span class=\"n\">este<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">9425300<\/span>\n<span class=\"n\">norte<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">545120<\/span>\n<span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span> <span class=\"o\">=<\/span> <span class=\"n\">norte<\/span><span class=\"p\">,<\/span> <span class=\"n\">este<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span><span class=\"p\">)<\/span>\n","so":"545120 9425300\n","test":"assert este == 545120 and norte == 9425300, \"Los valores no se intercambiaron.\"","web":true}],"quiz":[{"q":"¿Qué significa `x = 5` en Python?","o":["x es igual a 5 (comparación)","Guardar 5 en la variable x","Multiplicar x por 5","Error"],"c":1,"x":"El signo = asigna (guarda) un valor en una variable."},{"q":"¿Cuál es un nombre de variable válido?","o":["2area","area total","area_total","area-total"],"c":2,"x":"Solo letras, números y guion bajo, y no puede empezar con número."},{"q":"¿Qué tipo tiene el valor `\"12\"`?","o":["int","float","str","bool"],"c":2,"x":"Está entre comillas, por lo tanto es un texto (str)."},{"q":"¿Cuál es el resultado de `\"5\" + \"3\"`?","o":["8","\"53\"","Error","15"],"c":1,"x":"Con textos, + une (concatena) en lugar de sumar."}],"glos":[{"t":"Variable","d":"Nombre que guarda un valor en la memoria."},{"t":"Asignación","d":"Acción de guardar un valor en una variable con =."},{"t":"int / float","d":"Números enteros / números con decimales."},{"t":"str","d":"Cadena de texto, siempre entre comillas."},{"t":"bool","d":"Valor lógico: True o False."},{"t":"None","d":"Valor especial que indica ausencia de dato."}],"nb":"M02_variables_y_tipos.ipynb"},{"id":"M03","n":3,"t":"Comparaciones y lógica","dur":"1.5 h","obj":["Comparar valores y obtener resultados verdadero/falso.","Combinar condiciones con and, or y not.","Preparar la base para tomar decisiones (Módulo 5)."],"web":true,"lec":[{"t":"Operadores de comparación","h":"<p>Una comparación siempre responde <strong>True<\/strong> (verdadero) o <strong>False<\/strong> (falso).<\/p>\n<table>\n<thead>\n<tr>\n<th>Operador<\/th>\n<th>Significado<\/th>\n<th>Ejemplo<\/th>\n<th>Resultado<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>==<\/code><\/td>\n<td>igual a<\/td>\n<td><code>5 == 5<\/code><\/td>\n<td><code>True<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>!=<\/code><\/td>\n<td>distinto de<\/td>\n<td><code>5 != 3<\/code><\/td>\n<td><code>True<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>&gt;<\/code><\/td>\n<td>mayor que<\/td>\n<td><code>5 &gt; 8<\/code><\/td>\n<td><code>False<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>&lt;<\/code><\/td>\n<td>menor que<\/td>\n<td><code>5 &lt; 8<\/code><\/td>\n<td><code>True<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>&gt;=<\/code><\/td>\n<td>mayor o igual<\/td>\n<td><code>5 &gt;= 5<\/code><\/td>\n<td><code>True<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>&lt;=<\/code><\/td>\n<td>menor o igual<\/td>\n<td><code>4 &lt;= 3<\/code><\/td>\n<td><code>False<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><strong>Atención:<\/strong> <code>=<\/code> guarda un valor; <code>==<\/code> compara. Confundirlos es el error más común al empezar.<\/p>","web":true,"c":"dap_cm = 12.3\nprint(dap_cm >= 10)      # ¿el árbol supera el diámetro mínimo de 10 cm?\nprint(dap_cm == 12.3)\nprint(\"algarrobo\" == \"Algarrobo\")   # mayúsculas cuentan","ch":"<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">12.3<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">&gt;=<\/span> <span class=\"mi\">10<\/span><span class=\"p\">)<\/span>      <span class=\"c1\"># ¿el árbol supera el diámetro mínimo de 10 cm?<

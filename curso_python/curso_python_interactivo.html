1, 2, 2, 3})`?","o":["5","3","2","Error"],"c":1,"x":"Un conjunto elimina repetidos: {1, 2, 3}."}],"glos":[{"t":"Diccionario","d":"Colección de pares clave: valor; se accede por la clave."},{"t":"Clave","d":"Nombre único que identifica un valor en un diccionario."},{"t":"Conjunto (set)","d":"Colección sin orden y sin elementos repetidos."}],"nb":"M08_diccionarios_y_conjuntos.ipynb"},{"id":"M09","n":9,"t":"Funciones: cree sus propias herramientas","dur":"3 h","obj":["Definir funciones con def, parámetros y return.","Distinguir entre mostrar (print) y devolver (return) un resultado.","Usar parámetros con valores por defecto y documentar funciones.","Entender el alcance de las variables."],"web":true,"lec":[{"t":"¿Qué es una función?","h":"<p>Ya ha usado funciones: <code>print()<\/code>, <code>len()<\/code>, <code>round()<\/code>. Una función es un <strong>bloque de código con nombre<\/strong> que realiza una tarea y se puede <strong>reutilizar<\/strong> cuantas veces se necesite.<\/p>\n<pre><code>def nombre_funcion(parametro1, parametro2):\n    instrucciones\n    return resultado\n<\/code><\/pre>\n<ul>\n<li><code>def<\/code> define la función (no la ejecuta).<\/li>\n<li>La función se ejecuta al <strong>llamarla<\/strong>: <code>nombre_funcion(valor1, valor2)<\/code>.<\/li>\n<\/ul>","web":true,"c":"def saludar(nombre):\n    print(f\"Hola, {nombre}. Bienvenido al curso.\")\n\nsaludar(\"Ana\")\nsaludar(\"Luis\")","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">saludar<\/span><span class=\"p\">(<\/span><span class=\"n\">nombre<\/span><span class=\"p\">):<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Hola, <\/span><span class=\"si\">{<\/span><span class=\"n\">nombre<\/span><span class=\"si\">}<\/span><span class=\"s2\">. Bienvenido al curso.\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">saludar<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Ana\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">saludar<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Luis\"<\/span><span class=\"p\">)<\/span>\n","o":"Hola, Ana. Bienvenido al curso.\nHola, Luis. Bienvenido al curso.\n","e":null,"img":[],"in":"","err":false},{"t":"Devolver resultados con return","h":"<p><code>return<\/code> <strong>entrega<\/strong> un valor a quien llamó la función, para guardarlo o seguir operando con él. <code>print<\/code> solo lo <strong>muestra<\/strong>.<\/p>\n<p>Regla práctica: las funciones de cálculo deben usar <code>return<\/code>, no <code>print<\/code>.<\/p>","web":true,"c":"def area_basal(dap_cm):\n    \"\"\"Área basal (m²) a partir del DAP en cm: AB = π/4 × DAP².\"\"\"\n    pi = 3.141592653589793\n    dap_m = dap_cm / 100\n    return pi / 4 * dap_m ** 2\n\nab = area_basal(30)\nprint(round(ab, 4), \"m2\")\n\ntotal = area_basal(30) + area_basal(25) + area_basal(40)\nprint(\"AB total:\", round(total, 4), \"m2\")","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Área basal (m²) a partir del DAP en cm: AB = π/4 × DAP².\"\"\"<\/span>\n    <span class=\"n\">pi<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">3.141592653589793<\/span>\n    <span class=\"n\">dap_m<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">pi<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"n\">dap_m<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>\n\n<span class=\"n\">ab<\/span> <span class=\"o\">=<\/span> <span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">ab<\/span><span class=\"p\">,<\/span> <span class=\"mi\">4<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"m2\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">total<\/span> <span class=\"o\">=<\/span> <span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span> <span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"mi\">25<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span> <span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"mi\">40<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AB total:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">total<\/span><span class=\"p\">,<\/span> <span class=\"mi\">4<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"m2\"<\/span><span class=\"p\">)<\/span>\n","o":"0.0707 m2\nAB total: 0.2454 m2\n","e":null,"img":[],"in":"","err":false},{"t":"Parámetros por defecto y argumentos con nombre","h":"<p>Un parámetro puede tener un <strong>valor por defecto<\/strong>: si no se entrega, se usa ese. Al llamar, puede indicar los argumentos <strong>por nombre<\/strong>, lo que hace el código más claro.<\/p>\n<p>Una función también puede devolver <strong>varios valores<\/strong> (como tupla).<\/p>","web":true,"c":"def volumen(dap_cm, altura_m, ff=0.5):\n    \"\"\"Volumen (m³) = AB × altura × factor de forma (ff).\n    ff = 0.5 es un valor supuesto para este ejemplo.\"\"\"\n    ab = 3.141592653589793 / 4 * (dap_cm / 100) ** 2\n    return ab * altura_m * ff\n\nprint(round(volumen(30, 12), 4))\nprint(round(volumen(30, 12, ff=0.6), 4))\nprint(round(volumen(altura_m=12, dap_cm=30), 4))\n\ndef min_max(datos):\n    return min(datos), max(datos)\n\nmenor, mayor = min_max([4, 9, 2, 7])\nprint(menor, mayor)","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">volumen<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">,<\/span> <span class=\"n\">altura_m<\/span><span class=\"p\">,<\/span> <span class=\"n\">ff<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.5<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Volumen (m³) = AB × altura × factor de forma (ff).<\/span>\n<span class=\"sd\">    ff = 0.5 es un valor supuesto para este ejemplo.\"\"\"<\/span>\n    <span class=\"n\">ab<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">3.141592653589793<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">ab<\/span> <span class=\"o\">*<\/span> <span class=\"n\">altura_m<\/span> <span class=\"o\">*<\/span> <span class=\"n\">ff<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">volumen<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">12<\/span><span class=\"p\">),<\/span> <span class=\"mi\">4<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">volumen<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">12<\/span><span class=\"p\">,<\/span> <span class=\"n\">ff<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.6<\/span><span class=\"p\">),<\/span> <span class=\"mi\">4<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">volumen<\/span><span class=\"p\">(<\/span><span class=\"n\">altura_m<\/span><span class=\"o\">=<\/span><span class=\"mi\">12<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"o\">=<\/span><span class=\"mi\">30<\/span><span class=\"p\">),<\/span> <span class=\"mi\">4<\/span><span class=\"p\">))<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">min_max<\/span><span class=\"p\">(<\/span><span class=\"n\">datos<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"nb\">min<\/span><span class=\"p\">(<\/span><span class=\"n\">datos<\/span><span class=\"p\">),<\/span> <span class=\"nb\">max<\/span><span class=\"p\">(<\/span><span class=\"n\">datos<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">menor<\/span><span class=\"p\">,<\/span> <span class=\"n\">mayor<\/span> <span class=\"o\">=<\/span> <span class=\"n\">min_max<\/span><span class=\"p\">([<\/span><span class=\"mi\">4<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">,<\/span> <span class=\"mi\">7<\/span><span class=\"p\">])<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">menor<\/span><span class=\"p\">,<\/span> <span class=\"n\">mayor<\/span><span class=\"p\">)<\/span>\n","o":"0.4241\n0.5089\n0.4241\n2 9\n","e":null,"img":[],"in":"","err":false},{"t":"Documentar: docstrings","h":"<p>El texto entre comillas triples justo debajo de <code>def<\/code> es el <strong>docstring<\/strong>: explica qué hace la función, qué recibe y qué devuelve. <code>help(funcion)<\/code> lo muestra.<\/p>\n<p>Buenas prácticas: nombres de funciones con verbos o sustantivos claros (<code>calcular_volumen<\/code>), una sola tarea por función y funciones cortas.<\/p>","web":true},{"t":"Alcance de las variables","h":"<p>Las variables creadas <strong>dentro<\/strong> de una función son <strong>locales<\/strong>: solo existen mientras la función se ejecuta. Para sacar un valor de la función, use <code>return<\/code>.<\/p>","web":true,"c":"def calcular():\n    resultado_local = 42\n    return resultado_local\n\nvalor = calcular()\nprint(valor)\n# print(resultado_local)  # daría NameError: no existe fuera de la función","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">calcular<\/span><span class=\"p\">():<\/span>\n    <span class=\"n\">resultado_local<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">42<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">resultado_local<\/span>\n\n<span class=\"n\">valor<\/span> <span class=\"o\">=<\/span> <span class=\"n\">calcular<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">valor<\/span><span class=\"p\">)<\/span>\n<span class=\"c1\"># print(resultado_local)  # daría NameError: no existe fuera de la función<\/span>\n","o":"42\n","e":null,"img":[],"in":"","err":false},{"t":"Funciones como herramienta de orden: key y lambda","h":"<p>Algunas funciones reciben <strong>otra función<\/strong> como argumento. Por ejemplo, <code>sorted(lista, key=...)<\/code> ordena según lo que devuelva esa función.<\/p>\n<p><code>lambda<\/code> crea una función pequeña de una sola línea, sin nombre: <code>lambda x: x[\"dap\"]<\/code>.<\/p>","web":true,"c":"arboles = [\n    {\"id\": \"A1\", \"dap\": 32.5},\n    {\"id\": \"A2\", \"dap\": 18.0},\n    {\"id\": \"A3\", \"dap\": 45.2},\n]\nordenados = sorted(arboles, key=lambda a: a[\"dap\"], reverse=True)\nfor a in ordenados:\n    print(a[\"id\"], a[\"dap\"])","ch":"<span class=\"n\">arboles<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"A1\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"dap\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">32.5<\/span><span class=\"p\">},<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"A2\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"dap\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">18.0<\/span><span class=\"p\">},<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"A3\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"dap\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">45.2<\/span><span class=\"p\">},<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">ordenados<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">sorted<\/span><span class=\"p\">(<\/span><span class=\"n\">arboles<\/span><span class=\"p\">,<\/span> <span class=\"n\">key<\/span><span class=\"o\">=<\/span><span class=\"k\">lambda<\/span> <span class=\"n\">a<\/span><span class=\"p\">:<\/span> <span class=\"n\">a<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"dap\"<\/span><span class=\"p\">],<\/span> <span class=\"n\">reverse<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">a<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">ordenados<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">],<\/span> <span class=\"n\">a<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"dap\"<\/span><span class=\"p\">])<\/span>\n","o":"A3 45.2\nA1 32.5\nA2 18.0\n","e":null,"img":[],"in":"","err":false}],"ej":[{"id":"M09-E1","t":"Metros cuadrados a hectáreas","n":1,"h":"<p>Complete la función <code>a_hectareas(m2)<\/code> para que <strong>devuelva<\/strong> el área en hectáreas.<\/p>","p":"def a_hectareas(m2):\n    # complete aquí\n    pass\n\nprint(a_hectareas(25000))","pista":"<p>Reemplace <code>pass<\/code> por <code>return m2 / 10000<\/code>.<\/p>","s":"def a_hectareas(m2):\n    return m2 / 10000\n\nprint(a_hectareas(25000))","sh":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">a_hectareas<\/span><span class=\"p\">(<\/span><span class=\"n\">m2<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">m2<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">10000<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a_hectareas<\/span><span class=\"p\">(<\/span><span class=\"mi\">25000<\/span><span class=\"p\">))<\/span>\n","so":"2.5\n","test":"assert a_hectareas(25000) == 2.5, \"25 000 m2 = 2.5 ha\"\nassert a_hectareas(0) == 0, \"0 m2 = 0 ha\"","web":true},{"id":"M09-E2","t":"Área basal","n":1,"h":"<p>Complete <code>area_basal(dap_cm)<\/code> para que devuelva el área basal en m²: AB = π/4 × (DAP en m)².<\/p>","p":"PI = 3.141592653589793\n\ndef area_basal(dap_cm):\n    # complete aquí\n    pass\n\nprint(area_basal(30))","pista":"<p>Primero convierta a metros: <code>dap_m = dap_cm / 100<\/code>. Luego <code>return PI / 4 * dap_m ** 2<\/code>.<\/p>","s":"PI = 3.141592653589793\n\ndef area_basal(dap_cm):\n    dap_m = dap_cm / 100\n    return PI / 4 * dap_m ** 2\n\nprint(area_basal(30))","sh":"<span class=\"n\">PI<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">3.141592653589793<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">dap_m<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">PI<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"n\">dap_m<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">))<\/span>\n","so":"0.07068583470577035\n","test":"assert abs(area_basal(30) - 0.0706858) < 1e-6, \"Para DAP 30 cm, AB ≈ 0.0707 m2.\"\nassert abs(area_basal(100) - 0.7853982) < 1e-6, \"Para DAP 100 cm, AB ≈ 0.7854 m2.\"","web":true},{"id":"M09-E3","t":"Clasificador reutilizable","n":2,"h":"<p>Escriba <code>clasificar_pendiente(p)<\/code> que devuelva <code>Suave<\/code> (&lt; 15), <code>Moderada<\/code> (&lt; 30), <code>Fuerte<\/code> (&lt; 50) o <code>Muy fuerte<\/code>.<\/p>","p":"def clasificar_pendiente(p):\n    # complete aquí\n    pass\n\nfor p in [5, 15, 29.9, 50]:\n    print(p, clasificar_pendiente(p))","pista":"<p>Use if/elif/else y un <code>return<\/code> en cada rama.<\/p>","s":"def clasificar_pendiente(p):\n    if p < 15:\n        return \"Suave\"\n    elif p < 30:\n        return \"Moderada\"\n    elif p < 50:\n        return \"Fuerte\"\n    else:\n        return \"Muy fuerte\"\n\nfor p in [5, 15, 29.9, 50]:\n    print(p, clasificar_pendiente(p))","sh":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">clasificar_pendiente<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">p<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">15<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"Suave\"<\/span>\n    <span class=\"k\">elif<\/span> <span class=\"n\">p<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">30<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"Moderada\"<\/span>\n    <span class=\"k\">elif<\/span> <span class=\"n\">p<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">50<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"Fuerte\"<\/span>\n    <span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"s2\">\"Muy fuerte\"<\/span>\n\n<span class=\"k\">for<\/span> <span class=\"n\">p<\/span> <span class=\"ow\">in<\/span> <span class=\"p\">[<\/span><span class=\"mi\">5<\/span><span class=\"p\">,<\/span> <span class=\"mi\">15<\/span><span class=\"p\">,<\/span> <span class=\"mf\">29.9<\/span><span class=\"p\">,<\/span> <span class=\"mi\">50<\/span><span class=\"p\">]:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">,<\/span> <span class=\"n\">clasificar_pendiente<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">))<\/span>\n","so":"5 Suave\n15 Moderada\n29.9 Moderada\n50 Muy fuerte\n","test":"casos = {5: \"Suave\", 15: \"Moderada\", 29.9: \"Moderada\", 30: \"Fuerte\", 50: \"Muy fuerte\", 80: \"Muy fuerte\"}\nfor valor, esperado in casos.items():\n    obtenido = clasificar_pendiente(valor)\n    assert obtenido == esperado, f\"Para {valor} se esperaba '{esperado}' y se obtuvo '{obtenido}'.\"","web":true},{"id":"M09-E4","t":"Volumen con valor por defecto","n":3,"h":"<p>Escriba <code>volumen(dap_cm, altura_m, ff=0.5)<\/code> que devuelva AB × altura × ff, reutilizando <code>area_basal<\/code>.<\/p>","p":"PI = 3.141592653589793\n\ndef area_basal(dap_cm):\n    return PI / 4 * (dap_cm / 100) ** 2\n\ndef volumen(dap_cm, altura_m, ff=0.5):\n    # complete aquí\n    pass\n\nprint(round(volumen(30, 12), 4))","pista":"<p>Dentro de <code>volumen<\/code> llame a <code>area_basal(dap_cm)<\/code> y multiplique.<\/p>","s":"PI = 3.141592653589793\n\ndef area_basal(dap_cm):\n    return PI / 4 * (dap_cm / 100) ** 2\n\ndef volumen(dap_cm, altura_m, ff=0.5):\n    return area_basal(dap_cm) * altura_m * ff\n\nprint(round(volumen(30, 12), 4))","sh":"<span class=\"n\">PI<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">3.141592653589793<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">PI<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">volumen<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">,<\/span> <span class=\"n\">altura_m<\/span><span class=\"p\">,<\/span> <span class=\"n\">ff<\/span><span class=\"o\">=<\/span><span class=\"mf\">0.5<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">)<\/span> <span class=\"o\">*<\/span> <span class=\"n\">altura_m<\/span> <span class=\"o\">*<\/span> <span class=\"n\">ff<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">volumen<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">12<\/span><span class=\"p\">),<\/span> <span class=\"mi\">4<\/span><span class=\"p\">))<\/span>\n","so":"0.4241\n","test":"assert abs(volumen(30, 12) - 0.4241150) < 1e-6, \"Con ff por defecto (0.5) se esperaba ≈ 0.4241.\"\nassert abs(volumen(30, 12, ff=0.7) - 0.5937610) < 1e-6, \"Con ff = 0.7 se esperaba ≈ 0.5938.\"","web":true}],"quiz":[{"q":"¿Qué palabra se usa para definir una función?","o":["function","def","func","define"],"c":1,"x":"Las funciones se definen con def."},{"q":"¿Qué diferencia hay entre print y return?","o":["Ninguna","print muestra; return entrega el valor para seguir usándolo","return muestra en pantalla","print es más rápido"],"c":1,"x":"return devuelve el valor a quien llamó la función."},{"q":"Con `def f(a, b=2): return a * b`, ¿qué devuelve `f(5)`?","o":["5","7","10","Error"],"c":2,"x":"b toma su valor por defecto, 2: 5 × 2 = 10."},{"q":"¿Qué devuelve una función que no tiene return?","o":["0","None","Error","\"\""],"c":1,"x":"Sin return, la función devuelve None."}],"glos":[{"t":"def","d":"Palabra clave para definir una función."},{"t":"Parámetro / argumento","d":"Parámetro: nombre en la definición. Argumento: valor entregado al llamar."},{"t":"return","d":"Instrucción que devuelve un valor y termina la función."},{"t":"Docstring","d":"Texto de documentación al inicio de una función."},{"t":"lambda","d":"Función anónima de una sola expresión."},{"t":"Alcance (scope)","d":"Zona del programa donde una variable existe."}],"nb":"M09_funciones.ipynb"},{"id":"M10","n":10,"t":"Errores, excepciones y módulos","dur":"2.5 h","obj":["Reconocer los errores más frecuentes y su causa.","Controlar errores con try / except para que el programa no se detenga.","Importar y usar módulos de la biblioteca estándar.","Saber cómo instalar paquetes externos."],"web":true,"lec":[{"t":"Errores frecuentes","h":"<table>\n<thead>\n<tr>\n<th>Error<\/th>\n<th>Causa típica<\/th>\n<th>Ejemplo<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>SyntaxError<\/code><\/td>\n<td>Código mal escrito<\/td>\n<td>falta <code>:<\/code> o una comilla<\/td>\n<\/tr>\n<tr>\n<td><code>IndentationError<\/code><\/td>\n<td>Sangría incorrecta<\/td>\n<td>bloque sin espacios<\/td>\n<\/tr>\n<tr>\n<td><code>NameError<\/code><\/td>\n<td>Variable o función inexistente<\/td>\n<td><code>prin(\"x\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>TypeError<\/code><\/td>\n<td>Operación entre tipos incompatibles<\/td>\n<td><code>\"5\" + 3<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ValueError<\/code><\/td>\n<td>Valor inválido para la conversión<\/td>\n<td><code>int(\"abc\")<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>ZeroDivisionError<\/code><\/td>\n<td>División entre cero<\/td>\n<td><code>10 / 0<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>IndexError<\/code><\/td>\n<td>Índice fuera de la lista<\/td>\n<td><code>[1, 2][5]<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>KeyError<\/code><\/td>\n<td>Clave inexistente en diccionario<\/td>\n<td><code>d[\"x\"]<\/code><\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Ejecute el ejemplo y observe el tipo de error en la última línea.<\/p>","web":true,"c":"datos = [10, 20, 30]\nprint(datos[5])","ch":"<span class=\"n\">datos<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mi\">10<\/span><span class=\"p\">,<\/span> <span class=\"mi\">20<\/span><span class=\"p\">,<\/span> <span class=\"mi\">30<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">datos<\/span><span class=\"p\">[<\/span><span class=\"mi\">5<\/span><span class=\"p\">])<\/span>\n","o":"","e":"Traceback (most recent call last):\n  File \"<celda>\", line 2, in <module>\n    print(datos[5])\n          ~~~~~^^^\nIndexError: list index out of range","img":[],"in":"","err":true},{"t":"Capturar errores con try / except","h":"<p>Cuando un error es <strong>previsible<\/strong> (por ejemplo, datos de campo mal digitados), se puede <strong>capturar<\/strong> para que el programa continúe:<\/p>\n<pre><code>try:\n    código que podría fallar\nexcept TipoDeError:\n    qué hacer si falla\n<\/code><\/pre>\n<p>Capture siempre errores <strong>específicos<\/strong> (<code>ValueError<\/code>, <code>ZeroDivisionError<\/code>…), no todos a ciegas.<\/p>","web":true,"c":"valores = [\"12.5\", \"8,3\", \"abc\", \"15\"]\nlimpios = []\nfor v in valores:\n    try:\n        limpios.append(float(v))\n    except ValueError:\n        print(f\"Valor no numérico, por verificar: {v!r}\")\nprint(limpios)","ch":"<span class=\"n\">valores<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"12.5\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"8,3\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"abc\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"15\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">limpios<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">v<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">valores<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">try<\/span><span class=\"p\">:<\/span>\n        <span class=\"n\">limpios<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">v<\/span><span class=\"p\">))<\/span>\n    <span class=\"k\">except<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">:<\/span>\n        <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Valor no numérico, por verificar: <\/span><span class=\"si\">{<\/span><span class=\"n\">v<\/span><span class=\"si\">!r}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">limpios<\/span><span class=\"p\">)<\/span>\n","o":"Valor no numérico, por verificar: '8,3'\nValor no numérico, por verificar: 'abc'\n[12.5, 15.0]\n","e":null,"img":[],"in":"","err":false},{"t":"else, finally y raise","h":"<ul>\n<li><code>else<\/code>: se ejecuta si <strong>no<\/strong> hubo error.<\/li>\n<li><code>finally<\/code>: se ejecuta <strong>siempre<\/strong> (útil para cerrar recursos).<\/li>\n<li><code>raise<\/code>: <strong>provoca<\/strong> un error a propósito, por ejemplo para rechazar datos imposibles.<\/li>\n<\/ul>","web":true,"c":"def validar_dap(dap_cm):\n    if dap_cm <= 0:\n        raise ValueError(f\"DAP inválido: {dap_cm}\")\n    return dap_cm\n\nfor dato in [25, -3]:\n    try:\n        validar_dap(dato)\n    except ValueError as e:\n        print(\"Error:\", e)\n    else:\n        print(\"Dato correcto:\", dato)\n    finally:\n        print(\"-- revisión terminada --\")","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">validar_dap<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">if<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"mi\">0<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">raise<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"DAP inválido: <\/span><span class=\"si\">{<\/span><span class=\"n\">dap_cm<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">dap_cm<\/span>\n\n<span class=\"k\">for<\/span> <span class=\"n\">dato<\/span> <span class=\"ow\">in<\/span> <span class=\"p\">[<\/span><span class=\"mi\">25<\/span><span class=\"p\">,<\/span> <span class=\"o\">-<\/span><span class=\"mi\">3<\/span><span class=\"p\">]:<\/span>\n    <span class=\"k\">try<\/span><span class=\"p\">:<\/span>\n        <span class=\"n\">validar_dap<\/span><span class=\"p\">(<\/span><span class=\"n\">dato<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">except<\/span> <span class=\"ne\">ValueError<\/span> <span class=\"k\">as<\/span> <span class=\"n\">e<\/span><span class=\"p\">:<\/span>\n        <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Error:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">e<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n        <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Dato correcto:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">dato<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">finally<\/span><span class=\"p\">:<\/span>\n        <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"-- revisión terminada --\"<\/span><span class=\"p\">)<\/span>\n","o":"Dato correcto: 25\n-- revisión terminada --\nError: DAP inválido: -3\n-- revisión terminada --\n","e":null,"img":[],"in":"","err":false},{"t":"Módulos de la biblioteca estándar","h":"<p>Un <strong>módulo<\/strong> es un archivo con funciones listas para usar. Python incluye muchos (la <em>biblioteca estándar<\/em>):<\/p>\n<table>\n<thead>\n<tr>\n<th>Módulo<\/th>\n<th>Para qué<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>math<\/code><\/td>\n<td>funciones matemáticas (<code>pi<\/code>, <code>sqrt<\/code>, <code>log<\/code>)<\/td>\n<\/tr>\n<tr>\n<td><code>statistics<\/code><\/td>\n<td>media, mediana, desviación estándar<\/td>\n<\/tr>\n<tr>\n<td><code>random<\/code><\/td>\n<td>números aleatorios, muestreo<\/td>\n<\/tr>\n<tr>\n<td><code>datetime<\/code><\/td>\n<td>fechas y horas<\/td>\n<\/tr>\n<tr>\n<td><code>csv<\/code>, <code>json<\/code><\/td>\n<td>leer y escribir datos (Módulo 11)<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Formas de importar: <code>import math<\/code>, <code>import statistics as st<\/code>, <code>from math import pi, sqrt<\/code>.<\/p>","web":true,"c":"import math\nimport statistics as st\nfrom datetime import date\n\nprint(math.pi, math.sqrt(16))\nalturas = [12.5, 9.8, 15.1, 11.0, 13.6]\nprint(\"Media:\", st.mean(alturas))\nprint(\"Mediana:\", st.median(alturas))\nprint(\"Desv. estándar:\", round(st.stdev(alturas), 3))\n\ninicio = date(2026, 1, 15)\nfin = date(2026, 3, 1)\nprint(\"Días transcurridos:\", (fin - inicio).days)","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">math<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">statistics<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">st<\/span>\n<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">datetime<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">date<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">math<\/span><span class=\"o\">.<\/span><span class=\"n\">pi<\/span><span class=\"p\">,<\/span> <span class=\"n\">math<\/span><span class=\"o\">.<\/span><span class=\"n\">sqrt<\/span><span class=\"p\">(<\/span><span class=\"mi\">16<\/span><span class=\"p\">))<\/span>\n<span class=\"n\">alturas<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mf\">12.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">9.8<\/span><span class=\"p\">,<\/span> <span class=\"mf\">15.1<\/span><span class=\"p\">,<\/span> <span class=\"mf\">11.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">13.6<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Media:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">st<\/span><span class=\"o\">.<\/span><span class=\"n\">mean<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Mediana:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">st<\/span><span class=\"o\">.<\/span><span class=\"n\">median<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Desv. estándar:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">st<\/span><span class=\"o\">.<\/span><span class=\"n\">stdev<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">),<\/span> <span class=\"mi\">3<\/span><span class=\"p\">))<\/span>\n\n<span class=\"n\">inicio<\/span> <span class=\"o\">=<\/span> <span class=\"n\">date<\/span><span class=\"p\">(<\/span><span class=\"mi\">2026<\/span><span class=\"p\">,<\/span> <span class=\"mi\">1<\/span><span class=\"p\">,<\/span> <span class=\"mi\">15<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">fin<\/span> <span class=\"o\">=<\/span> <span class=\"n\">date<\/span><span class=\"p\">(<\/span><span class=\"mi\">2026<\/span><span class=\"p\">,<\/span> <span class=\"mi\">3<\/span><span class=\"p\">,<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Días transcurridos:\"<\/span><span class=\"p\">,<\/span> <span class=\"p\">(<\/span><span class=\"n\">fin<\/span> <span class=\"o\">-<\/span> <span class=\"n\">inicio<\/span><span class=\"p\">)<\/span><span class=\"o\">.<\/span><span class=\"n\">days<\/span><span class=\"p\">)<\/span>\n","o":"3.141592653589793 4.0\nMedia: 12.4\nMediana: 12.5\nDesv. estándar: 2.089\nDías transcurridos: 45\n","e":null,"img":[],"in":"","err":false},{"t":"Instalar paquetes externos","h":"<p>Los paquetes que no vienen con Python (pandas, openpyxl, pyproj, geopandas…) se instalan <strong>una sola vez<\/strong> desde la terminal:<\/p>\n<ul>\n<li>Con Anaconda (recomendado): abra <em>Anaconda Prompt<\/em> y escriba <code>conda install pandas openpyxl pyproj<\/code><\/li>\n<li>Con pip: <code>pip install pandas openpyxl pyproj<\/code><\/li>\n<li>Dentro de Jupyter o Colab: <code>%pip install pyproj<\/code> en una celda.<\/li>\n<\/ul>\n<p>Luego se importan como cualquier módulo: <code>import pandas as pd<\/code>.<\/p>\n<p>También puede crear <strong>sus propios módulos<\/strong>: guarde funciones en un archivo, por ejemplo <code>forestal.py<\/code>, y en otro archivo de la misma carpeta escriba <code>from forestal import area_basal<\/code>.<\/p>","web":true}],"ej":[{"id":"M10-E1","t":"Conversión segura","n":1,"h":"<p>Complete <code>a_numero(texto)<\/code>: devuelve el número decimal o <code>None<\/code> si el texto no es numérico.<\/p>","p":"def a_numero(texto):\n    # use try / except\n    pass\n\nprint(a_numero(\"12.5\"), a_numero(\"abc\"))","pista":"<p>Dentro de <code>try<\/code> haga <code>return float(texto)<\/code>; en <code>except ValueError<\/code> haga <code>return None<\/code>.<\/p>","s":"def a_numero(texto):\n    try:\n        return float(texto)\n    except ValueError:\n        return None\n\nprint(a_numero(\"12.5\"), a_numero(\"abc\"))","sh":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">a_numero<\/span><span class=\"p\">(<\/span><span class=\"n\">texto<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">try<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">texto<\/span><span class=\"p\">)<\/span>\n    <span class=\"k\">except<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"kc\">None<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a_numero<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"12.5\"<\/span><span class=\"p\">),<\/span> <span class=\"n\">a_numero<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"abc\"<\/span><span class=\"p\">))<\/span>\n","so":"12.5 None\n","test":"assert a_numero(\"12.5\") == 12.5, \"'12.5' debe convertirse en 12.5\"\nassert a_numero(\"abc\") is None, \"'abc' debe devolver None\"\nassert a_numero(\"7\") == 7.0, \"'7' debe convertirse en 7.0\"","web":true},{"id":"M10-E2","t":"División segura","n":1,"h":"<p>Complete <code>densidad(arboles, area_ha)<\/code>: devuelve árboles por hectárea, o <code>None<\/code> si el área es 0.<\/p>","p":"def densidad(arboles, area_ha):\n    pass\n\nprint(densidad(450, 0.5), densidad(10, 0))","pista":"<p>Capture <code>ZeroDivisionError<\/code>.<\/p>","s":"def densidad(arboles, area_ha):\n    try:\n        return arboles / area_ha\n    except ZeroDivisionError:\n        return None\n\nprint(densidad(450, 0.5), densidad(10, 0))","sh":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">densidad<\/span><span class=\"p\">(<\/span><span class=\"n\">arboles<\/span><span class=\"p\">,<\/span> <span class=\"n\">area_ha<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">try<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"n\">arboles<\/span> <span class=\"o\">/<\/span> <span class=\"n\">area_ha<\/span>\n    <span class=\"k\">except<\/span> <span class=\"ne\">ZeroDivisionError<\/span><span class=\"p\">:<\/span>\n        <span class=\"k\">return<\/span> <span class=\"kc\">None<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">densidad<\/span><span class=\"p\">(<\/span><span class=\"mi\">450<\/span><span class=\"p\">,<\/span> <span class=\"mf\">0.5<\/span><span class=\"p\">),<\/span> <span class=\"n\">densidad<\/span><span class=\"p\">(<\/span><span class=\"mi\">10<\/span><span class=\"p\">,<\/span> <span class=\"mi\">0<\/span><span class=\"p\">))<\/span>\n","so":"900.0 None\n","test":"assert densidad(450, 0.5) == 900, \"450 árboles en 0.5 ha = 900 árb/ha\"\nassert densidad(10, 0) is None, \"Con área 0 debe devolver None\"","web":true},{"id":"M10-E3","t":"DAP a partir de la circunferencia","n":2,"h":"<p>En campo se mide la circunferencia a la altura del pecho (CAP). Complete <code>dap_desde_cap(cap_cm)<\/code> = CAP / π usando <code>math.pi<\/code>.<\/p>","p":"import math\n\ndef dap_desde_cap(cap_cm):\n    pass\n\nprint(round(dap_desde_cap(100), 2))","pista":"<p><code>return cap_cm / math.pi<\/code><\/p>","s":"import math\n\ndef dap_desde_cap(cap_cm):\n    return cap_cm / math.pi\n\nprint(round(dap_desde_cap(100), 2))","sh":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">math<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">dap_desde_cap<\/span><span class=\"p\">(<\/span><span class=\"n\">cap_cm<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">cap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"n\">math<\/span><span class=\"o\">.<\/span><span class=\"n\">pi<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_desde_cap<\/span><span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">),<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n","so":"31.83\n","test":"import math\nassert abs(dap_desde_cap(100) - 31.8310) < 1e-3, \"CAP 100 cm → DAP ≈ 31.83 cm\"\nassert abs(dap_desde_cap(math.pi * 20) - 20) < 1e-9, \"CAP de un DAP de 20 cm debe dar 20\"","web":true},{"id":"M10-E4","t":"Estadística rápida","n":2,"h":"<p>Con el módulo <code>statistics<\/code>, guarde en <code>mediana<\/code> la mediana y en <code>media<\/code> el promedio de las lluvias.<\/p>","p":"import statistics\n\nlluvias = [0, 2.5, 12.0, 45.8, 3.1, 0, 22.4]\nmediana = None\nmedia = None\nprint(mediana, round(media, 2) if media is not None else media)","pista":"<p><code>statistics.median(lluvias)<\/code> y <code>statistics.mean(lluvias)<\/code>.<\/p>","s":"import statistics\n\nlluvias = [0, 2.5, 12.0, 45.8, 3.1, 0, 22.4]\nmediana = statistics.median(lluvias)\nmedia = statistics.mean(lluvias)\nprint(mediana, round(media, 2))","sh":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">statistics<\/span>\n\n<span class=\"n\">lluvias<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">2.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">12.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">45.8<\/span><span class=\"p\">,<\/span> <span class=\"mf\">3.1<\/span><span class=\"p\">,<\/span> <span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">22.4<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">mediana<\/span> <span class=\"o\">=<\/span> <span class=\"n\">statistics<\/span><span class=\"o\">.<\/span><span class=\"n\">median<\/span><span class=\"p\">(<\/span><span class=\"n\">lluvias<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">media<\/span> <span class=\"o\">=<\/span> <span class=\"n\">statistics<\/span><span class=\"o\">.<\/span><span class=\"n\">mean<\/span><span class=\"p\">(<\/span><span class=\"n\">lluvias<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">mediana<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">media<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n","so":"3.1 12.26\n","test":"assert mediana == 3.1, f\"La mediana debe ser 3.1; se obtuvo {mediana}\"\nassert abs(media - 12.2571) < 1e-3, \"La media debe ser ≈ 12.26\"","web":true}],"quiz":[{"q":"¿Qué error produce `int(\"abc\")`?","o":["TypeError","ValueError","NameError","SyntaxError"],"c":1,"x":"El tipo es correcto (texto) pero el valor no se puede convertir: ValueError."},{"q":"¿Cuándo se ejecuta el bloque finally?","o":["Solo si hay error","Solo si no hay error","Siempre","Nunca"],"c":2,"x":"finally se ejecuta en todos los casos."},{"q":"¿Cómo se importa solo la función sqrt del módulo math?","o":["import sqrt","from math import sqrt","import math.sqrt()","math import sqrt"],"c":1,"x":"from módulo import nombre."},{"q":"¿Con qué comando se instala pandas usando pip?","o":["python pandas","pip install pandas","import pandas","install pandas"],"c":1,"x":"pip install nombre_paquete, desde la terminal."}],"glos":[{"t":"Excepción","d":"Error que ocurre durante la ejecución y puede capturarse."},{"t":"try / except","d":"Estructura para capturar y manejar excepciones."},{"t":"Módulo","d":"Archivo .py con funciones reutilizables que se importa con import."},{"t":"Paquete","d":"Conjunto de módulos que se instala con pip o conda (p. ej., pandas)."},{"t":"Biblioteca estándar","d":"Módulos que vienen incluidos con Python."}],"nb":"M10_errores_y_modulos.ipynb"},{"id":"M11","n":11,"t":"Archivos y datos: TXT, CSV y JSON","dur":"3 h","obj":["Leer y escribir archivos de texto con with open().","Procesar archivos CSV con el módulo csv.","Guardar y leer datos estructurados en JSON.","Manejar rutas de archivos con pathlib."],"web":true,"lec":[{"t":"Escribir y leer un archivo de texto","h":"<p><code>open(ruta, modo, encoding=\"utf-8\")<\/code> abre un archivo. Modos: <code>\"r\"<\/code> leer, <code>\"w\"<\/code> escribir (borra el contenido anterior), <code>\"a\"<\/code> agregar al final.<\/p>\n<p>Use siempre <code>with<\/code>: cierra el archivo automáticamente al terminar el bloque. Use <code>encoding=\"utf-8\"<\/code> para que las tildes y la ñ se guarden correctamente.<\/p>\n<p><em>Este ejemplo crea un archivo en la carpeta donde está el cuaderno; en el curso interactivo (navegador) no se puede ejecutar.<\/em><\/p>","web":false,"c":"with open(\"bitacora.txt\", \"w\", encoding=\"utf-8\") as f:\n    f.write(\"Día 1: instalación de parcelas\\n\")\n    f.write(\"Día 2: medición de DAP\\n\")\n\nwith open(\"bitacora.txt\", \"r\", encoding=\"utf-8\") as f:\n    for linea in f:\n        print(linea.strip())","ch":"<span class=\"k\">with<\/span> <span class=\"nb\">open<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"bitacora.txt\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"w\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"utf-8\"<\/span><span class=\"p\">)<\/span> <span class=\"k\">as<\/span> <span class=\"n\">f<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">f<\/span><span class=\"o\">.<\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Día 1: instalación de parcelas<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">f<\/span><span class=\"o\">.<\/span><span class=\"n\">write<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Día 2: medición de DAP<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"k\">with<\/span> <span class=\"nb\">open<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"bitacora.txt\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"r\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">encoding<\/span><span class=\"o\">=<\/span><span class=\"s2\">\"utf-8\"<\/span><span class=\"p\">)<\/span> <span class=\"k\">as<\/span> <span class=\"n\">f<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">for<\/span> <span class=\"n\">linea<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">f<\/span><span class=\"p\">:<\/span>\n        <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">linea<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">())<\/span>\n","o":"Día 1: instalación de parcelas\nDía 2: medición de DAP\n","e":null,"img":[],"in":"","err":false},{"t":"Archivos CSV","h":"<p>Un <strong>CSV<\/strong> (valores separados por comas) es una tabla en texto plano; Excel lo abre y lo guarda. El módulo <code>csv<\/code> lo lee fila por fila:<\/p>\n<ul>\n<li><code>csv.reader<\/code> entrega cada fila como <strong>lista<\/strong>.<\/li>\n<li><code>csv.DictReader<\/code> entrega cada fila como <strong>diccionario<\/strong> (usa la primera fila como encabezados). Es lo más práctico.<\/li>\n<\/ul>\n<p><strong>Importante:<\/strong> los valores leídos son <strong>texto<\/strong>; conviértalos con <code>float()<\/code> o <code>int()<\/code>.<\/p>\n<p>Para practicar sin archivos, <code>io.StringIO(texto)<\/code> h os_csv_json.ipynb"},{"id":"M12","n":12,"t":"Clases y objetos (programación orientada a objetos)","dur":"3 h","obj":["Comprender qué son una clase y un objeto.","Definir clases con atributos y métodos.","Personalizar cómo se muestra un objeto.","Reutilizar código con herencia."],"web":true,"lec":[{"t":"¿Qué es un objeto?","h":"<p>Ya ha usado objetos sin saberlo: un texto es un objeto de la clase <code>str<\/code> y tiene métodos como <code>.upper()<\/code>; una lista es un objeto de la clase <code>list<\/code> con métodos como <code>.append()<\/code>.<\/p>\n<ul>\n<li>Una <strong>clase<\/strong> es un <strong>molde<\/strong> o plantilla (por ejemplo, el formato de una ficha de árbol).<\/li>\n<li>Un <strong>objeto<\/strong> (instancia) es un <strong>ejemplar concreto<\/strong> hecho con ese molde (la ficha llena del árbol A-001).<\/li>\n<li>Los <strong>atributos<\/strong> son los datos del objeto (especie, DAP); los <strong>métodos<\/strong> son lo que el objeto sabe hacer (calcular su área basal).<\/li>\n<\/ul>","web":true,"c":"texto = \"algarrobo\"\nprint(type(texto))\nprint(texto.upper())   # método de la clase str","ch":"<span class=\"n\">texto<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"algarrobo\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">type<\/span><span class=\"p\">(<\/span><span class=\"n\">texto<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">texto<\/span><span class=\"o\">.<\/span><span class=\"n\">upper<\/span><span class=\"p\">())<\/span>   <span class=\"c1\"># método de la clase str<\/span>\n","o":"<class 'str'>\nALGARROBO\n","e":null,"img":[],"in":"","err":false},{"t":"Definir una clase","h":"<pre><code>class NombreClase:\n    def __init__(self, parametro):\n        self.atributo = parametro\n<\/code><\/pre>\n<ul>\n<li><code>class<\/code> define la clase; por convención el nombre empieza con <strong>mayúscula<\/strong>.<\/li>\n<li><code>__init__<\/code> es el <strong>constructor<\/strong>: se ejecuta al crear cada objeto y guarda sus datos.<\/li>\n<li><code>self<\/code> representa <strong>al propio objeto<\/strong>; es siempre el primer parámetro de los métodos.<\/li>\n<\/ul>","web":true,"c":"class Arbol:\n    def __init__(self, codigo, especie, dap_cm, altura_m):\n        self.codigo = codigo\n        self.especie = especie\n        self.dap_cm = dap_cm\n        self.altura_m = altura_m\n\na1 = Arbol(\"A-001\", \"Algarrobo\", 32.5, 9.0)\na2 = Arbol(\"A-002\", \"Faique\", 18.0, 6.5)\nprint(a1.especie, a1.dap_cm)\nprint(a2.especie, a2.dap_cm)","ch":"<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Arbol<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">codigo<\/span><span class=\"p\">,<\/span> <span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">,<\/span> <span class=\"n\">altura_m<\/span><span class=\"p\">):<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">codigo<\/span> <span class=\"o\">=<\/span> <span class=\"n\">codigo<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">especie<\/span> <span class=\"o\">=<\/span> <span class=\"n\">especie<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dap_cm<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">altura_m<\/span> <span class=\"o\">=<\/span> <span class=\"n\">altura_m<\/span>\n\n<span class=\"n\">a1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Arbol<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"A-001\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"mf\">32.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">9.0<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">a2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Arbol<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"A-002\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">,<\/span> <span class=\"mf\">18.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">6.5<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a1<\/span><span class=\"o\">.<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"n\">a1<\/span><span class=\"o\">.<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a2<\/span><span class=\"o\">.<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"n\">a2<\/span><span class=\"o\">.<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">)<\/span>\n","o":"Algarrobo 32.5\nFaique 18.0\n","e":null,"img":[],"in":"","err":false},{"t":"Métodos: lo que el objeto sabe hacer","h":"<p>Un método es una función definida dentro de la clase. Accede a los datos del objeto mediante <code>self<\/code>.<\/p>","web":true,"c":"import math\n\nclass Arbol:\n    def __init__(self, codigo, especie, dap_cm, altura_m):\n        self.codigo = codigo\n        self.especie = especie\n        self.dap_cm = dap_cm\n        self.altura_m = altura_m\n\n    def area_basal(self):\n        return math.pi / 4 * (self.dap_cm / 100) ** 2\n\n    def volumen(self, ff=0.5):   # ff supuesto para el ejemplo\n        return self.area_basal() * self.altura_m * ff\n\na = Arbol(\"A-001\", \"Algarrobo\", 32.5, 9.0)\nprint(f\"AB: {a.area_basal():.4f} m2\")\nprint(f\"Volumen: {a.volumen():.4f} m3\")","ch":"<span class=\"kn\">import<\/span><span c \/span> <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">area_basal<\/span><span class=\"p\">()<\/span> <span class=\"o\">*<\/span> <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">altura_m<\/span> <span class=\"o\">*<\/span> <span class=\"n\">ff<\/span>\n\n<span class=\"n\">a<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Arbol<\/span><span class=\"p\">(<\/span><span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">12<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">a<\/span><span class=\"o\">.<\/span><span class=\"n\">area_basal<\/span><span class=\"p\">(),<\/span> <span class=\"n\">a<\/span><span class=\"o\">.<\/span><span class=\"n\">volumen<\/span><span class=\"p\">())<\/span>\n","so":"0.07068583470577035 0.4241150082346221\n","test":"a = Arbol(30, 12)\nassert abs(a.area_basal() - 0.0706858) < 1e-6, \"AB de DAP 30 cm ≈ 0.0707 m2\"\nassert abs(a.volumen() - 0.4241150) < 1e-6, \"Volumen con ff 0.5 ≈ 0.4241 m3\"\nassert abs(a.volumen(ff=0.7) - 0.5937610) < 1e-6, \"Volumen con ff 0.7 ≈ 0.5938 m3\"","web":true},{"id":"M12-E3","t":"Inventario","n":3,"h":"<p>Complete la clase <code>Inventario<\/code>: <code>agregar(dap_cm)<\/code> guarda un DAP en la lista y <code>promedio()<\/code> devuelve el DAP promedio (0 si está vacío).<\/p>","p":"class Inventario:\n    def __init__(self):\n        self.daps = []\n\n    def agregar(self, dap_cm):\n        pass\n\n    def promedio(self):\n        pass\n\ninv = Inventario()\nfor d in [20, 30, 40]:\n    inv.agregar(d)\nprint(inv.promedio())","pista":"<p>Use <code>self.daps.append(dap_cm)<\/code>. En <code>promedio<\/code>, si <code>len(self.daps) == 0<\/code> devuelva 0.<\/p>","s":"class Inventario:\n    def __init__(self):\n        self.daps = []\n\n    def agregar(self, dap_cm):\n        self.daps.append(dap_cm)\n\n    def promedio(self):\n        if len(self.daps) == 0:\n            return 0\n        return sum(self.daps) / len(self.daps)\n\ninv = Inventario()\nfor d in [20, 30, 40]:\n    inv.agregar(d)\nprint(inv.promedio())","sh":"<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Inventario<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">):<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">daps<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">agregar<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">daps<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">)<\/span>\n\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">promedio<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">):<\/span>\n        <span class=\"k\">if<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">daps<\/span><span class=\"p\">)<\/span> <span class=\"o\">==<\/span> <span class=\"mi\">0<\/span><span class=\"p\">:<\/span>\n            <span class=\"k\">return<\/span> <span class=\"mi\">0<\/span>\n        <span class=\"k\">return<\/span> <span class=\"nb\">sum<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">daps<\/span><span class=\"p\">)<\/span> <span class=\"o\">/<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">daps<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">inv<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Inventario<\/span><span class=\"p\">()<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">d<\/span> <span class=\"ow\">in<\/span> <span class=\"p\">[<\/span><span class=\"mi\">20<\/span><span class=\"p\">,<\/span> <span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">40<\/span><span class=\"p\">]:<\/span>\n    <span class=\"n\">inv<\/span><span class=\"o\">.<\/span><span class=\"n\">agregar<\/span><span class=\"p\">(<\/span><span class=\"n\">d<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">inv<\/span><span class=\"o\">.<\/span><span class=\"n\">promedio<\/span><span class=\"p\">())<\/span>\n","so":"30.0\n","test":"vacio = Inventario()\nassert vacio.promedio() == 0, \"Un inventario vacío debe devolver 0.\"\ninv = Inventario()\nfor d in [20, 30, 40]:\n    inv.agregar(d)\nassert inv.daps == [20, 30, 40], \"agregar() no guarda los valores.\"\nassert inv.promedio() == 30, \"El promedio de 20, 30 y 40 es 30.\"","web":true},{"id":"M12-E4","t":"Mostrar con __str__","n":2,"h":"<p>Agregue <code>__str__<\/code> a la clase para que <code>str(Especie(\"Algarrobo\", \"Prosopis pallida\"))<\/code> devuelva <code>Algarrobo (Prosopis pallida)<\/code>.<\/p>","p":"class Especie:\n    def __init__(self, comun, cientifico):\n        self.comun = comun\n        self.cientifico = cientifico\n\n    # defina __str__ aquí\n\nprint(Especie(\"Algarrobo\", \"Prosopis pallida\"))","pista":"<p><code>def __str__(self): return f\"{self.comun} ({self.cientifico})\"<\/code><\/p>","s":"class Especie:\n    def __init__(self, comun, cientifico):\n        self.comun = comun\n        self.cientifico = cientifico\n\n    def __str__(self):\n        return f\"{self.comun} ({self.cientifico})\"\n\nprint(Especie(\"Algarrobo\", \"Prosopis pallida\"))","sh":"<span class=\"k\">class<\/span><span class=\"w\"> <\/span><span class=\"nc\">Especie<\/span><span class=\"p\">:<\/span>\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__init__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">,<\/span> <span class=\"n\">comun<\/span><span class=\"p\">,<\/span> <span class=\"n\">cientifico<\/span><span class=\"p\">):<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">comun<\/span> <span class=\"o\">=<\/span> <span class=\"n\">comun<\/span>\n        <span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">cientifico<\/span> <span class=\"o\">=<\/span> <span class=\"n\">cientifico<\/span>\n\n    <span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"fm\">__str__<\/span><span class=\"p\">(<\/span><span class=\"bp\">self<\/span><span class=\"p\">):<\/span>\n        <span class=\"k\">return<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">comun<\/span><span class=\"si\">}<\/span><span class=\"s2\"> (<\/span><span class=\"si\">{<\/span><span class=\"bp\">self<\/span><span class=\"o\">.<\/span><span class=\"n\">cientifico<\/span><span class=\"si\">}<\/span><span class=\"s2\">)\"<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">Especie<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Prosopis pallida\"<\/span><span class=\"p\">))<\/span>\n","so":"Algarrobo (Prosopis pallida)\n","test":"assert str(Especie(\"Algarrobo\", \"Prosopis pallida\")) == \"Algarrobo (Prosopis pallida)\", \"Revise el formato del texto.\"","web":true}],"quiz":[{"q":"¿Qué es un objeto?","o":["Un molde","Un ejemplar concreto creado a partir de una clase","Un archivo","Un tipo de bucle"],"c":1,"x":"La clase es el molde; el objeto, el ejemplar."},{"q":"¿Cuándo se ejecuta `__init__`?","o":["Al importar el módulo","Al crear cada objeto","Al imprimir el objeto","Nunca de forma automática"],"c":1,"x":"Es el constructor: se ejecuta al crear una instancia."},{"q":"¿Qué representa `self`?","o":["La clase padre","El propio objeto","Una variable global","El módulo"],"c":1,"x":"self es la referencia al objeto sobre el que se trabaja."},{"q":"¿Para qué sirve la herencia?","o":["Para copiar archivos","Para crear una clase basada en otra y reutilizar su código","Para borrar objetos","Para importar módulos"],"c":1,"x":"La clase hija recibe atributos y métodos de la clase padre."}],"glos":[{"t":"Clase","d":"Molde que define atributos y métodos de un tipo de objeto."},{"t":"Objeto (instancia)","d":"Ejemplar concreto creado a partir de una clase."},{"t":"Atributo","d":"Dato que pertenece a un objeto (self.dap_cm)."},{"t":"Constructor (__init__)","d":"Método que inicializa un objeto al crearlo."},{"t":"self","d":"Referencia al propio objeto dentro de sus métodos."},{"t":"Herencia","d":"Mecanismo para crear una clase a partir de otra."}],"nb":"M12_clases_y_objetos.ipynb"},{"id":"M13","n":13,"t":"Análisis de datos con NumPy, pandas y matplotlib","dur":"4 h","obj":["Hacer cálculos sobre columnas completas con NumPy.","Crear, explorar, filtrar y resumir tablas con pandas.","Leer y escribir CSV y Excel con pandas.","Elaborar gráficos básicos con matplotlib."],"web":false,"lec":[{"t":"Preparar el entorno","h":"<p>Este módulo usa paquetes externos y <strong>no se ejecuta en el curso interactivo del navegador<\/strong>: utilice <strong>Jupyter (Anaconda)<\/strong> o <strong>Google Colab<\/strong>, donde ya vienen instalados. Si faltara alguno: <code>%pip install numpy pandas matplotlib openpyxl<\/code>.<\/p>\n<p>Por convención se importan con alias cortos: <code>np<\/code>, <code>pd<\/code> y <code>plt<\/code>.<\/p>","web":false,"c":"import numpy as np\nimport pandas as pd\nimport matplotlib.pyplot as plt\nprint(\"numpy\", np.__version__)\nprint(\"pandas\", pd.__version__)","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">numpy<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">np<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pandas<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">pd<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">matplotlib.pyplot<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">plt<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"numpy\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">np<\/span><span class=\"o\">.<\/span><span class=\"n\">__version__<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"pandas\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">pd<\/span><span class=\"o\">.<\/span><span class=\"n\">__version__<\/span><span class=\"p\">)<\/span>\n","o":"numpy 2.5.3\npandas 3.0.5\n","e":null,"img":[],"in":"","err":false},{"t":"NumPy: cálculos sobre muchos valores a la vez","h":"<p>Un <strong>arreglo<\/strong> (<code>np.array<\/code>) aplica una operación a <strong>todos los elementos sin escribir bucles<\/strong> (cálculo vectorizado). Es mucho más rápido que recorrer una lista.<\/p>","web":false,"c":"import numpy as np\n\ndap_cm = np.array([32.5, 18.0, 45.2, 22.7, 27.1])\nab = np.pi / 4 * (dap_cm / 100) ** 2      # sin bucle\nprint(np.round(ab, 4))\nprint(\"AB total:\", round(ab.sum(), 4), \"m2\")\nprint(\"DAP medio:\", dap_cm.mean(), \"| máximo:\", dap_cm.max())\nprint(dap_cm[dap_cm > 25])                 # filtro","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">numpy<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">np<\/span>\n\n<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">np<\/span><span class=\"o\">.<\/span><span class=\"n\">array<\/span><span class=\"p\">([<\/span><span class=\"mf\">32.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">18.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">45.2<\/span><span class=\"p\">,<\/span> <span class=\"mf\">22.7<\/span><span class=\"p\">,<\/span> <span class=\"mf\">27.1<\/span><span class=\"p\">])<\/span>\n<span class=\"n\">ab<\/span> <span class=\"o\">=<\/span> <span class=\"n\">np<\/span><span class=\"o\">.<\/span><span class=\"n\">pi<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>      <span class=\"c1\"># sin bucle<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">np<\/span><span class=\"o\">.<\/span><span class=\"n\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">ab<\/span><span class=\"p\">,<\/span> <span class=\"mi\">4<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"AB total:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">ab<\/span><span class=\"o\">.<\/span><span class=\"n\">sum<\/span><span class=\"p\">(),<\/span> <span class=\"mi\">4<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"m2\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"DAP medio:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"o\">.<\/span><span class=\"n\">mean<\/span><span class=\"p\">(),<\/span> <span class=\"s2\">\"| máximo:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap_cm<\/span><span class=\"o\">.<\/span><span class=\"n\">max<\/span><span class=\"p\">())<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">[<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">25<\/span><span class=\"p\">])<\/span>                 <span class=\"c1\"># filtro<\/span>\n","o":"[0.083  0.0254 0.1605 0.0405 0.0577]\nAB total: 0.367 m2\nDAP medio: 29.1 | máximo: 45.2\n[32.5 45.2 27.1]\n","e":null,"img":[],"in":"","err":false},{"t":"pandas: la tabla (DataFrame)","h":"<p>Un <strong>DataFrame<\/strong> es una tabla con filas y columnas con nombre, como una hoja de Excel. Cada columna es una <strong>Serie<\/strong>.<\/p>\n<table>\n<thead>\n<tr>\n<th>Instrucción<\/th>\n<th>Qué muestra<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>df.head()<\/code><\/td>\n<td>primeras 5 filas<\/td>\n<\/tr>\n<tr>\n<td><code>df.shape<\/code><\/td>\n<td>(filas, columnas)<\/td>\n<\/tr>\n<tr>\n<td><code>df.columns<\/code><\/td>\n<td>nombres de columnas<\/td>\n<\/tr>\n<tr>\n<td><code>df.dtypes<\/code><\/td>\n<td>tipo de cada columna<\/td>\n<\/tr>\n<tr>\n<td><code>df.describe()<\/code><\/td>\n<td>estadísticas de columnas numéricas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p><em>Datos ficticios de ejemplo.<\/em><\/p>","web":false,"c":"import pandas as pd\n\ndf = pd.DataFrame({\n    \"codigo\": [\"A-01\", \"A-02\", \"A-03\", \"A-04\", \"A-05\", \"A-06\"],\n    \"especie\": [\"Algarrobo\", \"Faique\", \"Algarrobo\", \"Hualtaco\", \"Faique\", \"Algarrobo\"],\n    \"dap_cm\": [32.5, 18.0, 45.2, 22.7, 20.4, 38.1],\n    \"altura_m\": [9.0, 6.5, 11.0, 8.2, 7.0, 10.4],\n})\nprint(df.shape)\nprint(df.head())\nprint(df.describe().round(2))","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pandas<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/

an class=\"o\">&gt;<\/span> <span class=\"mi\">500<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">pendiente<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">50<\/span> <span class=\"ow\">or<\/span> <span class=\"n\">lluvia_mm<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">500<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"ow\">not<\/span> <span class=\"n\">pendiente<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">30<\/span><span class=\"p\">)<\/span>\n","o":"True\nTrue\nFalse\n","e":null,"img":[],"in":"","err":false},{"t":"Comparaciones encadenadas","h":"<p>Python permite escribir rangos de forma natural: <code>15 &lt;= x &lt;= 30<\/code> equivale a <code>x &gt;= 15 and x &lt;= 30<\/code>.<\/p>","web":true,"c":"temperatura = 24\nprint(18 <= temperatura <= 28)   # ¿está en el rango?\nprint(0 < -5 < 10)","ch":"<span class=\"n\">temperatura<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">24<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">18<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"n\">temperatura<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"mi\">28<\/span><span class=\"p\">)<\/span>   <span class=\"c1\"># ¿está en el rango?<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span> <span class=\"o\">&lt;<\/span> <span class=\"o\">-<\/span><span class=\"mi\">5<\/span> <span class=\"o\">&lt;<\/span> <span class=\"mi\">10<\/span><span class=\"p\">)<\/span>\n","o":"True\nFalse\n","e":null,"img":[],"in":"","err":false},{"t":"Valores que cuentan como verdadero o falso","h":"<p>Cualquier valor puede evaluarse como lógico con <code>bool()<\/code>:<\/p>\n<ul>\n<li>Se consideran <strong>falsos<\/strong>: <code>0<\/code>, <code>0.0<\/code>, <code>\"\"<\/code> (texto vacío), <code>None<\/code>, listas vacías.<\/li>\n<li>Todo lo demás es <strong>verdadero<\/strong>.<\/li>\n<\/ul>\n<p>Esto será útil para verificar si un campo está vacío.<\/p>","web":true,"c":"print(bool(0), bool(15))\nprint(bool(\"\"), bool(\"Faique\"))\nprint(bool(None))","ch":"<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">bool<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">),<\/span> <span class=\"nb\">bool<\/span><span class=\"p\">(<\/span><span class=\"mi\">15<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">bool<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"\"<\/span><span class=\"p\">),<\/span> <span class=\"nb\">bool<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Faique\"<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">bool<\/span><span class=\"p\">(<\/span><span class=\"kc\">None<\/span><span class=\"p\">))<\/span>\n","o":"False True\nFalse True\nFalse\n","e":null,"img":[],"in":"","err":false}],"ej":[{"id":"M03-E1","t":"¿Se inventaría el árbol?","n":1,"h":"<p>Con <code>dap_cm = 8.7<\/code>, guarde en <code>inventariable<\/code> si el árbol tiene un DAP mayor o igual a 10 cm (criterio de ejemplo).<\/p>","p":"dap_cm = 8.7\ninventariable = None   # escriba la comparación\nprint(inventariable)","pista":"<p>La comparación <code>dap_cm &gt;= 10<\/code> ya da True o False; guárdela directamente.<\/p>","s":"dap_cm = 8.7\ninventariable = dap_cm >= 10\nprint(inventariable)","sh":"<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">8.7<\/span>\n<span class=\"n\">inventariable<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"o\">&gt;=<\/span> <span class=\"mi\">10<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">inventariable<\/span><span class=\"p\">)<\/span>\n","so":"False\n","test":"assert inventariable is False, \"Con 8.7 cm el resultado debe ser False.\"","web":true},{"id":"M03-E2","t":"Dos condiciones a la vez","n":1,"h":"<p>Guarde en <code>requiere_zanjas<\/code> si la pendiente es mayor que 30 <strong>y<\/strong> la lluvia mayor que 500 mm (criterio ficticio de práctica).<\/p>","p":"pendiente = 42\nlluvia_mm = 480\nrequiere_zanjas = None\nprint(requiere_zanjas)","pista":"<p>Use <code>and<\/code> entre las dos comparaciones.<\/p>","s":"pendiente = 42\nlluvia_mm = 480\nrequiere_zanjas = pendiente > 30 and lluvia_mm > 500\nprint(requiere_zanjas)","sh":"<span class=\"n\">pendiente<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">42<\/span>\n<span class=\"n\">lluvia_mm<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">480<\/span>\n<span class=\"n\">requiere_zanjas<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pendiente<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">30<\/span> <span class=\"ow\">and<\/span> <span class=\"n\">lluvia_mm<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">500<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">requiere_zanjas<\/span><span class=\"p\">)<\/span>\n","so":"False\n","test":"assert requiere_zanjas is False, \"La lluvia no supera 500, por eso debe ser False.\"","web":true},{"id":"M03-E3","t":"Alerta de lluvia","n":1,"h":"<p>Guarde en <code>alerta<\/code> si la lluvia diaria supera 50 mm <strong>o<\/strong> el caudal supera 100 m³/s.<\/p>","p":"lluvia_dia = 38\ncaudal = 145\nalerta = None\nprint(alerta)","pista":"<p>Con <code>or<\/code> basta que una condición sea verdadera.<\/p>","s":"lluvia_dia = 38\ncaudal = 145\nalerta = lluvia_dia > 50 or caudal > 100\nprint(alerta)","sh":"<span class=\"n\">lluvia_dia<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">38<\/span>\n<span class=\"n\">caudal<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">145<\/span>\n<span class=\"n\">alerta<\/span> <span class=\"o\">=<\/span> <span class=\"n\">lluvia_dia<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">50<\/span> <span class=\"ow\">or<\/span> <span class=\"n\">caudal<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">100<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">alerta<\/span><span class=\"p\">)<\/span>\n","so":"True\n","test":"assert alerta is True, \"El caudal supera 100, por eso la alerta debe ser True.\"","web":true},{"id":"M03-E4","t":"Dentro del rango","n":2,"h":"<p>Guarde en <code>en_rango<\/code> si <code>ph<\/code> está entre 6.0 y 7.5 (inclusive), usando una comparación encadenada.<\/p>","p":"ph = 7.8\nen_rango = None\nprint(en_rango)","pista":"<p><code>6.0 &lt;= ph &lt;= 7.5<\/code><\/p>","s":"ph = 7.8\nen_rango = 6.0 <= ph <= 7.5\nprint(en_rango)","sh":"<span class=\"n\">ph<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">7.8<\/span>\n<span class=\"n\">en_rango<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">6.0<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"n\">ph<\/span> <span class=\"o\">&lt;=<\/span> <span class=\"mf\">7.5<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">en_rango<\/span><span class=\"p\">)<\/span>\n","so":"False\n","test":"assert en_rango is False, \"7.8 está fuera del rango 6.0–7.5.\"","web":true}],"quiz":[{"q":"¿Qué devuelve `5 == 5.0`?","o":["True","False","Error","None"],"c":0,"x":"Python compara el valor numérico: 5 y 5.0 valen lo mismo."},{"q":"¿Qué devuelve `True and False`?","o":["True","False"],"c":1,"x":"and exige que ambas partes sean verdaderas."},{"q":"¿Qué devuelve `not (3 > 1)`?","o":["True","False"],"c":1,"x":"3 > 1 es True y not lo invierte a False."},{"q":"¿Cuál de estos valores se evalúa como falso?","o":["\"0\"","\" \"","0","-1"],"c":2,"x":"El número 0 es falso. \"0\" y \" \" son textos no vacíos, por tanto verdaderos."}],"glos":[{"t":"Booleano","d":"Valor lógico True o False; resultado de una comparación."},{"t":"Operador lógico","d":"and, or y not; combinan o invierten condiciones."}],"nb":"M03_comparaciones_y_logica.ipynb"},{"id":"M04","n":4,"t":"Trabajando con texto","dur":"2 h","obj":["Crear, unir y formatear textos.","Usar f-strings para construir mensajes y reportes.","Extraer partes de un texto con índices y rebanadas.","Aplicar métodos de texto para limpiar datos."],"web":true,"lec":[{"t":"Crear textos","h":"<p>Un texto (<em>string<\/em> o cadena) se escribe entre comillas simples <code>' '<\/code> o dobles <code>\" \"<\/code>. Para textos de varias líneas se usan comillas triples <code>\"\"\" \"\"\"<\/code>.<\/p>\n<ul>\n<li><code>len(texto)<\/code> cuenta los caracteres (incluye espacios).<\/li>\n<li><code>\\n<\/code> dentro de un texto significa <strong>salto de línea<\/strong>.<\/li>\n<\/ul>","web":true,"c":"especie = \"Faique\"\nnota = 'Árbol con \"espinas\" blancas'\nprint(especie, len(especie))\nprint(nota)\nprint(\"Línea 1\\nLínea 2\")","ch":"<span class=\"n\">especie<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Faique\"<\/span>\n<span class=\"n\">nota<\/span> <span class=\"o\">=<\/span> <span class=\"s1\">'Árbol con \"espinas\" blancas'<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">nota<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Línea 1<\/span><span class=\"se\">\\n<\/span><span class=\"s2\">Línea 2\"<\/span><span class=\"p\">)<\/span>\n","o":"Faique 6\nÁrbol con \"espinas\" blancas\nLínea 1\nLínea 2\n","e":null,"img":[],"in":"","err":false},{"t":"Unir textos y f-strings","h":"<p>La forma más cómoda de combinar texto y variables es la <strong>f-string<\/strong>: se antepone <code>f<\/code> a las comillas y las variables van entre llaves <code>{ }<\/code>.<\/p>\n<p>Formatos útiles dentro de las llaves:<\/p>\n<table>\n<thead>\n<tr>\n<th>Formato<\/th>\n<th>Resultado<\/th>\n<th>Uso<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>{x:.2f}<\/code><\/td>\n<td>2 decimales<\/td>\n<td><code>12.50<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>{x:,.2f}<\/code><\/td>\n<td>separador de miles<\/td>\n<td><code>12,345.68<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>{x:.1%}<\/code><\/td>\n<td>porcentaje<\/td>\n<td><code>85.0%<\/code><\/td>\n<\/tr>\n<tr>\n<td><code>{texto:&gt;10}<\/code><\/td>\n<td>alinear a la derecha en 10 espacios<\/td>\n<td>tablas<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","web":true,"c":"parcela = 3\narea_ha = 12.5\ncosto = 45870.456\navance = 0.85\n\nprint(\"Parcela \" + str(parcela))                 # unión con +\nprint(f\"Parcela {parcela}: {area_ha:.2f} ha\")    # f-string\nprint(f\"Costo: S/ {costo:,.2f}\")\nprint(f\"Avance: {avance:.1%}\")","ch":"<span class=\"n\">parcela<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">3<\/span>\n<span class=\"n\">area_ha<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">12.5<\/span>\n<span class=\"n\">costo<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">45870.456<\/span>\n<span class=\"n\">avance<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">0.85<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Parcela \"<\/span> <span class=\"o\">+<\/span> <span class=\"nb\">str<\/span><span class=\"p\">(<\/span><span class=\"n\">parcela<\/span><span class=\"p\">))<\/span>                 <span class=\"c1\"># unión con +<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Parcela <\/span><span class=\"si\">{<\/span><span class=\"n\">parcela<\/span><span class=\"si\">}<\/span><span class=\"s2\">: <\/span><span class=\"si\">{<\/span><span class=\"n\">area_ha<\/span><span class=\"si\">:<\/span><span class=\"s2\">.2f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> ha\"<\/span><span class=\"p\">)<\/span>    <span class=\"c1\"># f-string<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Costo: S/ <\/span><span class=\"si\">{<\/span><span class=\"n\">costo<\/span><span class=\"si\">:<\/span><span class=\"s2\">,.2f<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Avance: <\/span><span class=\"si\">{<\/span><span class=\"n\">avance<\/span><span class=\"si\">:<\/span><span class=\"s2\">.1%<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n","o":"Parcela 3\nParcela 3: 12.50 ha\nCosto: S/ 45,870.46\nAvance: 85.0%\n","e":null,"img":[],"in":"","err":false},{"t":"Índices y rebanadas","h":"<p>Cada carácter tiene una <strong>posición (índice)<\/strong> que empieza en <strong>0<\/strong>. Los índices negativos cuentan desde el final.<\/p>\n<pre><code> texto:   A  L  G  -  0  4  5\n índice:  0  1  2  3  4  5  6\n negativo:-7 -6 -5 -4 -3 -2 -1\n<\/code><\/pre>\n<p>Una <strong>rebanada<\/strong> <code>texto[inicio:fin]<\/code> toma desde <em>inicio<\/em> hasta <em>fin<\/em>, <strong>sin incluir<\/strong> <em>fin<\/em>.<\/p>","web":true,"c":"codigo = \"ALG-045\"\nprint(codigo[0])      # primer carácter\nprint(codigo[-1])     # último carácter\nprint(codigo[0:3])    # posiciones 0, 1 y 2\nprint(codigo[4:])     # desde la posición 4 hasta el final","ch":"<span class=\"n\">codigo<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"ALG-045\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">codigo<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">])<\/span>      <span class=\"c1\"># primer carácter<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">codigo<\/span><span class=\"p\">[<\/span><span class=\"o\">-<\/span><span class=\"mi\">1<\/span><span class=\"p\">])<\/span>     <span class=\"c1\"># último carácter<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">codigo<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">:<\/span><span class=\"mi\">3<\/span><span class=\"p\">])<\/span>    <span class=\"c1\"># posiciones 0, 1 y 2<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">codigo<\/span><span class=\"p\">[<\/span><span class=\"mi\">4<\/span><span class=\"p\">:])<\/span>     <span class=\"c1\"># desde la posición 4 hasta el final<\/span>\n","o":"A\n5\nALG\n045\n","e":null,"img":[],"in":"","err":false},{"t":"Métodos útiles para limpiar datos","h":"<p>Un <strong>método<\/strong> es una función que pertenece a un valor y se usa con un punto: <code>texto.upper()<\/code>. Los textos <strong>no se modifican<\/strong>: el método devuelve un texto nuevo.<\/p>\n<table>\n<thead>\n<tr>\n<th>Método<\/th>\n<th>Qué hace<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><code>.upper()<\/code> / <code>.lower()<\/code><\/td>\n<td>mayúsculas / minúsculas<\/td>\n<\/tr>\n<tr>\n<td><code>.title()<\/code> / <code>.capitalize()<\/code><\/td>\n<td>Cada Palabra / Primera letra<\/td>\n<\/tr>\n<tr>\n<td><code>.strip()<\/code><\/td>\n<td>quita espacios al inicio y al final<\/td>\n<\/tr>\n<tr>\n<td><code>.replace(a, b)<\/code><\/td>\n<td>reemplaza a por b<\/td>\n<\/tr>\n<tr>\n<td><code>.split(sep)<\/code><\/td>\n<td>divide en partes (lista)<\/td>\n<\/tr>\n<tr>\n<td><code>sep.join(lista)<\/code><\/td>\n<td>une partes con un separador<\/td>\n<\/tr>\n<tr>\n<td><code>.startswith(x)<\/code><\/td>\n<td>¿empieza con x?<\/td>\n<\/tr>\n<tr>\n<td><code>.count(x)<\/code><\/td>\n<td>cuántas veces aparece x<\/td>\n<\/tr>\n<tr>\n<td><code>x in texto<\/code><\/td>\n<td>¿contiene x?<\/td>\n<\/tr>\n<\/tbody>\n<\/table>","web":true,"c":"dato = \"  prosopis PALLIDA  \"\nlimpio = dato.strip().capitalize()\nprint(f\"[{limpio}]\")\n\ncoord = \"545120,9425300\"\npartes = coord.split(\",\")\nprint(partes)\nprint(float(partes[0]) + 100)\n\nprint(\"-\".join([\"M3\", \"B12\"]))\nprint(\"pallida\" in limpio)","ch":"<span class=\"n\">dato<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"  prosopis PALLIDA  \"<\/span>\n<span class=\"n\">limpio<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dato<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()<\/span><span class=\"o\">.<\/span><span class=\"n\">capitalize<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"[<\/span><span class=\"si\">{<\/span><span class=\"n\">limpio<\/span><span class=\"si\">}<\/span><span class=\"s2\">]\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">coord<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"545120,9425300\"<\/span>\n<span class=\"n\">partes<\/span> <span class=\"o\">=<\/span> <span class=\"n\">coord<\/span><span class=\"o\">.<\/span><span class=\"n\">split<\/span><span class=\"p\">(<\/span><span class=\"s2\">\",\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">partes<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">partes<\/span><span class=\"p\">[<\/span><span class=\"mi\">0<\/span><span class=\"p\">])<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span>\n\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"-\"<\/span><span class=\"o\">.<\/span><span class=\"n\">join<\/span><span class=\"p\">([<\/span><span class=\"s2\">\"M3\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"B12\"<\/span><span class=\"p\">]))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"pallida\"<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">limpio<\/span><span class=\"p\">)<\/span>\n","o":"[Prosopis pallida]\n['545120', '9425300']\n545220.0\nM3-B12\nTrue\n","e":null,"img":[],"in":"","err":false},{"t":"Pedir datos al usuario: input()","h":"<p><code>input(\"mensaje\")<\/code> muestra un mensaje y espera que el usuario escriba algo. <strong>Siempre devuelve texto<\/strong>, por eso hay que convertirlo si es un número.<\/p>\n<p>En el curso interactivo, escriba las respuestas en el cuadro <strong>Entrada<\/strong> (una por línea) antes de ejecutar.<\/p>","web":true,"c":"nombre = input(\"¿Cuál es su nombre? \")\nedad = int(input(\"¿Cuántos años tiene? \"))\nprint(f\"Hola, {nombre}. En 5 años tendrá {edad + 5}.\")","ch":"<span class=\"n\">nombre<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"¿Cuál es su nombre? \"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">edad<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"nb\">input<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"¿Cuántos años tiene? \"<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Hola, <\/span><span class=\"si\">{<\/span><span class=\"n\">nombre<\/span><span class=\"si\">}<\/span><span class=\"s2\">. En 5 años tendrá <\/span><span class=\"si\">{<\/span><span class=\"n\">edad<\/span><span class=\"w\"> <\/span><span class=\"o\">+<\/span><span class=\"w\"> <\/span><span class=\"mi\">5<\/span><span class=\"si\">}<\/span><span class=\"s2\">.\"<\/span><span class=\"p\">)<\/span>\n","o":"¿Cuál es su nombre? Ana\n¿Cuántos años tiene? 30\nHola, Ana. En 5 años tendrá 35.\n","e":null,"img":[],"in":"Ana\n30","err":false}],"ej":[{"id":"M04-E1","t":"Nombre completo","n":1,"h":"<p>Una <code>nombre<\/code> y <code>apellido<\/code> con un espacio en medio y guarde el resultado en <code>completo<\/code>.<\/p>","p":"nombre = \"Ana\"\napellido = \"Torres\"\ncompleto = \"\"\nprint(completo)","pista":"<p>Use una f-string: <code>f\"{nombre} {apellido}\"<\/code>.<\/p>","s":"nombre = \"Ana\"\napellido = \"Torres\"\ncompleto = f\"{nombre} {apellido}\"\nprint(completo)","sh":"<span class=\"n\">nombre<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Ana\"<\/span>\n<span class=\"n\">apellido<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"Torres\"<\/span>\n<span class=\"n\">completo<\/span> <span class=\"o\">=<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"si\">{<\/span><span class=\"n\">nombre<\/span><span class=\"si\">}<\/span><span class=\"s2\"> <\/span><span class=\"si\">{<\/span><span class=\"n\">apellido<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">completo<\/span><span class=\"p\">)<\/span>\n","so":"Ana Torres\n","test":"assert completo == \"Ana Torres\", f\"Se esperaba 'Ana Torres' y se obtuvo '{completo}'.\"","web":true},{"id":"M04-E2","t":"Limpiar un dato de campo","n":1,"h":"<p>El texto <code>\"   ALGARROBO \"<\/code> viene con espacios y en mayúsculas. Guarde en <code>limpio<\/code> la versión <code>Algarrobo<\/code>.<\/p>","p":"dato = \"   ALGARROBO \"\nlimpio = dato\nprint(f\"[{limpio}]\")","pista":"<p>Encadene métodos: primero <code>.strip()<\/code> y luego <code>.capitalize()<\/code>.<\/p>","s":"dato = \"   ALGARROBO \"\nlimpio = dato.strip().capitalize()\nprint(f\"[{limpio}]\")","sh":"<span class=\"n\">dato<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"   ALGARROBO \"<\/span>\n<span class=\"n\">limpio<\/span> <span class=\"o\">=<\/span> <span class=\"n\">dato<\/span><span class=\"o\">.<\/span><span class=\"n\">strip<\/span><span class=\"p\">()<\/span><span class=\"o\">.<\/span><span class=\"n\">capitalize<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"[<\/span><span class=\"si\">{<\/span><span class=\"n\">limpio<\/span><span class=\"si\">}<\/span><span class=\"s2\">]\"<\/span><span class=\"p\">)<\/span>\n","so":"[Algarrobo]\n","test":"assert limpio == \"Algarrobo\", f\"Se obtuvo '{limpio}'.\"","web":true},{"id":"M04-E3","t":"Descomponer un código","n":2,"h":"<p>Del código <code>\"PI-ALG-0045\"<\/code>, guarde en <code>especie<\/code> el texto <code>ALG<\/code> y en <code>numero<\/code> el entero <code>45<\/code>.<\/p>","p":"codigo = \"PI-ALG-0045\"\npartes = codigo.split(\"-\")\nespecie = \"\"\nnumero = 0\nprint(especie, numero)","pista":"<p><code>partes<\/code> es una lista de 3 elementos: posiciones 0, 1 y 2. Convierta la última con <code>int()<\/code>.<\/p>","s":"codigo = \"PI-ALG-0045\"\npartes = codigo.split(\"-\")\nespecie = partes[1]\nnumero = int(partes[2])\nprint(especie, numero)","sh":"<span class=\"n\">codigo<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"PI-ALG-0045\"<\/span>\n<span class=\"n\">partes<\/span> <span class=\"o\">=<\/span> <span class=\"n\">codigo<\/span><span class=\"o\">.<\/span><span class=\"n\">split<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"-\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">especie<\/span> <span class=\"o\">=<\/span> <span class=\"n\">partes<\/span><span class=\"p\">[<\/span><span class=\"mi\">1<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">numero<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">int<\/span><span class=\"p\">(<\/span><span class=\"n\">partes<\/span><span class=\"p\">[<\/span><span class=\"mi\">2<\/span><span class=\"p\">])<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"n\">numero<\/span><span class=\"p\">)<\/span>\n","so":"ALG 45\n","test":"assert especie == \"ALG\", \"especie debe ser 'ALG'.\"\nassert numero == 45 and isinstance(numero, int), \"numero debe ser el entero 45.\"","web":true},{"id":"M04-E4","t":"Línea de reporte","n":2,"h":"<p>Construya en <code>reporte<\/code> el texto exacto <code>Parcela 3: 12.50 ha<\/code> usando una f-string con 2 decimales.<\/p>","p":"parcela = 3\narea = 12.5\nreporte = \"\"\nprint(reporte)","pista":"<p>Dentro de las llaves use <code>{area:.2f}<\/code>.<\/p>","s":"parcela = 3\narea = 12.5\nreporte = f\"Parcela {parcela}: {area:.2f} ha\"\nprint(reporte)","sh":"<span class=\"n\">parcela<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">3<\/span>\n<span class=\"n\">area<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">12.5<\/span>\n<span class=\"n\">reporte<\/span> <span class=\"o\">=<\/span> <span class=\"sa\">f<\/span><span class=\"s2\">\"Parcela <\/span><span class=\"si\">{<\/span><span class=\"n\">parcela<\/span><span class=\"si\">}<\/span><span class=\"s2\">: <\/span><span class=\"si\">{<\/span><span class=\"n\">area<\/span><span class=\"si\">:<\/span><span class=\"s2\">.2f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> ha\"<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">reporte<\/span><span class=\"p\">)<\/span>\n","so":"Parcela 3: 12.50 ha\n","test":"assert reporte == \"Parcela 3: 12.50 ha\", f\"Se obtuvo '{reporte}'.\"","web":true}],"quiz":[{"q":"Si `t = \"Python\"`, ¿qué es `t[0]`?","o":["\"P\"","\"y\"","\"n\"","Error"],"c":0,"x":"Los índices empiezan en 0, que corresponde al primer carácter."},{"q":"Si `t = \"Python\"`, ¿qué es `t[1:4]`?","o":["\"Pyt\"","\"yth\"","\"ytho\"","\"tho\""],"c":1,"x":"Toma las posiciones 1, 2 y 3; la 4 no se incluye."},{"q":"¿Qué imprime `print(f\"{3.14159:.2f}\")`?","o":["3.14159","3.1","3.14","3"],"c":2,"x":".2f muestra el número con 2 decimales."},{"q":"¿Qué tipo de dato devuelve siempre `input()`?","o":["int","float","str","Depende de lo que se escriba"],"c":2,"x":"input() siempre devuelve texto; hay que convertirlo para operar."}],"glos":[{"t":"Cadena (string)","d":"Secuencia de caracteres; tipo str."},{"t":"f-string","d":"Texto con prefijo f que permite insertar variables entre llaves."},{"t":"Índice","d":"Posición de un elemento; empieza en 0."},{"t":"Rebanada (slice)","d":"Parte de una secuencia: s[inicio:fin], sin incluir fin."},{"t":"Método","d":"Función asociada a un valor que se llama con un punto: texto.upper()."}],"nb":"M04_texto.ipynb"},{"id":"M05","n":5,"t":"Tomando decisiones: if, elif y else","dur":"2 h","obj":["Ejecutar código solo cuando se cumple una condición.","Elegir entre varias alternativas con elif y else.","Comprender la sangría como parte de la sintaxis de Python."],"web":true,"lec":[{"t":"La instrucción if","h":"<p><code>if<\/code> (si) ejecuta un bloque de código <strong>solo si<\/strong> la condición es verdadera.<\/p>\n<pre><code>if condición:\n    instrucción 1     # 4 espacios de sangría\n    instrucción 2\nsiguiente línea       # sin sangría: se ejecuta siempre\n<\/code><\/pre>\n<p>Dos detalles obligatorios:<\/p>\n<ol>\n<li>La línea del <code>if<\/code> termina con <strong>dos puntos<\/strong> <code>:<\/code>.<\/li>\n<li>Las instrucciones del bloque llevan <strong>sangría de 4 espacios<\/strong> (la tecla Tab en Jupyter la inserta). La sangría indica qué líneas \"pertenecen\" al <code>if<\/code>.<\/li>\n<\/ol>","web":true,"c":"lluvia_mm = 72\nif lluvia_mm > 50:\n    print(\"Alerta: lluvia intensa\")\n    print(\"Revisar obras de drenaje\")\nprint(\"Fin de la evaluación\")","ch":"<span class=\"n\">lluvia_mm<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">72<\/span>\n<span class=\"k\">if<\/span> <span class=\"n\">lluvia_mm<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">50<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Alerta: lluvia intensa\"<\/span><span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Revisar obras de drenaje\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Fin de la evaluación\"<\/span><span class=\"p\">)<\/span>\n","o":"Alerta: lluvia intensa\nRevisar obras de drenaje\nFin de la evaluación\n","e":null,"img":[],"in":"","err":false},{"t":"if … else","h":"<p><code>else<\/code> (si no) define qué hacer cuando la condición es falsa. No lleva condición.<\/p>","web":true,"c":"dap_cm = 8.4\nif dap_cm >= 10:\n    print(\"Registrar en el inventario\")\nelse:\n    print(\"Registrar como regeneración\")","ch":"<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">8.4<\/span>\n<span class=\"k\">if<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"o\">&gt;=<\/span> <span class=\"mi\">10<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Registrar en el inventario\"<\/span><span class=\"p\">)<\/span>\n<span class=\"k\">else<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Registrar como regeneración\"<\/span><span class=\"p\">)<\/span>\n","o":"Registrar como regeneración\n","e":null,"img":[],"in":"","err":false},{"t":"Varias alternativas: elif","h":"<p><code>elif<\/code> (si no, si…) permite evaluar condiciones en cadena. Python revisa <strong>de arriba hacia abajo<\/strong> y ejecuta <strong>solo el primer bloque verdadero<\/strong>. Por eso el orden importa.<\/p>\n<p>Los rangos del ejemplo son ilustrativos, no normativos.<\/p>","web":true,"c":"pendiente = 22   # porcentaje\n\nif pendiente < 15:\n    clase = \"Suave\"\nelif pendiente < 30:\n    clase = \"Moderada\"\nelif pendiente < 50:\n    clase = \"Fuerte\"\nelse:\n    clase = \"Muy fuerte\"\n\nprint(f\"Pendiente {pendiente}% -> {clase}\")","ch":"<span class=\"n\">pendiente<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">22<\/span>   <span class=\"c1\"># porcentaje<\/span>\  plantones.pop()\nprint(plantones, \"| retirado:\", ultimo)","ch":"<span class=\"n\">plantones<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">plantones<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Hualtaco\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">plantones<\/span><span class=\"o\">.<\/span><span class=\"n\">insert<\/span><span class=\"p\">(<\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Ceibo\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">plantones<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">plantones<\/span><span class=\"o\">.<\/span><span class=\"n\">remove<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Faique\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">ultimo<\/span> <span class=\"o\">=<\/span> <span class=\"n\">plantones<\/span><span class=\"o\">.<\/span><span class=\"n\">pop<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">plantones<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"| retirado:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">ultimo<\/span><span class=\"p\">)<\/span>\n","o":"['Ceibo', 'Algarrobo', 'Faique', 'Hualtaco']\n['Ceibo', 'Algarrobo'] | retirado: Hualtaco\n","e":null,"img":[],"in":"","err":false},{"t":"Ordenar, buscar y resumir","h":"<ul>\n<li><code>sum()<\/code>, <code>min()<\/code>, <code>max()<\/code> y <code>len()<\/code> resumen listas de números.<\/li>\n<li><code>sorted(lista)<\/code> devuelve una <strong>copia ordenada<\/strong>; <code>lista.sort()<\/code> ordena <strong>la misma lista<\/strong>.<\/li>\n<li><code>x in lista<\/code> verifica si un elemento existe; <code>lista.index(x)<\/code> dice su posición.<\/li>\n<\/ul>","web":true,"c":"dap = [32.5, 18.0, 45.2, 22.7, 27.1]\nprint(\"Mínimo:\", min(dap), \"Máximo:\", max(dap))\nprint(\"Promedio:\", round(sum(dap) / len(dap), 2))\nprint(\"Ordenado:\", sorted(dap))\nprint(\"De mayor a menor:\", sorted(dap, reverse=True))\nprint(45.2 in dap, dap.index(45.2))","ch":"<span class=\"n\">dap<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mf\">32.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">18.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">45.2<\/span><span class=\"p\">,<\/span> <span class=\"mf\">22.7<\/span><span class=\"p\">,<\/span> <span class=\"mf\">27.1<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Mínimo:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">min<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"Máximo:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">max<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Promedio:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"nb\">sum<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">)<\/span> <span class=\"o\">/<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">),<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Ordenado:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">sorted<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"De mayor a menor:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">sorted<\/span><span class=\"p\">(<\/span><span class=\"n\">dap<\/span><span class=\"p\">,<\/span> <span class=\"n\">reverse<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">))<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"mf\">45.2<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">dap<\/span><span class=\"p\">,<\/span> <span class=\"n\">dap<\/span><span class=\"o\">.<\/span><span class=\"n\">index<\/span><span class=\"p\">(<\/span><span class=\"mf\">45.2<\/span><span class=\"p\">))<\/span>\n","o":"Mínimo: 18.0 Máximo: 45.2\nPromedio: 29.1\nOrdenado: [18.0, 22.7, 27.1, 32.5, 45.2]\nDe mayor a menor: [45.2, 32.5, 27.1, 22.7, 18.0]\nTrue 2\n","e":null,"img":[],"in":"","err":false},{"t":"Rebanadas y recorrido","h":"<p>Las rebanadas funcionan igual que en los textos: <code>lista[inicio:fin]<\/code>.<\/p>","web":true,"c":"meses = [\"ene\", \"feb\", \"mar\", \"abr\", \"may\", \"jun\"]\nprint(meses[:3])     # primer trimestre\nprint(meses[3:])     # segundo trimestre\nfor m in meses[::2]: # uno sí, uno no\n    print(m)","ch":"<span class=\"n\">meses<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"ene\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"feb\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"mar\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"abr\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"may\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"jun\"<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">meses<\/span><span class=\"p\">[:<\/span><span class=\"mi\">3<\/span><span class=\"p\">])<\/span>     <span class=\"c1\"># primer trimestre<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">meses<\/span><span class=\"p\">[<\/span><span class=\"mi\">3<\/span><span class=\"p\">:])<\/span>     <span class=\"c1\"># segundo trimestre<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">m<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">meses<\/span><span class=\"p\">[::<\/span><span class=\"mi\">2<\/span><span class=\"p\">]:<\/span> <span class=\"c1\"># uno sí, uno no<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">m<\/span><span class=\"p\">)<\/span>\n","o":"['ene', 'feb', 'mar']\n['abr', 'may', 'jun']\nene\nmar\nmay\n","e":null,"img":[],"in":"","err":false},{"t":"Comprensiones de listas","h":"<p>Una <strong>comprensión<\/strong> crea una lista nueva a partir de otra en una sola línea:<\/p>\n<pre><code>nueva = [expresión for elemento in lista]\nnueva = [expresión for elemento in lista if condición]\n<\/code><\/pre>\n<p>Equivale a un <code>for<\/code> con <code>append<\/code>, pero más compacto. Empiece por el bucle tradicional y, cuando lo entienda, pase a la comprensión.<\/p>","web":true,"c":"dap_cm = [32.5, 18.0, 45.2, 22.7]\n\n# Forma tradicional\ndap_m = []\nfor d in dap_cm:\n    dap_m.append(d / 100)\nprint(dap_m)\n\n# Comprensión equivalente\ndap_m = [d / 100 for d in dap_cm]\nprint(dap_m)\n\n# Con filtro: solo DAP mayores a 25 cm\ngrandes = [d for d in dap_cm if d > 25]\nprint(grandes)","ch":"<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mf\">32.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">18.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">45.2<\/span><span class=\"p\">,<\/span> <span class=\"mf\">22.7<\/span><span class=\"p\">]<\/span>\n\n<span class=\"c1\"># Forma tradicional<\/span>\n<span class=\"n\">dap_m<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">d<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">dap_m<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"n\">d<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_m<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Comprensión equivalente<\/span>\n<span class=\"n\">dap_m<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"n\">d<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span> <span class=\"k\">for<\/span> <span class=\"n\">d<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_m<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Con filtro: solo DAP mayores a 25 cm<\/span>\n<span class=\"n\">grandes<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"n\">d<\/span> <span class=\"k\">for<\/span> <span class=\"n\">d<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">dap_cm<\/span> <span class=\"k\">if<\/span> <span class=\"n\">d<\/span> <span class=\"o\">&gt;<\/span> <span class=\"mi\">25<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">grandes<\/span><span class=\"p\">)<\/span>\n","o":"[0.325, 0.18, 0.452, 0.22699999999999998]\n[0.325, 0.18, 0.452, 0.22699999999999998]\n[32.5, 45.2]\n","e":null,"img":[],"in":"","err":false},{"t":"Tuplas: datos que no cambian","h":"<p>Una <strong>tupla<\/strong> es como una lista, pero se escribe con paréntesis y <strong>no se puede modificar<\/strong>. Es ideal para datos fijos, como un par de coordenadas (Este, Norte).<\/p>\n<p>El <strong>desempaquetado<\/strong> asigna cada elemento a una variable.<\/p>","web":true,"c":"punto = (545120, 9425300)     # (Este, Norte) UTM 17S, punto de ejemplo\neste, norte = punto           # desempaquetado\nprint(\"Este:\", este)\nprint(\"Norte:\", norte)\n\nvertices = [(0, 0), (100, 0), (100, 50)]\nfor x, y in vertices:\n    print(x, y)","ch":"<span class=\"n\">punto<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span><span class=\"mi\">545120<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425300<\/span><span class=\"p\">)<\/span>     <span class=\"c1\"># (Este, Norte) UTM 17S, punto de ejemplo<\/span>\n<span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span> <span class=\"o\">=<\/span> <span class=\"n\">punto<\/span>           <span class=\"c1\"># desempaquetado<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Este:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">este<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Norte:\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">vertices<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[(<\/span><span class=\"mi\">0<\/span><span class=\"p\">,<\/span> <span class=\"mi\">0<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">,<\/span> <span class=\"mi\">0<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">100<\/span><span class=\"p\">,<\/span> <span class=\"mi\">50<\/span><span class=\"p\">)]<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">x<\/span><span class=\"p\">,<\/span> <span class=\"n\">y<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">vertices<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">x<\/span><span class=\"p\">,<\/span> <span class=\"n\">y<\/span><span class=\"p\">)<\/span>\n","o":"Este: 545120\nNorte: 9425300\n0 0\n100 0\n100 50\n","e":null,"img":[],"in":"","err":false}],"ej":[{"id":"M07-E1","t":"Actualizar la lista de especies","n":1,"h":"<p>Agregue <code>Faique<\/code> al final de la lista y elimine <code>Eucalipto<\/code>.<\/p>","p":"especies = [\"Algarrobo\", \"Eucalipto\", \"Hualtaco\"]\n# sus instrucciones aquí\n\nprint(especies)","pista":"<p>Use <code>.append()<\/code> y <code>.remove()<\/code>.<\/p>","s":"especies = [\"Algarrobo\", \"Eucalipto\", \"Hualtaco\"]\nespecies.append(\"Faique\")\nespecies.remove(\"Eucalipto\")\nprint(especies)","sh":"<span class=\"n\">especies<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Eucalipto\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Hualtaco\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">especies<\/span><span class=\"o\">.<\/span><span class=\"n\">append<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Faique\"<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">especies<\/span><span class=\"o\">.<\/span><span class=\"n\">remove<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Eucalipto\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">especies<\/span><span class=\"p\">)<\/span>\n","so":"['Algarrobo', 'Hualtaco', 'Faique']\n","test":"assert especies == [\"Algarrobo\", \"Hualtaco\", \"Faique\"], f\"Se obtuvo {especies}.\"","web":true},{"id":"M07-E2","t":"Resumen de alturas","n":1,"h":"<p>Calcule <code>maximo<\/code>, <code>minimo<\/code> y <code>promedio<\/code> de la lista de alturas.<\/p>","p":"alturas = [12.5, 9.8, 15.1, 11.0, 13.6]\nmaximo = 0\nminimo = 0\npromedio = 0\nprint(maximo, minimo, round(promedio, 2))","pista":"<p>Use <code>max()<\/code>, <code>min()<\/code> y <code>sum() / len()<\/code>.<\/p>","s":"alturas = [12.5, 9.8, 15.1, 11.0, 13.6]\nmaximo = max(alturas)\nminimo = min(alturas)\npromedio = sum(alturas) / len(alturas)\nprint(maximo, minimo, round(promedio, 2))","sh":"<span class=\"n\">alturas<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mf\">12.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">9.8<\/span><span class=\"p\">,<\/span> <span class=\"mf\">15.1<\/span><span class=\"p\">,<\/span> <span class=\"mf\">11.0<\/span><span class=\"p\">,<\/span> <span class=\"mf\">13.6<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">maximo<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">max<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">minimo<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">min<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">promedio<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">sum<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">)<\/span> <span class=\"o\">/<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">alturas<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">maximo<\/span><span class=\"p\">,<\/span> <span class=\"n\">minimo<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">promedio<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">))<\/span>\n","so":"15.1 9.8 12.4\n","test":"assert maximo == 15.1 and minimo == 9.8, \"Revise máximo y mínimo.\"\nassert abs(promedio - 12.4) < 1e-9, \"El promedio debe ser 12.4.\"","web":true},{"id":"M07-E3","t":"De centímetros a metros","n":2,"h":"<p>Con una comprensión de lista, cree <code>dap_m<\/code> con los diámetros convertidos a metros.<\/p>","p":"dap_cm = [20, 35, 50]\ndap_m = []\nprint(dap_m)","pista":"<p><code>[d / 100 for d in dap_cm]<\/code><\/p>","s":"dap_cm = [20, 35, 50]\ndap_m = [d / 100 for d in dap_cm]\nprint(dap_m)","sh":"<span class=\"n\">dap_cm<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"mi\">20<\/span><span class=\"p\">,<\/span> <span class=\"mi\">35<\/span><span class=\"p\">,<\/span> <span class=\"mi\">50<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">dap_m<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"n\">d<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span> <span class=\"k\">for<\/span> <span class=\"n\">d<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">dap_cm<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_m<\/span><span class=\"p\">)<\/span>\n","so":"[0.2, 0.35, 0.5]\n","test":"assert dap_m == [0.2, 0.35, 0.5], f\"Se obtuvo {dap_m}.\"","web":true},{"id":"M07-E4","t":"Distancia entre dos puntos","n":2,"h":"<p>Desempaquete las tuplas y calcule en <code>distancia<\/code> la distancia en metros entre los puntos con el teorema de Pitágoras: √((x2−x1)² + (y2−y1)²).<\/p>","p":"p1 = (500000, 9400000)\np2 = (500300, 9400400)\ndistancia = 0\nprint(distancia)","pista":"<p>La raíz cuadrada se obtiene elevando a 0.5: <code>(...) ** 0.5<\/code>.<\/p>","s":"p1 = (500000, 9400000)\np2 = (500300, 9400400)\nx1, y1 = p1\nx2, y2 = p2\ndistancia = ((x2 - x1) ** 2 + (y2 - y1) ** 2) ** 0.5\nprint(distancia)","sh":"<span class=\"n\">p1<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span><span class=\"mi\">500000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9400000<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">p2<\/span> <span class=\"o\">=<\/span> <span class=\"p\">(<\/span><span class=\"mi\">500300<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9400400<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">x1<\/span><span class=\"p\">,<\/span> <span class=\"n\">y1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">p1<\/span>\n<span class=\"n\">x2<\/span><span class=\"p\">,<\/span> <span class=\"n\">y2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">p2<\/span>\n<span class=\"n\">distancia<\/span> <span class=\"o\">=<\/span> <span class=\"p\">((<\/span><span class=\"n\">x2<\/span> <span class=\"o\">-<\/span> <span class=\"n\">x1<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span> <span class=\"o\">+<\/span> <span class=\"p\">(<\/span><span class=\"n\">y2<\/span> <span class=\"o\">-<\/span> <span class=\"n\">y1<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mf\">0.5<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">distancia<\/span><span class=\"p\">)<\/span>\n","so":"500.0\n","test":"assert abs(distancia - 500) < 1e-9, f\"La distancia debe ser 500 m; se obtuvo {distancia}.\"","web":true}],"quiz":[{"q":"Si `l = [10, 20, 30]`, ¿qué devuelve `l[-1]`?","o":["10","20","30","Error"],"c":2,"x":"El índice -1 es el último elemento."},{"q":"¿Qué método agrega un elemento al final de una lista?","o":[".add()",".append()",".insert()",".push()"],"c":1,"x":"append() agrega al final."},{"q":"¿Qué diferencia principal hay entre lista y tupla?","o":["La tupla no se puede modificar","La lista no admite números","No hay diferencia","La tupla solo guarda textos"],"c":0,"x":"Las tuplas son inmutables."},{"q":"¿Qué produce `[x * 2 for x in [1, 2, 3]]`?","o":["[1, 2, 3, 1, 2, 3]","[2, 4, 6]","[1, 4, 9]","6"],"c":1,"x":"La comprensión multiplica cada elemento por 2."}],"glos":[{"t":"Lista","d":"Colección ordenada y modificable de valores: [1, 2, 3]."},{"t":"Tupla","d":"Colección ordenada que no se puede modificar: (1, 2)."},{"t":"Comprensión de lista","d":"Forma compacta de crear una lista: [x for x in datos]."},{"t":"Desempaquetado","d":"Asignar los elementos de una secuencia a varias variables: a, b = (1, 2)."}],"nb":"M07_listas_y_tuplas.ipynb"},{"id":"M08","n":8,"t":"Diccionarios y conjuntos","dur":"2.5 h","obj":["Guardar datos con nombre usando diccionarios (clave: valor).","Recorrer y modificar diccionarios.","Representar una tabla como lista de diccionarios.","Usar conjuntos para obtener valores únicos y comparar grupos."],"web":true,"lec":[{"t":"¿Qué es un diccionario?","h":"<p>Un <strong>diccionario<\/strong> guarda pares <strong>clave: valor<\/strong> entre llaves <code>{ }<\/code>. En lugar de acceder por posición, se accede <strong>por nombre<\/strong> (clave). Es como una ficha de campo: cada campo tiene un nombre y un valor.<\/p>\n<ul>\n<li><code>dic[\"clave\"]<\/code> obtiene el valor (error si no existe).<\/li>\n<li><code>dic.get(\"clave\", defecto)<\/code> obtiene el valor o un valor por defecto si no existe.<\/li>\n<\/ul>","web":true,"c":"arbol = {\n    \"codigo\": \"A-001\",\n    \"especie\": \"Algarrobo\",\n    \"dap_cm\": 32.5,\n    \"altura_m\": 9.0,\n}\nprint(arbol[\"especie\"])\nprint(arbol.get(\"estado\", \"Por verificar\"))","ch":"<span class=\"n\">arbol<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span>\n    <span class=\"s2\">\"codigo\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"A-001\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"especie\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"dap_cm\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">32.5<\/span><span class=\"p\">,<\/span>\n    <span class=\"s2\">\"altura_m\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">9.0<\/span><span class=\"p\">,<\/span>\n<span class=\"p\">}<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arbol<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"especie\"<\/span><span class=\"p\">])<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">arbol<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"estado\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Por verificar\"<\/span><span class=\"p\">))<\/span>\n","o":"Algarrobo\nPor verificar\n","e":null,"img":[],"in":"","err":false},{"t":"Modificar, agregar y eliminar","h":"<ul>\n<li>Asignar a una clave existente <strong>modifica<\/strong> su valor; a una clave nueva, la <strong>agrega<\/strong>.<\/li>\n<li><code>del dic[\"clave\"]<\/code> elimina un par.<\/li>\n<li><code>\"clave\" in dic<\/code> verifica si existe la clave.<\/li>\n<\/ul>","web":true,"c":"parcela = {\"nombre\": \"P-01\", \"area_ha\": 2.5}\nparcela[\"area_ha\"] = 2.8          # modifica\nparcela[\"pendiente\"] = 25         # agrega\nprint(parcela)\ndel parcela[\"pendiente\"]\nprint(\"pendiente\" in parcela)","ch":"<span class=\"n\">parcela<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"nombre\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"P-01\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">2.5<\/span><span class=\"p\">}<\/span>\n<span class=\"n\">parcela<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">2.8<\/span>          <span class=\"c1\"># modifica<\/span>\n<span class=\"n\">parcela<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"pendiente\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">25<\/span>         <span class=\"c1\"># agrega<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">parcela<\/span><span class=\"p\">)<\/span>\n<span class=\"k\">del<\/span> <span class=\"n\">parcela<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"pendiente\"<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"pendiente\"<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">parcela<\/span><span class=\"p\">)<\/span>\n","o":"{'nombre': 'P-01', 'area_ha': 2.8, 'pendiente': 25}\nFalse\n","e":null,"img":[],"in":"","err":false},{"t":"Recorrer un diccionario","h":"<ul>\n<li><code>.keys()<\/code> → claves, <code>.values()<\/code> → valores, <code>.items()<\/code> → pares (clave, valor).<\/li>\n<li>Lo más usado es recorrer con <code>.items()<\/code>.<\/li>\n<\/ul>","web":true,"c":"lluvia_mensual = {\"ene\": 45.2, \"feb\": 120.8, \"mar\": 210.5}\nfor mes, mm in lluvia_mensual.items():\n    print(f\"{mes}: {mm:>6.1f} mm\")\nprint(\"Total:\", sum(lluvia_mensual.values()))","ch":"<span class=\"n\">lluvia_mensual<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"ene\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">45.2<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"feb\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">120.8<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"mar\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">210.5<\/span><span class=\"p\">}<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">mes<\/span><span class=\"p\">,<\/span> <span class=\"n\">mm<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">lluvia_mensual<\/span><span class=\"o\">.<\/span><span class=\"n\">items<\/span><span class=\"p\">():<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"si\">{<\/span><span class=\"n\">mes<\/span><span class=\"si\">}<\/span><span class=\"s2\">: <\/span><span class=\"si\">{<\/span><span class=\"n\">mm<\/span><span class=\"si\">:<\/span><span class=\"s2\">&gt;6.1f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> mm\"<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Total:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">sum<\/span><span class=\"p\">(<\/span><span class=\"n\">lluvia_mensual<\/span><span class=\"o\">.<\/span><span class=\"n\">values<\/span><span class=\"p\">()))<\/span>\n","o":"ene:   45.2 mm\nfeb:  120.8 mm\nmar:  210.5 mm\nTotal: 376.5\n","e":null,"img":[],"in":"","err":false},{"t":"Una tabla: lista de diccionarios","h":"<p>Una lista de diccionarios equivale a una <strong>tabla<\/strong>: cada diccionario es una <strong>fila<\/strong> y cada clave una <strong>columna<\/strong>. Esta estructura es el puente hacia los archivos CSV (Módulo 11) y pandas (Módulo 13).<\/p>\n<p><em>Datos ficticios de ejemplo.<\/em><\/p>","web":true,"c":"parcelas = [\n    {\"id\": \"P-01\", \"area_ha\": 2.5, \"especie\": \"Algarrobo\"},\n    {\"id\": \"P-02\", \"area_ha\": 1.8, \"especie\": \"Faique\"},\n    {\"id\": \"P-03\", \"area_ha\": 3.2, \"especie\": \"Algarrobo\"},\n]\ntotal = 0\nfor p in parcelas:\n    print(p[\"id\"], p[\"area_ha\"])\n    total += p[\"area_ha\"]\nprint(\"Área total:\", round(total, 2), \"ha\")","ch":"<span class=\"n\">parcelas<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"P-01\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">2.5<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"especie\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">},<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"P-02\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">1.8<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"especie\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">},<\/span>\n    <span class=\"p\">{<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"P-03\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">:<\/span> <span class=\"mf\">3.2<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"especie\"<\/span><span class=\"p\">:<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">},<\/span>\n<span class=\"p\">]<\/span>\n<span class=\"n\">total<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">p<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">parcelas<\/span><span class=\"p\">:<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">p<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"id\"<\/span><span class=\"p\">],<\/span> <span class=\"n\">p<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">])<\/span>\n    <span class=\"n\">total<\/span> <span class=\"o\">+=<\/span> <span class=\"n\">p<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"Área total:\"<\/span><span class=\"p\">,<\/span> <span class=\"nb\">round<\/span><span class=\"p\">(<\/span><span class=\"n\">total<\/span><span class=\"p\">,<\/span> <span class=\"mi\">2<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"ha\"<\/span><span class=\"p\">)<\/span>\n","o":"P-01 2.5\nP-02 1.8\nP-03 3.2\nÁrea total: 7.5 ha\n","e":null,"img":[],"in":"","err":false},{"t":"Contar frecuencias","h":"<p>Un diccionario es ideal para contar cuántas veces aparece cada valor. Patrón: <code>conteo[x] = conteo.get(x, 0) + 1<\/code>.<\/p>","web":true,"c":"registros = [\"Algarrobo\", \"Faique\", \"Algarrobo\", \"Hualtaco\", \"Algarrobo\", \"Faique\"]\nconteo = {}\nfor especie in registros:\n    conteo[especie] = conteo.get(especie, 0) + 1\nprint(conteo)","ch":"<span class=\"n\">registros<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Hualtaco\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">conteo<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{}<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">especie<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">registros<\/span><span class=\"p\">:<\/span>\n    <span class=\"n\">conteo<\/span><span class=\"p\">[<\/span><span class=\"n\">especie<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">conteo<\/span><span class=\"o\">.<\/span><span class=\"n\">get<\/span><span class=\"p\">(<\/span><span class=\"n\">especie<\/span><span class=\"p\">,<\/span> <span class=\"mi\">0<\/span><span class=\"p\">)<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">1<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">conteo<\/span><span class=\"p\">)<\/span>\n","o":"{'Algarrobo': 3, 'Faique': 2, 'Hualtaco': 1}\n","e":null,"img":[],"in":"","err":false},{"t":"Conjuntos (set)","h":"<p>Un <strong>conjunto<\/strong> guarda valores <strong>sin repetir y sin orden<\/strong>. Útil para obtener valores únicos y comparar grupos:<\/p>\n<ul>\n<li><strong>Unión<\/strong> <code>a | b<\/code>: elementos en a o en b.<\/li>\n<li><strong>Intersección<\/strong> <code>a &amp; b<\/code>: elementos presentes en ambos.<\/li>\n<li><strong>Diferencia<\/strong> <code>a - b<\/code>: elementos en a pero no en b.<\/li>\n<\/ul>","web":true,"c":"parcela_1 = {\"Algarrobo\", \"Faique\", \"Hualtaco\"}\nparcela_2 = {\"Algarrobo\", \"Palo santo\", \"Faique\"}\nprint(\"En ambas:\", sorted(parcela_1 & parcela_2))\nprint(\"Solo en la 1:\", sorted(parcela_1 - parcela_2))\nprint(\"Todas:\", sorted(parcela_1 | parcela_2))\nprint(set([1, 1, 2, 3, 3]))","ch":"<span class=\"n\">parcela_1<\/span> <span cla

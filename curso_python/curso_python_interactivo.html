pan> <span class=\"o\">=<\/span> <span class=\"n\">pd<\/span><span class=\"o\">.<\/span><span class=\"n\">DataFrame<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"especie\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Algarrobo\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"Faique\"<\/span><span class=\"p\">],<\/span>\n    <span class=\"s2\">\"dap_cm\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"mi\">30<\/span><span class=\"p\">,<\/span> <span class=\"mi\">18<\/span><span class=\"p\">,<\/span> <span class=\"mi\">40<\/span><span class=\"p\">,<\/span> <span class=\"mi\">22<\/span><span class=\"p\">],<\/span>\n<span class=\"p\">})<\/span>\n<span class=\"n\">medias<\/span> <span class=\"o\">=<\/span> <span class=\"n\">df<\/span><span class=\"o\">.<\/span><span class=\"n\">groupby<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"especie\"<\/span><span class=\"p\">)[<\/span><span class=\"s2\">\"dap_cm\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">mean<\/span><span class=\"p\">()<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">medias<\/span><span class=\"p\">)<\/span>\n","so":"especie\nAlgarrobo    35.0\nFaique       20.0\nName: dap_cm, dtype: float64\n","test":"assert medias[\"Algarrobo\"] == 35 and medias[\"Faique\"] == 20, \"Revise el agrupamiento.\"","web":false},{"id":"M13-E4","t":"Columna calculada","n":2,"h":"<p>Agregue la columna <code>densidad<\/code> (árboles / área) y guarde en <code>max_parcela<\/code> el nombre de la parcela con mayor densidad.<\/p>","p":"import pandas as pd\n\ndf = pd.DataFrame({\n    \"parcela\": [\"P-01\", \"P-02\", \"P-03\"],\n    \"arboles\": [45, 38, 52],\n    \"area_ha\": [0.5, 0.25, 0.8],\n})\nmax_parcela = \"\"\nprint(df)\nprint(max_parcela)","pista":"<p><code>df[\"densidad\"] = df[\"arboles\"] / df[\"area_ha\"]<\/code>; luego <code>df.loc[df[\"densidad\"].idxmax(), \"parcela\"]<\/code>.<\/p>","s":"import pandas as pd\n\ndf = pd.DataFrame({\n    \"parcela\": [\"P-01\", \"P-02\", \"P-03\"],\n    \"arboles\": [45, 38, 52],\n    \"area_ha\": [0.5, 0.25, 0.8],\n})\ndf[\"densidad\"] = df[\"arboles\"] / df[\"area_ha\"]\nmax_parcela = df.loc[df[\"densidad\"].idxmax(), \"parcela\"]\nprint(df)\nprint(max_parcela)","sh":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">pandas<\/span><span class=\"w\"> <\/span><span class=\"k\">as<\/span><span class=\"w\"> <\/span><span class=\"nn\">pd<\/span>\n\n<span class=\"n\">df<\/span> <span class=\"o\">=<\/span> <span class=\"n\">pd<\/span><span class=\"o\">.<\/span><span class=\"n\">DataFrame<\/span><span class=\"p\">({<\/span>\n    <span class=\"s2\">\"parcela\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"s2\">\"P-01\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"P-02\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"P-03\"<\/span><span class=\"p\">],<\/span>\n    <span class=\"s2\">\"arboles\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"mi\">45<\/span><span class=\"p\">,<\/span> <span class=\"mi\">38<\/span><span class=\"p\">,<\/span> <span class=\"mi\">52<\/span><span class=\"p\">],<\/span>\n    <span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">[<\/span><span class=\"mf\">0.5<\/span><span class=\"p\">,<\/span> <span class=\"mf\">0.25<\/span><span class=\"p\">,<\/span> <span class=\"mf\">0.8<\/span><span class=\"p\">],<\/span>\n<span class=\"p\">})<\/span>\n<span class=\"n\">df<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"densidad\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">=<\/span> <span class=\"n\">df<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"arboles\"<\/span><span class=\"p\">]<\/span> <span class=\"o\">/<\/span> <span class=\"n\">df<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"area_ha\"<\/span><span class=\"p\">]<\/span>\n<span class=\"n\">max_parcela<\/span> <span class=\"o\">=<\/span> <span class=\"n\">df<\/span><span class=\"o\">.<\/span><span class=\"n\">loc<\/span><span class=\"p\">[<\/span><span class=\"n\">df<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"densidad\"<\/span><span class=\"p\">]<\/span><span class=\"o\">.<\/span><span class=\"n\">idxmax<\/span><span class=\"p\">(),<\/span> <span class=\"s2\">\"parcela\"<\/span><span class=\"p\">]<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">df<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"n\">max_parcela<\/span><span class=\"p\">)<\/span>\n","so":"  parcela  arboles  area_ha  densidad\n0    P-01       45     0.50      90.0\n1    P-02       38     0.25     152.0\n2    P-03       52     0.80      65.0\nP-02\n","test":"assert \"densidad\" in df.columns, \"Falta la columna densidad.\"\nassert list(df[\"densidad\"]) == [90.0, 152.0, 65.0], \"Revise el cálculo de densidad.\"\nassert max_parcela == \"P-02\", f\"Se esperaba 'P-02'; se obtuvo {max_parcela!r}.\"","web":false}],"quiz":[{"q":"¿Qué ventaja tiene NumPy frente a una lista con bucle?","o":["Ninguna","Opera sobre todos los elementos a la vez y es más rápido","Solo guarda textos","No requiere importarse"],"c":1,"x":"Las operaciones vectorizadas evitan bucles y son mucho más rápidas."},{"q":"¿Cómo se filtran las filas con dap_cm mayor a 30?","o":["df.dap_cm > 30","df[df[\"dap_cm\"] > 30]","df.filter(30)","df[30]"],"c":1,"x":"La condición se coloca dentro de df[...] para seleccionar filas."},{"q":"¿A qué herramienta de Excel equivale groupby?","o":["Buscarv","Tabla dinámica","Formato condicional","Gráfico"],"c":1,"x":"groupby agrupa y resume, como una tabla dinámica."},{"q":"¿Qué paquete adicional necesita pandas para guardar en Excel (.xlsx)?","o":["numpy","openpyxl","matplotlib","json"],"c":1,"x":"to_excel usa openpyxl como motor para .xlsx."}],"glos":[{"t":"NumPy","d":"Paquete para cálculo numérico con arreglos (arrays)."},{"t":"Vectorización","d":"Aplicar una operación a todos los elementos sin bucles explícitos."},{"t":"pandas","d":"Paquete para manejar tablas de datos (DataFrame)."},{"t":"DataFrame","d":"Tabla de pandas con filas y columnas con nombre."},{"t":"groupby","d":"Operación de agrupamiento y resumen por categorías."},{"t":"matplotlib","d":"Paquete para elaborar gráficos."}],"nb":"M13_analisis_de_datos_pandas.ipynb"},{"id":"M14","n":14,"t":"Python aplicado a SIG y proyecto integrador","dur":"4 h","obj":["Diferenciar coordenadas geográficas y UTM.","Convertir coordenadas a UTM WGS84 Zona 17S (EPSG:32717) con pyproj.","Calcular distancias, perímetros y áreas a partir de coordenadas UTM.","Integrar lo aprendido en un pequeño procesador de inventario."],"web":true,"lec":[{"t":"Coordenadas geográficas y UTM","h":"<ul>\n<li><strong>Geográficas (EPSG:4326, WGS84):<\/strong> latitud y longitud en grados. En el Perú la latitud es negativa (hemisferio sur) y la longitud también (oeste).<\/li>\n<li><strong>UTM (EPSG:32717, WGS84 Zona 17S):<\/strong> Este y Norte en <strong>metros<\/strong>. Permite medir distancias y áreas directamente con geometría plana.<\/li>\n<\/ul>\n<p>Para calcular distancias o áreas, primero convierta a UTM. El orden de los ejes importa: con <code>always_xy=True<\/code>, pyproj recibe <strong>(longitud, latitud)<\/strong> y devuelve <strong>(Este, Norte)<\/strong>.<\/p>","web":true},{"t":"Convertir coordenadas con pyproj","h":"<p><code>pyproj<\/code> es el paquete estándar para transformar coordenadas (lo usan QGIS y geopandas internamente). Requiere instalación (<code>%pip install pyproj<\/code>), por lo que este ejemplo <strong>solo se ejecuta en Jupyter o Colab<\/strong>.<\/p>\n<p><em>Los puntos son de ejemplo.<\/em><\/p>","web":false,"c":"from pyproj import Transformer\n\na_utm = Transformer.from_crs(\"EPSG:4326\", \"EPSG:32717\", always_xy=True)\n\npuntos = {\"Punto 1\": (-80.63, -5.20), \"Punto 2\": (-79.97, -5.09)}  # (lon, lat)\nfor nombre, (lon, lat) in puntos.items():\n    este, norte = a_utm.transform(lon, lat)\n    print(f\"{nombre}: E = {este:,.1f} m   N = {norte:,.1f} m\")\n\n# Conversión inversa: UTM -> geográficas\na_geo = Transformer.from_crs(\"EPSG:32717\", \"EPSG:4326\", always_xy=True)\nlon, lat = a_geo.transform(540000, 9425000)\nprint(f\"lon = {lon:.6f}, lat = {lat:.6f}\")","ch":"<span class=\"kn\">from<\/span><span class=\"w\"> <\/span><span class=\"nn\">pyproj<\/span><span class=\"w\"> <\/span><span class=\"kn\">import<\/span> <span class=\"n\">Transformer<\/span>\n\n<span class=\"n\">a_utm<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Transformer<\/span><span class=\"o\">.<\/span><span class=\"n\">from_crs<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"EPSG:4326\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"EPSG:32717\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">always_xy<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span>\n\n<span class=\"n\">puntos<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{<\/span><span class=\"s2\">\"Punto 1\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">(<\/span><span class=\"o\">-<\/span><span class=\"mf\">80.63<\/span><span class=\"p\">,<\/span> <span class=\"o\">-<\/span><span class=\"mf\">5.20<\/span><span class=\"p\">),<\/span> <span class=\"s2\">\"Punto 2\"<\/span><span class=\"p\">:<\/span> <span class=\"p\">(<\/span><span class=\"o\">-<\/span><span class=\"mf\">79.97<\/span><span class=\"p\">,<\/span> <span class=\"o\">-<\/span><span class=\"mf\">5.09<\/span><span class=\"p\">)}<\/span>  <span class=\"c1\"># (lon, lat)<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">nombre<\/span><span class=\"p\">,<\/span> <span class=\"p\">(<\/span><span class=\"n\">lon<\/span><span class=\"p\">,<\/span> <span class=\"n\">lat<\/span><span class=\"p\">)<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">puntos<\/span><span class=\"o\">.<\/span><span class=\"n\">items<\/span><span class=\"p\">():<\/span>\n    <span class=\"n\">este<\/span><span class=\"p\">,<\/span> <span class=\"n\">norte<\/span> <span class=\"o\">=<\/span> <span class=\"n\">a_utm<\/span><span class=\"o\">.<\/span><span class=\"n\">transform<\/span><span class=\"p\">(<\/span><span class=\"n\">lon<\/span><span class=\"p\">,<\/span> <span class=\"n\">lat<\/span><span class=\"p\">)<\/span>\n    <span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"<\/span><span class=\"si\">{<\/span><span class=\"n\">nombre<\/span><span class=\"si\">}<\/span><span class=\"s2\">: E = <\/span><span class=\"si\">{<\/span><span class=\"n\">este<\/span><span class=\"si\">:<\/span><span class=\"s2\">,.1f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> m   N = <\/span><span class=\"si\">{<\/span><span class=\"n\">norte<\/span><span class=\"si\">:<\/span><span class=\"s2\">,.1f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> m\"<\/span><span class=\"p\">)<\/span>\n\n<span class=\"c1\"># Conversión inversa: UTM -&gt; geográficas<\/span>\n<span class=\"n\">a_geo<\/span> <span class=\"o\">=<\/span> <span class=\"n\">Transformer<\/span><span class=\"o\">.<\/span><span class=\"n\">from_crs<\/span><span class=\"p\">(<\/span><span class=\"s2\">\"EPSG:32717\"<\/span><span class=\"p\">,<\/span> <span class=\"s2\">\"EPSG:4326\"<\/span><span class=\"p\">,<\/span> <span class=\"n\">always_xy<\/span><span class=\"o\">=<\/span><span class=\"kc\">True<\/span><span class=\"p\">)<\/span>\n<span class=\"n\">lon<\/span><span class=\"p\">,<\/span> <span class=\"n\">lat<\/span> <span class=\"o\">=<\/span> <span class=\"n\">a_geo<\/span><span class=\"o\">.<\/span><span class=\"n\">transform<\/span><span class=\"p\">(<\/span><span class=\"mi\">540000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425000<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"lon = <\/span><span class=\"si\">{<\/span><span class=\"n\">lon<\/span><span class=\"si\">:<\/span><span class=\"s2\">.6f<\/span><span class=\"si\">}<\/span><span class=\"s2\">, lat = <\/span><span class=\"si\">{<\/span><span class=\"n\">lat<\/span><span class=\"si\">:<\/span><span class=\"s2\">.6f<\/span><span class=\"si\">}<\/span><span class=\"s2\">\"<\/span><span class=\"p\">)<\/span>\n","o":"Punto 1: E = 541,003.7 m   N = 9,425,215.9 m\nPunto 2: E = 614,170.3 m   N = 9,437,296.2 m\nlon = -80.639056, lat = -5.201959\n","e":null,"img":[],"in":"","err":false},{"t":"Distancia y perímetro en UTM","h":"<p>En UTM la distancia entre dos puntos es la <strong>distancia euclidiana<\/strong> (Pitágoras). <code>math.dist(p1, p2)<\/code> la calcula directamente. El perímetro de un polígono es la suma de las distancias entre vértices consecutivos, cerrando con el primero.<\/p>","web":true,"c":"import math\n\nvertices = [(540000, 9425000), (540200, 9425000), (540200, 9425150), (540000, 9425150)]\n\nperimetro = 0\nfor i in range(len(vertices)):\n    p1 = vertices[i]\n    p2 = vertices[(i + 1) % len(vertices)]   # el último se une con el primero\n    perimetro += math.dist(p1, p2)\nprint(f\"Perímetro: {perimetro:,.1f} m\")","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">math<\/span>\n\n<span class=\"n\">vertices<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[(<\/span><span class=\"mi\">540000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425000<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540200<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425000<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540200<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425150<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425150<\/span><span class=\"p\">)]<\/span>\n\n<span class=\"n\">perimetro<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>\n<span class=\"k\">for<\/span> <span class=\"n\">i<\/span> <span class=\"ow\">in<\/span> <span class=\"nb\">range<\/span><span class=\"p\">(<\/span><span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">vertices<\/span><span class=\"p\">)):<\/span>\n    <span class=\"n\">p1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">vertices<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">]<\/span>\n    <span class=\"n\">p2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">vertices<\/span><span class=\"p\">[(<\/span><span class=\"n\">i<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span> <span class=\"o\">%<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">vertices<\/span><span class=\"p\">)]<\/span>   <span class=\"c1\"># el último se une con el primero<\/span>\n    <span class=\"n\">perimetro<\/span> <span class=\"o\">+=<\/span> <span class=\"n\">math<\/span><span class=\"o\">.<\/span><span class=\"n\">dist<\/span><span class=\"p\">(<\/span><span class=\"n\">p1<\/span><span class=\"p\">,<\/span> <span class=\"n\">p2<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Perímetro: <\/span><span class=\"si\">{<\/span><span class=\"n\">perimetro<\/span><span class=\"si\">:<\/span><span class=\"s2\">,.1f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> m\"<\/span><span class=\"p\">)<\/span>\n","o":"Perímetro: 700.0 m\n","e":null,"img":[],"in":"","err":false},{"t":"Área de un polígono (fórmula del zapatero)","h":"<p>Con los vértices en UTM, el área de un polígono simple se obtiene con la <strong>fórmula del zapatero (shoelace)<\/strong>:<\/p>\n<p>Área = ½ · |Σ (xᵢ · yᵢ₊₁ − xᵢ₊₁ · yᵢ)|<\/p>\n<p>Los vértices deben estar <strong>en orden<\/strong> (horario o antihorario) y el polígono no debe cruzarse a sí mismo.<\/p>","web":true,"c":"def area_poligono(vertices):\n    \"\"\"Área (m²) de un polígono simple con vértices UTM ordenados.\"\"\"\n    n = len(vertices)\n    suma = 0\n    for i in range(n):\n        x1, y1 = vertices[i]\n        x2, y2 = vertices[(i + 1) % n]\n        suma += x1 * y2 - x2 * y1\n    return abs(suma) / 2\n\nlote = [(540000, 9425000), (540200, 9425000), (540200, 9425150), (540000, 9425150)]\na = area_poligono(lote)\nprint(f\"Área: {a:,.0f} m2 = {a / 10000:.2f} ha\")","ch":"<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">area_poligono<\/span><span class=\"p\">(<\/span><span class=\"n\">vertices<\/span><span class=\"p\">):<\/span>\n<span class=\"w\">    <\/span><span class=\"sd\">\"\"\"Área (m²) de un polígono simple con vértices UTM ordenados.\"\"\"<\/span>\n    <span class=\"n\">n<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">len<\/span><span class=\"p\">(<\/span><span class=\"n\">vertices<\/span><span class=\"p\">)<\/span>\n    <span class=\"n\">suma<\/span> <span class=\"o\">=<\/span> <span class=\"mi\">0<\/span>\n    <span class=\"k\">for<\/span> <span class=\"n\">i<\/span> <span class=\"ow\">in<\/span> <span class=\"nb\">range<\/span><span class=\"p\">(<\/span><span class=\"n\">n<\/span><span class=\"p\">):<\/span>\n        <span class=\"n\">x1<\/span><span class=\"p\">,<\/span> <span class=\"n\">y1<\/span> <span class=\"o\">=<\/span> <span class=\"n\">vertices<\/span><span class=\"p\">[<\/span><span class=\"n\">i<\/span><span class=\"p\">]<\/span>\n        <span class=\"n\">x2<\/span><span class=\"p\">,<\/span> <span class=\"n\">y2<\/span> <span class=\"o\">=<\/span> <span class=\"n\">vertices<\/span><span class=\"p\">[(<\/span><span class=\"n\">i<\/span> <span class=\"o\">+<\/span> <span class=\"mi\">1<\/span><span class=\"p\">)<\/span> <span class=\"o\">%<\/span> <span class=\"n\">n<\/span><span class=\"p\">]<\/span>\n        <span class=\"n\">suma<\/span> <span class=\"o\">+=<\/span> <span class=\"n\">x1<\/span> <span class=\"o\">*<\/span> <span class=\"n\">y2<\/span> <span class=\"o\">-<\/span> <span class=\"n\">x2<\/span> <span class=\"o\">*<\/span> <span class=\"n\">y1<\/span>\n    <span class=\"k\">return<\/span> <span class=\"nb\">abs<\/span><span class=\"p\">(<\/span><span class=\"n\">suma<\/span><span class=\"p\">)<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">2<\/span>\n\n<span class=\"n\">lote<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[(<\/span><span class=\"mi\">540000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425000<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540200<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425000<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540200<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425150<\/span><span class=\"p\">),<\/span> <span class=\"p\">(<\/span><span class=\"mi\">540000<\/span><span class=\"p\">,<\/span> <span class=\"mi\">9425150<\/span><span class=\"p\">)]<\/span>\n<span class=\"n\">a<\/span> <span class=\"o\">=<\/span> <span class=\"n\">area_poligono<\/span><span class=\"p\">(<\/span><span class=\"n\">lote<\/span><span class=\"p\">)<\/span>\n<span class=\"nb\">print<\/span><span class=\"p\">(<\/span><span class=\"sa\">f<\/span><span class=\"s2\">\"Área: <\/span><span class=\"si\">{<\/span><span class=\"n\">a<\/span><span class=\"si\">:<\/span><span class=\"s2\">,.0f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> m2 = <\/span><span class=\"si\">{<\/span><span class=\"n\">a<\/span><span class=\"w\"> <\/span><span class=\"o\">/<\/span><span class=\"w\"> <\/span><span class=\"mi\">10000<\/span><span class=\"si\">:<\/span><span class=\"s2\">.2f<\/span><span class=\"si\">}<\/span><span class=\"s2\"> ha\"<\/span><span class=\"p\">)<\/span>\n","o":"Área: 30,000 m2 = 3.00 ha\n","e":null,"img":[],"in":"","err":false},{"t":"Ecosistema de Python para SIG","h":"<table>\n<thead>\n<tr>\n<th>Paquete<\/th>\n<th>Uso<\/th>\n<th>Ejemplo de tarea<\/th>\n<\/tr>\n<\/thead>\n<tbody>\n<tr>\n<td><strong>pyproj<\/strong><\/td>\n<td>Sistemas de referencia<\/td>\n<td>Convertir lat/lon a UTM 17S<\/td>\n<\/tr>\n<tr>\n<td><strong>shapely<\/strong><\/td>\n<td>Geometrías<\/td>\n<td>Áreas, buffers, intersecciones<\/td>\n<\/tr>\n<tr>\n<td><strong>geopandas<\/strong><\/td>\n<td>Capas vectoriales como tablas<\/td>\n<td>Leer shapefile/GeoPackage, <code>to_crs(32717)<\/code><\/td>\n<\/tr>\n<tr>\n<td><strong>rasterio<\/strong><\/td>\n<td>Rásteres<\/td>\n<td>Leer un DEM o un índice (NDVI, MSAVI)<\/td>\n<\/tr>\n<tr>\n<td><strong>PyQGIS<\/strong><\/td>\n<td>Automatizar QGIS<\/td>\n<td>Procesos por lotes en la consola de QGIS<\/td>\n<\/tr>\n<tr>\n<td><strong>openpyxl<\/strong><\/td>\n<td>Excel<\/td>\n<td>Reportes con formato<\/td>\n<\/tr>\n<\/tbody>\n<\/table>\n<p>Ruta sugerida después de este curso: geopandas → rasterio → PyQGIS.<\/p>","web":true},{"t":"Proyecto integrador: procesador de inventario","h":"<p>Este programa reúne lo aprendido: <strong>lectura de CSV<\/strong> (M11), <strong>funciones<\/strong> (M09), <strong>diccionarios<\/strong> (M08), <strong>control de errores<\/strong> (M10) y <strong>f-strings<\/strong> (M04). Lee un inventario, valida los datos, calcula área basal y volumen y emite un resumen por especie.<\/p>\n<p><strong>Reto final:<\/strong> adáptelo para (1) leer un archivo real con <code>open()<\/code>, (2) exportar el resumen a CSV, y (3) rehacerlo con pandas (M13).<\/p>\n<p><em>Datos ficticios; ff = 0.5 supuesto.<\/em><\/p>","web":true,"c":"import csv\nimport io\nimport math\n\nDATOS = \"\"\"codigo,especie,dap_cm,altura_m\nA-01,Algarrobo,32.5,9.0\nA-02,Faique,18.0,6.5\nA-03,Algarrobo,45.2,11.0\nA-04,Hualtaco,22.7,8.2\nA-05,Faique,abc,7.0\nA-06,Algarrobo,38.1,10.4\n\"\"\"\nFF = 0.5   # factor de forma supuesto\n\ndef area_basal(dap_cm):\n    return math.pi / 4 * (dap_cm / 100) ** 2\n\ndef procesar(texto_csv):\n    resumen = {}\n    observados = []\n    for fila in csv.DictReader(io.StringIO(texto_csv)):\n        try:\n            dap = float(fila[\"dap_cm\"])\n            alt = float(fila[\"altura_m\"])\n        except ValueError:\n            observados.append(fila[\"codigo\"])\n            continue\n        ab = area_basal(dap)\n        r = resumen.setdefault(fila[\"especie\"], {\"n\": 0, \"ab\": 0.0, \"vol\": 0.0})\n        r[\"n\"] += 1\n        r[\"ab\"] += ab\n        r[\"vol\"] += ab * alt * FF\n    return resumen, observados\n\nresumen, observados = procesar(DATOS)\nprint(f\"{'Especie':<12}{'N':>4}{'AB (m2)':>10}{'Vol (m3)':>10}\")\nfor especie, r in sorted(resumen.items()):\n    print(f\"{especie:<12}{r['n']:>4}{r['ab']:>10.4f}{r['vol']:>10.4f}\")\nprint(\"Registros por verificar:\", observados)","ch":"<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">csv<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">io<\/span>\n<span class=\"kn\">import<\/span><span class=\"w\"> <\/span><span class=\"nn\">math<\/span>\n\n<span class=\"n\">DATOS<\/span> <span class=\"o\">=<\/span> <span class=\"s2\">\"\"\"codigo,especie,dap_cm,altura_m<\/span>\n<span class=\"s2\">A-01,Algarrobo,32.5,9.0<\/span>\n<span class=\"s2\">A-02,Faique,18.0,6.5<\/span>\n<span class=\"s2\">A-03,Algarrobo,45.2,11.0<\/span>\n<span class=\"s2\">A-04,Hualtaco,22.7,8.2<\/span>\n<span class=\"s2\">A-05,Faique,abc,7.0<\/span>\n<span class=\"s2\">A-06,Algarrobo,38.1,10.4<\/span>\n<span class=\"s2\">\"\"\"<\/span>\n<span class=\"n\">FF<\/span> <span class=\"o\">=<\/span> <span class=\"mf\">0.5<\/span>   <span class=\"c1\"># factor de forma supuesto<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">area_basal<\/span><span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span><span class=\"p\">):<\/span>\n    <span class=\"k\">return<\/span> <span class=\"n\">math<\/span><span class=\"o\">.<\/span><span class=\"n\">pi<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">4<\/span> <span class=\"o\">*<\/span> <span class=\"p\">(<\/span><span class=\"n\">dap_cm<\/span> <span class=\"o\">/<\/span> <span class=\"mi\">100<\/span><span class=\"p\">)<\/span> <span class=\"o\">**<\/span> <span class=\"mi\">2<\/span>\n\n<span class=\"k\">def<\/span><span class=\"w\"> <\/span><span class=\"nf\">procesar<\/span><span class=\"p\">(<\/span><span class=\"n\">texto_csv<\/span><span class=\"p\">):<\/span>\n    <span class=\"n\">resumen<\/span> <span class=\"o\">=<\/span> <span class=\"p\">{}<\/span>\n    <span class=\"n\">observados<\/span> <span class=\"o\">=<\/span> <span class=\"p\">[]<\/span>\n    <span class=\"k\">for<\/span> <span class=\"n\">fila<\/span> <span class=\"ow\">in<\/span> <span class=\"n\">csv<\/span><span class=\"o\">.<\/span><span class=\"n\">DictReader<\/span><span class=\"p\">(<\/span><span class=\"n\">io<\/span><span class=\"o\">.<\/span><span class=\"n\">StringIO<\/span><span class=\"p\">(<\/span><span class=\"n\">texto_csv<\/span><span class=\"p\">)):<\/span>\n        <span class=\"k\">try<\/span><span class=\"p\">:<\/span>\n            <span class=\"n\">dap<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">fila<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"dap_cm\"<\/span><span class=\"p\">])<\/span>\n            <span class=\"n\">alt<\/span> <span class=\"o\">=<\/span> <span class=\"nb\">float<\/span><span class=\"p\">(<\/span><span class=\"n\">fila<\/span><span class=\"p\">[<\/span><span class=\"s2\">\"altura_m\"<\/span><span class=\"p\">])<\/span>\n        <span class=\"k\">except<\/span> <span class=\"ne\">ValueError<\/span><span class=\"p\">:<\/span>\n            <span class=\"n\" const RUNNER_PY = "# Ejecutor de Python (Brython) que corre dentro de un Web Worker del curso interactivo.\nimport sys\nimport json\nimport traceback\nfrom browser import self as _worker\n\n\nclass _Salida:\n    def __init__(self):\n        self.buf = []\n\n    def write(self, s):\n        self.buf.append(str(s))\n\n    def flush(self):\n        pass\n\n\ndef _formatear_error(e):\n    nombre = type(e).__name__\n    linea = getattr(e, \"lineno\", None)\n    if linea is None:\n        try:\n            for fr in traceback.extract_tb(e.__traceback__):\n                if fr.filename == \"<celda>\":\n                    linea = fr.lineno\n        except Exception:\n            pass\n    msg = str(e)\n    if isinstance(e, SyntaxError) and getattr(e, \"msg\", None):\n        msg = e.msg\n    prefijo = f\"L\u00ednea {linea}: \" if linea else \"\"\n    return f\"{prefijo}{nombre}: {msg}\"\n\n\ndef py_run(src, entrada, prueba):\n    salida = _Salida()\n    anterior = (sys.stdout, sys.stderr)\n    sys.stdout = salida\n    sys.stderr = salida\n    lineas = entrada.split(\"\\n\") if entrada else []\n\n    def _input(mensaje=\"\"):\n        salida.write(str(mensaje))\n        if not lineas:\n            raise EOFError(\"no hay m\u00e1s datos en el cuadro Entrada\")\n        valor = lineas.pop(0)\n        salida.write(valor + \"\\n\")\n        return valor\n\n    ns = {\"__name__\": \"__main__\", \"input\": _input}\n    res = {\"ok\": True, \"error\": None, \"test\": None, \"test_msg\": None}\n    try:\n        exec(compile(src, \"<celda>\", \"exec\"), ns)\n    except BaseException as e:\n        res[\"ok\"] = False\n        res[\"error\"] = _formatear_error(e)\n    if res[\"ok\"] and prueba:\n        try:\n            exec(compile(prueba, \"<prueba>\", \"exec\"), ns)\n            res[\"test\"] = True\n        except AssertionError as e:\n            res[\"test\"] = False\n            res[\"test_msg\"] = str(e) or \"Una comprobaci\u00f3n no se cumpli\u00f3.\"\n        except BaseException as e:\n            res[\"test\"] = False\n            res[\"test_msg\"] = _formatear_error(e)\n    sys.stdout, sys.stderr = anterior\n    res[\"out\"] = \"\".join(salida.buf)\n    return json.dumps(res)\n\n\n_worker.pyRun = py_run\n";

/* ---------------- Motor de Python (Brython en un Web Worker) ---------------- */
const Py = {
  estado: "off", worker: null, cola: [], actual: null, tReady: null,
  iniciar() {
    if (this.worker) { try { this.worker.terminate(); } catch (e) {} }
    this.fijar("loading");
    const src = `importScripts(${JSON.stringify(BRYTHON_URL + "brython.min.js")}, ${JSON.stringify(BRYTHON_URL + "brython_stdlib.js")});
__BRYTHON__.curdir = "/";
try { __BRYTHON__.runPythonSource(${JSON.stringify(RUNNER_PY)}, {name: "ejecutor"}); postMessage({tipo: "listo", ok: typeof self.pyRun === "function"}); }
catch (e) { postMessage({tipo: "listo", ok: false, err: String(e)}); }
onmessage = ev => { const d = ev.data; let r;
  try { r = self.pyRun(d.src, d.entrada || "", d.prueba || ""); }
  catch (e) { r = JSON.stringify({ok: false, error: String(e && e.message || e), out: ""}); }
  postMessage({tipo: "res", res: r}); };`;
    try {
      const url = URL.createObjectURL(new Blob([src], {type: "text/javascript;charset=utf-8"}));
      const w = new Worker(url);
      this.worker = w;
      w.onmessage = ev => this.mensaje(ev.data);
      w.onerror = ev => { ev.preventDefault && ev.preventDefault(); if (this.estado === "loading") this.fallo(); };
      clearTimeout(this.tReady);
      this.tReady = setTimeout(() => { if (this.estado === "loading") this.fallo(); }, 60000);
    } catch (e) { this.fallo(); }
  },
  fallo() {
    this.fijar("error");
    this.cola.splice(0).forEach(t => t.resolver({ok: false, sinMotor: true}));
  },
  mensaje(d) {
    if (d.tipo === "listo") { clearTimeout(this.tReady); if (d.ok) { this.fijar("ready"); this.siguiente(); } else this.fallo(); return; }
    if (d.tipo === "res" && this.actual) {
      clearTimeout(this.actual.timer);
      let r; try { r = JSON.parse(d.res); } catch (e) { r = {ok: false, error: String(d.res), out: ""}; }
      const t = this.actual; this.actual = null; t.resolver(r); this.siguiente();
    }
  },
  ejecutar(src, entrada, prueba) {
    return new Promise(resolver => {
      if (this.estado === "error") { resolver({ok: false, sinMotor: true}); return; }
      this.cola.push({src, entrada, prueba, resolver});
      this.siguiente();
    });
  },
  siguiente() {
    if (this.estado !== "ready" || this.actual || !this.cola.length) return;
    const t = this.actual = this.cola.shift();
    t.timer = setTimeout(() => {
      this.actual = null;
      t.resolver({ok: false, error: `El programa superó ${TIEMPO_MAX_MS / 1000} segundos y se detuvo. ¿Hay un bucle que nunca termina (por ejemplo, un while cuya condición siempre es verdadera)?`, out: "", detenido: true});
      this.iniciar();
    }, TIEMPO_MAX_MS);
    this.worker.postMessage({src: t.src, entrada: t.entrada, prueba: t.prueba});
  },
  fijar(s) {
    this.estado = s;
    const el = document.getElementById("estadoPy");
    el.dataset.s = s;
    el.textContent = s === "ready" ? "Python: listo" : s === "error" ? "Python: no disponible" : "Python: cargando…";
    el.title = s === "error" ? "No se pudo cargar el intérprete en este navegador. Use los cuadernos Jupyter o Google Colab." : "Python se ejecuta dentro de su navegador (Brython).";

async function copiar(texto, boton) {
  const prev = boton.textContent;
  try { await navigator.clipboard.writeText(texto); boton.textContent = "Copiado"; }
  catch (e) { boton.textContent = "Seleccione y copie (Ctrl+C)"; }
  setTimeout(() => (boton.textContent = prev), 1600);
}
function prepararEditor(ta, alEjecutar) {
  let salirConTab = false;
  ta.addEventListener("keydown", ev => {
    if (ev.key === "Escape") { salirConTab = true; return; }
    if ((ev.ctrlKey || ev.metaKey) && ev.key === "Enter") { ev.preventDefault(); alEjecutar(); return; }
    if (ev.key === "Tab" && !ev.shiftKey && !salirConTab) {
      ev.preventDefault(); ta.setRangeText("    ", ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input")); return;
    }
    if (ev.key === "Enter" && !ev.ctrlKey && !ev.metaKey) {
      const ini = ta.value.lastIndexOf("\n", ta.selectionStart - 1) + 1;
      const linea = ta.value.slice(ini, ta.selectionStart);
      let sangria = (linea.match(/^ */) || [""])[0];
      if (/:\s*(#.*)?$/.test(linea)) sangria += "    ";
      ev.preventDefault(); ta.setRangeText("\n" + sangria, ta.selectionStart, ta.selectionEnd, "end"); ta.dispatchEvent(new Event("input"));
    }
    salirConTab = false;
  });
  const ajustar = () => { ta.style.height = "auto"; ta.style.height = Math.max(120, ta.scrollHeight + 4) + "px"; };
  ta.addEventListener("input", ajustar);
  requestAnimationFrame(ajustar);
}

  if (r.out) caja.appendChild(h(`<pre>${esc(r.out)}</pre>`));

}

    </div>

function bloqueLeccion(m, l, i) {
  const art = h(`<article class="leccion"><h3><span class="num">${m.n}.${i + 1}</span>${esc(l.t)}</h3><div class="prosa">${l.h}</div></article>`);
  if (l.c !== undefined) {
    const puede = l.web;
    const cod = h(`<div class="codigo">
      <div class="codigo-barra"><span class="etq">Ejemplo</span>${puede ? "" : `<span class="solo-jupyter">Solo en Jupyter / Colab</span>`}
        <span class="acciones"><button class="btn" data-a="copiar">Copiar</button>${puede ? `<button class="btn" data-a="editar">Modificar</button><button class="btn prim" data-a="ejecutar">▶ Ejecutar</button>` : ""}</span></div>
      <pre class="resaltado"><code>${l.ch}</code></pre>
      <textarea class="editor" hidden spellcheck="false" aria-label="Editor del ejemplo"></textarea>
      ${l.in ? `<div class="entrada-box"><label>Entrada: lo que el usuario escribiría (una respuesta por línea)</label><textarea class="entrada" spellcheck="false">${esc(l.in)}</textarea></div>` : ""}
      <div class="salida">${salidaEsperada(l)}</div>
    </div>`);
    const ta = cod.querySelector(".editor"), pre = cod.querySelector("pre.resaltado"), sal = cod.querySelector(".salida");
    ta.value = l.c;
    const fuente = () => (ta.hidden ? l.c : ta.value);
    const ejecutar = async () => {
      const b = cod.querySelector('[data-a="ejecutar"]');
      b.disabled = true; b.textContent = Py.estado === "ready" ? "Ejecutando…" : "Cargando Python…";
      const ent = cod.querySelector(".entrada");
      const r = await Py.ejecutar(fuente(), ent ? ent.value : "", "");
      pintarSalida(sal, r, "Resultado");
      b.disabled = false; b.textContent = "▶ Ejecutar";
    };
    cod.querySelector('[data-a="copiar"]').addEventListener("click", ev => copiar(fuente(), ev.currentTarget));
    if (puede) {
      cod.querySelector('[data-a="ejecutar"]').addEventListener("click", ejecutar);
      cod.querySelector('[data-a="editar"]').addEventListener("click", ev => {
        const editando = !ta.hidden;
        if (editando) { ta.value = l.c; ta.hidden = true; pre.hidden = false; ev.currentTarget.textContent = "Modificar"; sal.innerHTML = salidaEsperada(l); }
        else { ta.hidden = false; pre.hidden = true; ev.currentTarget.textContent = "Restaurar original"; ta.focus(); }
      });
      prepararEditor(ta, ejecutar);
    }
    art.appendChild(cod);
  }
  return art;
}

  const hecho = !!EST.resueltos[e.id];
  const art = h(`<article class="ejercicio" id="${e.id}">
    <div class="ej-cab"><h3>Ejercicio ${i + 1} · ${esc(e.t)}</h3>
      <span class="chip nivel" title="${NIVEL[e.n][1]}">${NIVEL[e.n][0]} ${NIVEL[e.n][1]}</span>
      <span class="chip estado ${hecho ? "hecho" : ""}">${hecho ? "✓ Resuelto" : "Pendiente"}</span></div>
    <div class="enunciado">${e.h}</div>
    <div class="codigo">
      <div class="codigo-barra"><span class="etq">Su solución</span>${e.web ? "" : `<span class="solo-jupyter">Resuélvalo en Jupyter / Colab</span>`}</div>
      <textarea class="editor" spellcheck="false" aria-label="Editor del ejercicio ${i + 1}"></textarea>
      <div class="ej-acciones">
        ${e.web ? `<button class="btn prim" data-a="comprobar">✓ Comprobar</button><button class="btn" data-a="ejecutar">▶ Ejecutar</button>` : `<button class="btn prim" data-a="marcar">${hecho ? "Desmarcar" : "Marcar como resuelto"}</button>`}
        <button class="btn" data-a="pista">Ver pista</button>
        <button class="btn" data-a="solucion">Ver solución</button>
        <button class="btn" data-a="restablecer">Restablecer</button>
      </div>
      <div class="salida" hidden></div>
    </div>
    <div class="resultado" hidden></div>
    <div class="caja pista" hidden><b>Pista</b>${e.pista}</div>
    <div class="caja sol" hidden><b>Una solución posible</b><p>Si su código es distinto pero pasa la comprobación, también es correcto.</p>
      <div class="codigo"><pre class="resaltado"><code>${e.sh}</code></pre>${e.so ? `<div class="salida"><div class="salida-titulo"><span>Resultado</span></div><pre>${esc(e.so)}</pre></div>` : ""}</div></div>
  </article>`);
  const ta = art.querySelector(".editor"), sal = art.querySelector(".salida"), res = art.querySelector(".resultado");
  ta.value = EST.borradores[e.id] !== undefined ? EST.borradores[e.id] : e.p;
  let tGuardar;
  ta.addEventListener("input", () => { clearTimeout(tGuardar); tGuardar = setTimeout(() => { EST.borradores[e.id] = ta.value; guardar(); }, 400); });
  const marcar = valor => {
    EST.resueltos[e.id] = valor; if (!valor) delete EST.resueltos[e.id]; guardar();
    const chip = art.querySelector(".chip.estado");
    chip.className = "chip estado" + (valor ? " hecho" : ""); chip.textContent = valor ? "✓ Resuelto" : "Pendiente";
    pintarIndice(location.hash.slice(1));
    const n = document.querySelector('.pestanas [data-p="ejercicios"] .n'); if (n) n.textContent = `${resueltosMod(m)}/${m.ej.length}`;
  };
  const correr = async (conPrueba) => {
    const btns = art.querySelectorAll('[data-a="comprobar"], [data-a="ejecutar"]');
    btns.forEach(b => (b.disabled = true));
    res.hidden = true;
    sal.hidden = false; sal.innerHTML = `<div class="salida-titulo"><span>${Py.estado === "ready" ? "Ejecutando…" : "Cargando Python…"}</span></div><pre class="vacio"> </pre>`;
    const r = await Py.ejecutar(ta.value, "", conPrueba ? e.test : "");
    pintarSalida(sal, r, "Resultado");
    if (conPrueba && !r.sinMotor) {
      res.hidden = false;
      if (r.ok && r.test) { res.className = "resultado ok"; res.innerHTML = `<b>¡Correcto! Ejercicio resuelto.</b>Su código pasó todas las comprobaciones.`; marcar(true); }
      else if (!r.ok) { res.className = "resultado no"; res.innerHTML = `<b>Su código produjo un error.</b>Lea el mensaje en el recuadro oscuro: indica la línea y el tipo de error. Revise comillas, paréntesis, dos puntos y sangría.`; }
      else { res.className = "resultado no"; res.innerHTML = `<b>Todavía no.</b>${esc(r.test_msg || "Una comprobación no se cumplió.")}`; }
    }
    btns.forEach(b => (b.disabled = false));
  };
  const q = s => art.querySelector(`[data-a="${s}"]`);
  if (e.web) { q("comprobar").addEventListener("click", () => correr(true)); q("ejecutar").addEventListener("click", () => correr(false)); }
  else q("marcar").addEventListener("click", ev => { const v = !EST.resueltos[e.id]; marcar(v); ev.currentTarget.textContent = v ? "Desmarcar" : "Marcar como resuelto"; });
  q("pista").addEventListener("click", ev => { const c = art.querySelector(".pista"); c.hidden = !c.hidden; ev.currentTarget.textContent = c.hidden ? "Ver pista" : "Ocultar pista"; });
  q("solucion").addEventListener("click", ev => { const c = art.querySelector(".sol"); c.hidden = !c.hidden; ev.currentTarget.textContent = c.hidden ? "Ver solución" : "Ocultar solución"; });
  q("restablecer").addEventListener("click", () => { ta.value = e.p; delete EST.borradores[e.id]; guardar(); sal.hidden = true; res.hidden = true; ta.dispatchEvent(new Event("input")); });
  prepararEditor(ta, () => e.web && correr(false));
  return art;
}

function bloqueQuiz(m) {
  const cont = h(`<div><div class="puntaje"><span class="pt"></span><button class="btn" data-a="reiniciar">Volver a intentar</button></div></div>`);
  const actualizar = () => {
    const resp = m.quiz.map((q, i) => EST.quiz[`${m.id}-${i}`]);
    const contestadas = resp.filter(x => x !== undefined).length;
    const bien = resp.filter((x, i) => x === m.quiz[i].c).length;
    cont.querySelector(".pt").innerHTML = contestadas === m.quiz.length
      ? `<b>${bien} de ${m.quiz.length} correctas.</b> ${bien === m.quiz.length ? "Excelente: puede pasar al siguiente módulo." : "Repase las lecciones de las preguntas falladas."}`
      : `Respondidas: ${contestadas} de ${m.quiz.length}`;
  };
  m.quiz.forEach((q, i) => {
    const clave = `${m.id}-${i}`;
    const bloque = h(`<div class="pregunta"><p>${i + 1}. ${cod(q.q)}</p><div class="opciones">${q.o.map((o, k) => `<button class="opcion" data-k="${k}"><span class="l">${"abcd"[k]})</span><span>${cod(o)}</span></button>`).join("")}</div><div class="explica" hidden></div></div>`);
    const pintar = () => {
      const elegida = EST.quiz[clave];
      bloque.querySelectorAll(".opcion").forEach(b => {
        const k = +b.dataset.k; b.className = "opcion"; b.disabled = elegida !== undefined;
        if (elegida !== undefined && k === q.c) b.classList.add("bien");
        if (elegida !== undefined && k === elegida && k !== q.c) b.classList.add("mal");
      });
      const ex = bloque.querySelector(".explica");
      ex.hidden = elegida === undefined;
      if (elegida !== undefined) ex.innerHTML = `<b>${elegida === q.c ? "Correcto." : "Incorrecto."}</b> ${cod(q.x)}`;
    };
    bloque.querySelectorAll(".opcion").forEach(b => b.addEventListener("click", () => { EST.quiz[clave] = +b.dataset.k; guardar(); pintar(); actualizar(); }));
    pintar();
    cont.appendChild(bloque);
  });
  cont.querySelector('[data-a="reiniciar"]').addEventListener("click", () => {
    m.quiz.forEach((q, i) => delete EST.quiz[`${m.id}-${i}`]); guardar();
    const nuevo = bloqueQuiz(m); cont.replaceWith(nuevo);
  });
  actualizar();
  return cont;
}

function navegar() {
  const clave = (location.hash || "#inicio").slice(1).toLowerCase();
  const vista = document.getElementById("vista");
  const m = porId[clave.toUpperCase()];
  vista.innerHTML = "";
  if (m) {
    if (EST.ultima !== clave) pestanaActual = "lecciones";
    EST.ultima = clave; guardar();
    vista.appendChild(vistaModulo(m));
  } else if (clave === "glosario") vista.appendChild(vistaGlosario());
  else if (clave === "laboratorio") vista.appendChild(vistaLaboratorio());
  else vista.innerHTML = vistaInicio();
  envolverTablas(vista);
  pintarIndice(m || clave === "glosario" || clave === "laboratorio" ? clave : "inicio");
  const nav = document.getElementById("indice");
  nav.classList.remove("abierto"); document.getElementById("btnMenu").setAttribute("aria-expanded", "false");
  window.scrollTo(0, 0);
}
document.getElementById("btnMenu").addEventListener("click", ev => {
  const nav = document.getElementById("indice"); const ab = nav.classList.toggle("abierto");
  ev.currentTarget.setAttribute("aria-expanded", ab ? "true" : "false");
});
window.addEventListener("hashchange", navegar);
navegar();
setTimeout(() => Py.iniciar(), 300);

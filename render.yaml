databases:
  - name: english-assessment-db
    plan: free
    databaseName: english_assessments
    user: english_admin

services:
  - type: web
    name: english-assessment
    runtime: python
    rootDir: english_assessment
    buildCommand: "./render_build.sh"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT"
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: "3.11.0"
      - key: DATABASE_URL
        fromDatabase:
          name: english-assessment-db
          property: connectionString
